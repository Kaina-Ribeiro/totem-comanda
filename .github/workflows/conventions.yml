# Required status check "conventions": branch name, PR title, and only version lines into the
# default branch. Separate from "checks" so a title edit re-runs only this.
name: Conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - run: node .github/scripts/release.mjs check-pr --head "$HEAD" --base "$BASE" --title "$TITLE" --default-branch "$DEFAULT_BRANCH"
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
