# Release flow automation (RELEASING.md). All logic lives in .github/scripts/release.mjs.
name: Release

on:
  push:
    branches: ["release/v*", "hotfix/v*"]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      command:
        description: What to cut
        type: choice
        options: [cut-release, cut-hotfix]
      version:
        description: "cut-release only: force a line such as v1.0 (default: next minor)"
        required: false
      dry_run:
        description: Only log what would happen
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

# Tags are computed from the existing ones, so runs never overlap.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  line:
    name: rc + sync
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Tags are pushed with this token. When the v* tag ruleset cannot list GitHub Actions as a
          # bypass actor (repos owned by a personal account), RELEASE_PR_TOKEN must be an admin's.
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Tag release candidate
        run: node .github/scripts/release.mjs rc --branch "$GITHUB_REF_NAME"
      - name: Open sync PR
        run: node .github/scripts/release.mjs sync --branch "$GITHUB_REF_NAME"
        env:
          # PRs opened with GITHUB_TOKEN do not start CI; a token in RELEASE_PR_TOKEN does.
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}

  final:
    name: final
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      (startsWith(github.event.pull_request.head.ref, 'release/v') ||
       startsWith(github.event.pull_request.head.ref, 'hotfix/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Tag final and publish release
        run: node .github/scripts/release.mjs final --head "$HEAD_REF" --sha "$MERGE_SHA"
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          GH_TOKEN: ${{ github.token }}

  cut:
    name: cut
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Cut version line
        run: |
          args=("$COMMAND")
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node .github/scripts/release.mjs "${args[@]}"
        env:
          COMMAND: ${{ inputs.command }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
