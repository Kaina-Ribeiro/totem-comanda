            TAKE_OUT:
              $ref: '#/components/schemas/OrderTypeTotals'
        bestSellers:
          type: array
          items:
            type: object
            required: [itemId, name, quantity, revenue]
            properties:
              itemId:
                type: string
              name:
                type: string
              quantity:
                type: integer
              revenue:
                $ref: '#/components/schemas/Money'
    OrderTypeTotals:
      type: object
      required: [orders, revenue]
      properties:
        orders:
          type: integer
        revenue:
          $ref: '#/components/schemas/Money'
