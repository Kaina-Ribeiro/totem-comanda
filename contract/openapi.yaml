          nullable: true
        validTo:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
    AdminDiscount:
      allOf:
        - $ref: '#/components/schemas/DiscountInput'
        - type: object
          required: [id]
          properties:
            id:
              type: string
    DailyReport:
      type: object
      required: [date, ordersCount, revenue, averageTicket, byOrderType, bestSellers]
      properties:
        date:
          type: string
          format: date
        ordersCount:
          type: integer
        revenue:
          $ref: '#/components/schemas/Money'
        averageTicket:
          $ref: '#/components/schemas/Money'
        byOrderType:
          type: object
          required: [DINEIN, TAKE_OUT]
          properties:
            DINEIN:
