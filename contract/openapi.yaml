openapi: 3.0.3
info:
  title: Comanda Core API
  version: 0.2.0
  license:
    name: Proprietary
  description: |
    Contract between the Comanda BFF (Next.js server, built by Kai) and the Comanda
    Core API (Go, built by the partner). The Go API owns every business rule:
    prices, discounts, menu availability, order numbers and payments. The BFF only
    combines and formats.

    This file is the source of truth. Any change goes through a pull request that
    both partners approve. See `contract/README.md`.

    Conventions
    - Money: integer cents in BRL. `2800` means R$ 28,00. Never floats.
    - Field names: camelCase, matching the functional specs wherever they define one
      (`orderNonce`, `posCheckNumber`, `orderItems`, `isDineInAvailable`).
    - Timestamps: ISO 8601 in UTC (`2026-10-30T09:15:00Z`). Business dates are
      `YYYY-MM-DD` in the restaurant's timezone. Opening hours are local `HH:MM`.
    - IDs are opaque strings. Clients must not parse them.
    - Errors: `application/problem+json` (RFC 9457) with a stable `code`.
    - Writes that must not run twice (orders, payments, placing) require an
      `Idempotency-Key` header. Same key and same body returns the first result.
    - Guest-facing endpoints return text already resolved to the requested
      `language`. Back-office endpoints use `LocalizedText` (`pt-BR` required, `en` optional).
    - `GET /v1/devices/me/config` and `GET /v1/menus/active` return an `ETag`. Send it
      back in `If-None-Match` to get `304 Not Modified` instead of the full body.
    - `x-phase` on each operation is the MVP phase that needs it.
servers:
  - url: http://localhost:4010
    description: Prism mock (front-end work before the Go API exists)
  - url: http://localhost:8080
    description: Go API, local
tags:
  - name: Devices
    description: Kiosk and kitchen device identity, configuration and health (A01).
  - name: Kiosk
    description: Guest journey, menu, totals and discounts (A02, A03, A04, A07).
  - name: Orders
    description: Order creation, payment and placement (A08, A10).
  - name: Kitchen
    description: Kitchen screen (not in the specs).
  - name: Admin
    description: Back office for the owner (not in the specs).

paths:
  # ---------------------------------------------------------------- Devices
  /v1/devices/auth:
    post:
      tags: [Devices]
      operationId: authenticateDevice
      summary: Exchange device credentials for a short-lived token
      description: |
        Called by the BFF with the `deviceId` and `deviceSecret` set at provisioning.
        A device disabled in the back office gets `403 DEVICE_DISABLED`.
      x-phase: 0
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAuthRequest'
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceToken'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/DeviceDisabled'

  /v1/devices/me/config:
    get:
      tags: [Devices]
      operationId: getDeviceConfig
      summary: Configuration of the calling device and its restaurant
      description: |
        OP-KIOSK-06. Evaluates the menu schedule in the restaurant's timezone and
        returns `isOpen`. With no active menu, `isOpen` is false and the kiosk shows
        Lane Closed with `closedMessage` (BR-KIOSK-06, FR-109). The kiosk retries
        every 5 s on failure (BR-KIOSK-02).
      x-phase: 0
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current configuration.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceConfig'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/devices/heartbeat:
    post:
      tags: [Devices]
      operationId: sendHeartbeat
      summary: Report that the device is alive
      description: Updates `lastSeenAt` on the device. The server records the request's source IP.
      x-phase: 0
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Heartbeat'
      responses:
        '204':
          description: Recorded.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/devices/status:
    post:
      tags: [Devices]
      operationId: reportDeviceStatus
      summary: Report a status change or a key action
      description: OP-KIOSK-04. Fire-and-forget; the kiosk ignores errors.
      x-phase: 0
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceReport'
            examples:
              trading:
                value:
                  kind: STATUS
                  statusType: TRADING
                  category: APPLICATION_STATUS
                  message: Config refreshed
              journeyFailed:
                value:
                  kind: KEY_ACTION
                  type: START_JOURNEY_FAILED
                  kioskStatusType: TRADING
                  reason: FAILED_LOAD_MENU
                  message: Menu request timed out
      responses:
        '204':
          description: Recorded.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  # ---------------------------------------------------------------- Kiosk
  /v1/menus/active:
    get:
      tags: [Kiosk]
      operationId: getActiveMenu
      summary: The menu active right now, in the ENT-MENU-01 shape
      description: |
        OP-MENU-01 / OP-START-04. Called once per journey (at start and on a
        language change); the kiosk keeps it in memory until the journey ends, so a
        guest who started at 10:59 finishes on the morning menu. Sold-out items are
        left out. Text is resolved to `language`.
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Active menu.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No menu is active now (`NO_ACTIVE_MENU`); the kiosk shows Lane Closed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: /problems/no-active-menu
                title: No menu is active now
                status: 404
                code: NO_ACTIVE_MENU

  /v1/languages/{code}:
    get:
      tags: [Kiosk]
      operationId: getLanguagePack
      summary: Language pack override for the kiosk UI
      description: |
        OP-START-02. Strings the owner changed; the kiosk merges them over its
        bundled pack and falls back to the bundled pack on any error.
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/LanguageCode'
      responses:
        '200':
          description: Language pack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguagePack'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/journeys:
    post:
      tags: [Kiosk]
      operationId: startJourney
      summary: Record the start of a guest journey
      description: OP-START-01. Non-blocking for the guest; the kiosk logs failures and carries on.
      x-phase: 2
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartJourneyRequest'
      responses:
        '201':
          description: Journey recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyStarted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/journeys/{orderNonce}/events:
    post:
      tags: [Kiosk]
      operationId: recordJourneyEvent
      summary: Record a reset or an abandoned journey
      description: OP-KIOSK-01, OP-KIOSK-02, OP-START-03. Fire-and-forget.
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderNonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyEvent'
      responses:
        '204':
          description: Recorded.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/quotes:
    post:
      tags: [Kiosk]
      operationId: createQuote
      summary: Totals for the current basket
      description: |
        OP-BASKET-01. Called after every basket or discount change. Nothing is
        stored; `POST /v1/orders` reprices everything again.
      x-phase: 2
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            example:
              orderType: TAKE_OUT
              discountCode: null
              orderItems:
                - guid: 3f0c9a52-6f0e-4d7b-9c61-0d1f4b7f2a10
                  itemId: itm-croque-monsieur
                  quantity: 1
                  options:
                    - optionId: opt-pao-brioche
                      quantity: 1
                    - optionId: opt-ovo-poche
                      quantity: 1
                - guid: 8b2d1c47-2a6e-4f53-8d0b-5e9a7c3f1b22
                  itemId: itm-cappuccino
                  quantity: 1
                  options:
                    - optionId: opt-leite-integral
                      quantity: 1
                - guid: c51e7a90-4b3d-4c8e-a2f6-9d0b1e3c5f44
                  itemId: itm-fermentacao-natural
                  quantity: 1
                  options:
                    - optionId: opt-inteiro-fatiado
                      quantity: 1
      responses:
        '200':
          description: Totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderTotal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/BasketRejected'

  /v1/discounts/validate:
    post:
      tags: [Kiosk]
      operationId: validateDiscount
      summary: Check a coupon or restaurant discount code
      description: |
        OP-DISC-01 / OP-DISC-04. Returns the discount as it would apply to this
        basket. One discount per order: replacing the current one is the kiosk's
        warning (SCR-DISC-05), then it sends the new code with `currentDiscountCode`.
      x-phase: 2
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscountValidationRequest'
      responses:
        '200':
          description: Valid code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscountItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The same code is already on the order (`COUPON_ALREADY_APPLIED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: /problems/coupon-already-applied
                title: This code is already applied
                status: 409
                code: COUPON_ALREADY_APPLIED
        '422':
          description: Unknown, expired or inactive code (`INVALID_COUPON`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: /problems/invalid-coupon
                title: Invalid coupon
                status: 422
                code: INVALID_COUPON

  # ---------------------------------------------------------------- Orders
  /v1/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Store the order as AWAITING_PAYMENT
      description: |
        First half of OP-PAY-01. The Go API reprices every line from the menu and
        ignores any price sent by the client. Pending open question 1: what happens
        when the owner changed a price during the journey.
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/BasketRejected'

  /v1/orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Read an order
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/orders/{orderId}/payments:
    post:
      tags: [Orders]
      operationId: startPayment
      summary: Start a payment for the order total
      description: |
        Second half of OP-PAY-01. Until phase 4 the gateway is `SIMULATED`. A new
        payment can start after a `FAILED` or `CANCELLED` one; the order stays
        AWAITING_PAYMENT until a payment is AUTHORISED.
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPaymentRequest'
      responses:
        '201':
          description: Payment started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `ORDER_NOT_AWAITING_PAYMENT` (already paid or cancelled),
            `PAYMENT_IN_PROGRESS` (another payment is still AUTHORISING) or
            `IDEMPOTENCY_KEY_REUSED`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/payments/{paymentId}:
    get:
      tags: [Orders]
      operationId: getPayment
      summary: Poll a payment
      description: OP-PAY-02. The kiosk polls at most once per second until a final status.
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: The payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/payments/{paymentId}/cancel:
    post:
      tags: [Orders]
      operationId: cancelPayment
      summary: Cancel a payment that is still AUTHORISING
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already final (`PAYMENT_NOT_CANCELLABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/payments/{paymentId}/simulate:
    post:
      tags: [Orders]
      operationId: simulatePayment
      summary: Force the outcome of a simulated payment
      description: |
        Only while the gateway is `SIMULATED` (phases 2 and 3, staging). Lets the
        kiosk and the tests reach both the success and the error screens. Returns
        `404 SIMULATION_DISABLED` once a real gateway is configured.
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatePaymentRequest'
      responses:
        '200':
          description: Outcome applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/orders/{orderId}/place:
    post:
      tags: [Orders]
      operationId: placeOrder
      summary: Place a paid order
      description: |
        OP-PAY-03. Requires an AUTHORISED payment. Assigns `posCheckNumber` (a
        sequence per restaurant per business day, FR-1010), moves the order to
        PAID, notifies the kitchen and, from phase 4, requests the NFC-e.
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Order placed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacedOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: No authorised payment (`PAYMENT_NOT_AUTHORISED`) or `IDEMPOTENCY_KEY_REUSED`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ---------------------------------------------------------------- Kitchen
  /v1/kitchen/orders:
    get:
      tags: [Kitchen]
      operationId: listKitchenOrders
      summary: Open orders oldest first, or today's collected orders newest first
      description: |
        `open` (default): PAID, PREPARING and READY orders, oldest `placedAt` first.
        `collected` (plan G-K7, "Retirados hoje"): COLLECTED orders of the current
        business day, newest `updatedAt` first, so the kitchen can find one and move
        it back to READY.
      x-phase: 3
      security:
        - deviceAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, collected]
            default: open
      responses:
        '200':
          description: Open orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KitchenOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/kitchen/stream:
    get:
      tags: [Kitchen]
      operationId: streamKitchenEvents
      summary: Server-Sent Events for the kitchen screen
      description: |
        One event per change. `event: order.paid` and `event: order.status_changed`,
        each with a `KitchenOrder` as JSON in `data`; a cancelled or not-collected
        order is an `order.status_changed` with that status. `event: store.pace_changed`
        carries a `StorePace` whenever the pace changes, including the automatic
        resume after a pause. A `: ping` comment every 15 s keeps the connection open.
        If the stream drops, the kitchen falls back to polling `GET /v1/kitchen/orders`
        every 2 s.

        Events can arrive late or twice. Clients keep the `KitchenOrder` with the
        highest `version` and drop older ones, so a late event for an undone move
        never puts a card back.
      x-phase: 3
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: order.paid
                data: {"id":"ord-7f3a","posCheckNumber":"42","orderType":"TAKE_OUT","status":"PAID","placedAt":"2026-10-30T12:04:10Z","readyAt":null,"lines":[{"name":"Croque monsieur","quantity":1,"options":["Brioche","Ovo pochê"]}]}

        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/kitchen/orders/{orderId}/status:
    post:
      tags: [Kitchen]
      operationId: updateKitchenOrderStatus
      summary: Move an order to PREPARING, READY or COLLECTED, forward or one step back
      description: |
        Forward: PAID → PREPARING → READY → COLLECTED (PAID → READY is allowed too).
        Back one step (plan decision 2, for "Desfazer" and "Voltar uma etapa"):
        READY → PREPARING and COLLECTED → READY, only while the order's business day
        is the current one. Anything else is `409 INVALID_STATUS_TRANSITION`.

        Each change adds a `history` entry, sets `updatedAt` and increments `version`.
        With `expectedVersion`, Go applies the move only if the order is still at that
        version, else `409 STALE_ORDER_VERSION` (another screen moved it first).
      x-phase: 3
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitchenStatusUpdate'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Not allowed from the current status or day (`INVALID_STATUS_TRANSITION`), or
            the order is no longer at `expectedVersion` (`STALE_ORDER_VERSION`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/kitchen/availability:
    put:
      tags: [Kitchen]
      operationId: setKitchenAvailability
      summary: '"Acabou": mark an item or one option sold out for today, or back'
      description: |
        Plan G-K4. The kitchen marks what ran out without leaving its screen. The
        ids come from the order line (`itemId`, `choices[].optionId`). Sold out
        means today's business date, like `markItemSoldOut`; `soldOut: false` clears
        it (the 5 s undo). Orders already placed stay open (KDS BR-027). Go changes
        the menu ETag, so the next kiosk journey loads the new menu.
      x-phase: 3
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitchenAvailabilityUpdate'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenAvailability'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/kitchen/close-day:
    post:
      tags: [Kitchen]
      operationId: closeKitchenDay
      summary: '"Encerrar o dia": every open order of today becomes NOT_COLLECTED'
      description: |
        Plan G-K9. Moves every PAID, PREPARING and READY order of the current business
        day to NOT_COLLECTED (never COLLECTED: nobody handed them over), with a history
        entry, and sends one `order.status_changed` per order. The owner still sees
        them in the report. Calling it again with nothing open returns `count: 0`.
      x-phase: 3
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Closed.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer
                    description: Orders moved to NOT_COLLECTED.
                    example: 2
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/kitchen/pace:
    get:
      tags: [Kitchen]
      operationId: getKitchenPace
      summary: The store's pace (Normal, Movimentado, Pausado)
      x-phase: 3
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Current pace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorePace'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Kitchen]
      operationId: setKitchenPace
      summary: Set the store's pace from the kitchen
      description: |
        Plan G-K5 and decision 3: one store-level pace, set from the kitchen or the
