          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosEntitySwapSell'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/MenuInvalid'
    delete:
      tags: [Admin]
      operationId: deleteSwapSell
      summary: Delete an upgrade offer
      description: Refused with `422 MENU_INVALID` while an item links it.
      x-phase: 3
      security:
        - ownerAuth: []
      parameters:
        - $ref: '#/components/parameters/SwapSellId'
      responses:
        '204':
          description: Deleted.
        '401':
