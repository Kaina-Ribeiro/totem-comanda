          example: '#4E3426'
        tagsPages:
          type: array
          items:
            $ref: '#/components/schemas/TagsPage'
        scheduleEnabled:
          type: boolean
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/TagLink'
    AdminTag:
      allOf:
        - $ref: '#/components/schemas/TagInput'
        - type: object
          required: [id]
          properties:
            id:
              type: string
    CrossSellGroupInput:
      type: object
      required: [name, crossSells]
      properties:
        name:
          $ref: '#/components/schemas/LocalizedText'
        crossSells:
          type: array
          items:
            type: string
    AdminCrossSellGroup:
      allOf:
        - $ref: '#/components/schemas/CrossSellGroupInput'
        - type: object
          required: [id]
          properties:
            id:
              type: string
    DiscountInput:
      type: object
      required: [type, code, title, kind, value, active]
      properties:
        type:
          $ref: '#/components/schemas/DiscountType'
        code:
          type: string
          example: BEMVINDO10
        title:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        kind:
