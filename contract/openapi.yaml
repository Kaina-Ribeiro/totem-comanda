        - ownerAuth: []
      parameters:
        - $ref: '#/components/parameters/MenuId'
      responses:
        '200':
          description: Windows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuSchedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Admin]
      operationId: replaceMenuSchedules
      summary: Replace all opening windows of a menu
      description: Rejected with `SCHEDULE_OVERLAP` when a window overlaps another menu's, so at most one menu is active.
      x-phase: 1
      security:
        - ownerAuth: []
      parameters:
        - $ref: '#/components/parameters/MenuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MenuSchedule'
            example:
              - weekday: MON
                timeStart: '06:00'
                timeEnd: '11:00'
              - weekday: TUE
                timeStart: '06:00'
                timeEnd: '11:00'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuSchedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Overlaps another menu (`SCHEDULE_OVERLAP`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

