                open: '06:00:00'
                close: '11:00:00'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PosEntitySectionHours'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Overlaps another menu (`SCHEDULE_OVERLAP`).
          content:
