        calories:
          type: string
          nullable: true
        itemLabels:
          type: array
          items:
            type: string
        showFromPrice:
          type: boolean
        optionGroups:
          type: array
          items:
            $ref: '#/components/schemas/OptionGroup'
        crossSellGroupId:
          type: string
          nullable: true
    OptionGroupRole:
      type: string
