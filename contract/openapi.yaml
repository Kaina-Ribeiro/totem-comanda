        plu:
          type: string
          nullable: true
        name:
          type: string
        shortName:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
          description: Path or URL of the original image; the BFF resizes it.
        displayOrder:
          type: integer
        childEntities:
          type: array
          items:
            $ref: '#/components/schemas/MenuEntity'
        defaultEntity:
          type: string
          nullable: true
