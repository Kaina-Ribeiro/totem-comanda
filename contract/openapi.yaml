    Badge:
      type: object
      x-comanda: true
      description: An item badge ("Selo"). `name` resolved to `language` on guest endpoints.
      required: [id, name, textColour, backgroundColour]
      properties:
        id:
          type: string
        name:
          type: string
          example: Novidade
        textColour:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#FAF6F0'
        backgroundColour:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#4E3426'
        translations:
          $ref: '#/components/schemas/Translations'
    LightMenuResponse:
      type: object
      description: |
        MODELS 6: current price and availability only. Comanda answers it from the
        availability endpoints, with the entities they changed.
      required: [posItems]
      properties:
        posItems:
          type: array
          items:
            $ref: '#/components/schemas/LightMenuItem'
    LightMenuItem:
      type: object
      description: MODELS 6, the item shape with only the fields that matter there.
      required: [id, price, available]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/PosEntityType'
        price:
          $ref: '#/components/schemas/Money'
        dineInPriceOverride:
          type: number
          format: double
          minimum: 0
          nullable: true
        available:
          type: boolean
    AvailabilityUpdate:
      type: object
      x-comanda: true
      required: [available]
      properties:
        available:
          type: boolean
    KitchenAvailabilityUpdate:
      type: object
      x-comanda: true
      required: [id, available]
      properties:
        id:
          type: string
          description: A `CheckItem.id` (an `ITEM`, `SIZED_ITEM` or `COMBO_MEAL`).
        available:
          type: boolean

    # ------------------------------------------------------------ Store and devices
    StoreConfigurationResponse:
      type: object
      description: |
        MODELS 9.10 plus the store settings the kiosk and kitchen need (`x-comanda`). The
        dine-in / take-out toggles are gone (dine-in only). Opening is driven by menu schedules;
        `hours` is optional and informative.
      required: [locationName, languages, defaultLanguage, closedMessage, invoiceNotice, timezone, businessDayCutoff]
      properties:
        locationName:
          type: string
          example: Padaria do Pai do Brunera
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        liveFlag:
          $ref: '#/components/schemas/Flag'
        deliveryCharge:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: Not used in the pilot.
        hours:
          type: array
          items:
            $ref: '#/components/schemas/Hours'
        logo:
          type: string
          nullable: true
          x-comanda: true
          description: Address of the store logo (an uploaded `MediaAsset.url`).
        languages:
          type: array
          x-comanda: true
          description: Languages the kiosk offers.
          items:
            $ref: '#/components/schemas/LanguageCode'
        defaultLanguage:
          allOf:
            - $ref: '#/components/schemas/LanguageCode'
          x-comanda: true
        closedMessage:
          allOf:
            - $ref: '#/components/schemas/ClosedMessage'
          x-comanda: true
        invoiceNotice:
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
          x-comanda: true
          description: |
            Shown on the success screen (no NFC-e in the pilot). Default pt-BR "Se quiser nota
            fiscal, dirija-se ao caixa." / en "If you need an invoice, please go to the counter."
        pace:
          allOf:
            - $ref: '#/components/schemas/StorePace'
          x-comanda: true
          description: Current pace. Read only; ignored by `replaceStore`.
        waitMinutes:
          allOf:
            - $ref: '#/components/schemas/PaceWaitMinutes'
          x-comanda: true
          description: Minutes told to the guest per pace level. Read only; ignored by `replaceStore`.
        timezone:
          type: string
          x-comanda: true
          example: America/Sao_Paulo
        businessDayCutoff:
          type: string
          x-comanda: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Local time a business day starts (order numbers reset, report days). `HH:mm`.
          example: '04:00'
    Hours:
      type: object
      description: MODELS 9.10. Day `1` Sunday … `7` Saturday; times `HH:mm:ss.SSS`.
      required: [day, open, close]
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 7
        open:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\.[0-9]{3}$'
          example: '06:00:00.000'
        close:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\.[0-9]{3}$'
          example: '20:00:00.000'
        pickup:
          $ref: '#/components/schemas/Flag'
        delivery:
          $ref: '#/components/schemas/Flag'
        seat:
          $ref: '#/components/schemas/Flag'
        opening:
          $ref: '#/components/schemas/Flag'
    ClosedMessage:
      type: object
      x-comanda: true
      description: Both languages, so the kiosk can switch without a call.
      required: [title, description]
      properties:
        title:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
    DeviceAuthRequest:
      type: object
      x-comanda: true
      required: [deviceId, deviceSecret]
      properties:
        deviceId:
          type: string
          example: KIOSK-TBT-001
        deviceSecret:
          type: string
          example: s3cr3t-from-provisioning
    DeviceToken:
      type: object
      x-comanda: true
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Seconds.
          example: 900
    DeviceKind:
      type: string
      enum: [KIOSK, KITCHEN]
    DeviceConfig:
      type: object
      x-comanda: true
      description: The calling device's settings plus the store (`StoreConfigurationResponse`, with `pace` and `waitMinutes`).
      required: [kioskID, kind, idleTimerIntervalMilliseconds, printerEnabled, maintenanceMode, atCapacityMode, isOpen, store, activeMenu, nextOpeningAt, serverTime, paymentTerminalId]
      properties:
        kioskID:
          type: string
          example: KIOSK-TBT-001
        kind:
          $ref: '#/components/schemas/DeviceKind'
        idleTimerIntervalMilliseconds:
          type: integer
          description: Idle reset; 0 disables it. Pilot default 45000.
          example: 45000
        printerEnabled:
          type: boolean
          description: False until the hardware phase.
        maintenanceMode:
          type: boolean
        atCapacityMode:
          type: boolean
          description: True while this device is at capacity, or while the store's pace is PAUSED.
        isOpen:
          type: boolean
          description: True when a menu is active now.
        store:
          $ref: '#/components/schemas/StoreConfigurationResponse'
        activeMenu:
          $ref: '#/components/schemas/ActiveMenuRef'
        nextOpeningAt:
          type: string
          format: date-time
          nullable: true
          description: When the next menu starts, if closed.
        serverTime:
          type: string
          format: date-time
        paymentTerminalId:
          type: string
          nullable: true
          x-comanda: true
          description: The Mercado Pago Point terminal next to this kiosk; null = card payment unavailable.
          example: PAX_A910__SMARTPOS1495357742
    ActiveMenuRef:
      type: object
      x-comanda: true
      nullable: true
      required: [menuId, name, validUntil]
      properties:
        menuId:
          type: string
          example: mnu-tarde
        name:
          type: string
          example: Tarde
        validUntil:
          type: string
          format: date-time
          description: When this menu stops being active.
    Heartbeat:
      type: object
      x-comanda: true
      required: [appVersion, screenResolution]
      properties:
        appVersion:
          type: string
          example: 0.4.0+3f9c2a1
        screenResolution:
          type: string
          example: 1080x1920
        ip:
          type: string
          description: LAN address if the device knows it; the server also records the source IP.
    DeviceReport:
      x-comanda: true
      oneOf:
        - $ref: '#/components/schemas/DeviceStatusReport'
        - $ref: '#/components/schemas/DeviceKeyActionReport'
      discriminator:
        propertyName: kind
        mapping:
          STATUS: '#/components/schemas/DeviceStatusReport'
          KEY_ACTION: '#/components/schemas/DeviceKeyActionReport'
    KioskStatusType:
      type: string
      enum: [APPLICATION_STARTING, APPLICATION_START_FAILED, TRADING, UNAVAILABLE]
    DeviceStatusReport:
      type: object
      required: [kind, statusType, category]
      properties:
        kind:
          type: string
          enum: [STATUS]
        statusType:
          $ref: '#/components/schemas/KioskStatusType'
        reason:
          type: string
          enum: [MAINTENANCE, AT_CAPACITY, STORE_CLOSED, UNKNOWN]
        category:
          type: string
          enum: [APPLICATION_STATUS, DISPLAYING_SCREEN]
        message:
          type: string
    DeviceKeyActionReport:
      type: object
      required: [kind, type, kioskStatusType]
      properties:
        kind:
          type: string
          enum: [KEY_ACTION]
        type:
          type: string
          enum: [START_JOURNEY_SUCCESS, START_JOURNEY_FAILED, APPLICATION_START_FAILED]
        kioskStatusType:
          $ref: '#/components/schemas/KioskStatusType'
        reason:
          type: string
          enum: [FAILED_START_JOURNEY, FAILED_LOAD_MENU]
        message:
          type: string
    LanguagePack:
      type: object
      x-comanda: true
      required: [code, name, strings]
      properties:
        code:
          $ref: '#/components/schemas/LanguageCode'
        name:
          type: string
        strings:
          type: object
          additionalProperties:
            type: string
          example:
            attract.cta: Toque para começar
    StartJourneyRequest:
      type: object
      x-comanda: true
      required: [orderNonce, language]
      properties:
        orderNonce:
          type: string
          format: uuid
          description: Generated by the kiosk at journey start.
        language:
          $ref: '#/components/schemas/LanguageCode'
    JourneyStarted:
      type: object
      x-comanda: true
      required: [journeyStartedTimestamp]
      properties:
        journeyStartedTimestamp:
          type: string
          format: date-time
    JourneyEvent:
      type: object
      x-comanda: true
      required: [type]
      properties:
        type:
          type: string
          enum: [RESET, IDLE_TIMEOUT, CANCELLED_BY_GUEST]
        orderTotal:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Basket total at the moment of the event, as last priced by Go.

    # ------------------------------------------------------------ Pace
    Pace:
      type: string
      enum: [NORMAL, BUSY, PAUSED]
      description: |
        NORMAL: the kiosk sells, wait = NORMAL minutes. BUSY ("Movimentado"): the kiosk sells,
        wait = BUSY minutes. PAUSED: every kiosk shows the at-capacity screen until
        `pausedUntil`, when Go returns to NORMAL by itself.
    StorePace:
      type: object
      x-comanda: true
      required: [pace, pausedUntil, changedAt, changedBy, waitMinutes]
      properties:
        pace:
          $ref: '#/components/schemas/Pace'
        pausedUntil:
          type: string
          format: date-time
          nullable: true
        changedAt:
          type: string
          format: date-time
        changedBy:
          type: string
          enum: [KITCHEN, OWNER, SYSTEM]
        waitMinutes:
          $ref: '#/components/schemas/PaceWaitMinutes'
    StorePaceUpdate:
      type: object
      x-comanda: true
      required: [pace]
      properties:
        pace:
          $ref: '#/components/schemas/Pace'
        pauseMinutes:
          type: integer
          enum: [15, 30]
          description: Required when `pace` is PAUSED, ignored otherwise.
    PaceWaitMinutes:
      type: object
      x-comanda: true
      required: [NORMAL, BUSY]
      properties:
        NORMAL:
          type: integer
          minimum: 1
          maximum: 120
          example: 8
        BUSY:
          type: integer
          minimum: 1
          maximum: 120
          example: 15

    # ------------------------------------------------------------ Orders (MODELS 8 and 9)
    OrderType:
      type: string
      description: MODELS 8.1. The pilot accepts only `DINEIN` (SPEC D-7).
      enum: [DINEIN, TAKE_OUT, PICKUP, DELIVERY, PAY_AT_TABLE, DRIVE_THRU, DELIVEROO]
    OrderItem:
      type: object
      description: |
        MODELS 8.2. One basket line; option lines go in the product line's `modifiers`
        (nested options included), the tree given by `parentId` → `uniqueId`. The kiosk sends
        one product line per unit (`quantity: 1`). Comanda difference: the price fields are
        optional on requests (MODELS marks `itemPrice` required) because the kiosk sends ids
        only; Go ignores any price or total a client sends.
      required: [id, quantity, uniqueId]
      properties:
        id:
          type: string
          description: The menu entity id of the product, option or size.
        name:
          type: string
          nullable: true
        plu:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 1
        itemPrice:
          type: number
          format: double
          minimum: 0
          nullable: true
        itemDiscount:
          type: number
          format: double
          minimum: 0
          nullable: true
        itemTax:
          type: number
          format: double
          minimum: 0
          nullable: true
        itemNet:
          type: number
          format: double
          minimum: 0
          nullable: true
        itemTotal:
          type: number
          format: double
          minimum: 0
          nullable: true
        discountRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
        totalPrice:
          type: number
          format: double
          minimum: 0
          nullable: true
        totalDiscount:
          type: number
          format: double
          minimum: 0
          nullable: true
        totalTax:
          type: number
          format: double
          minimum: 0
          nullable: true
        totalNet:
          type: number
          format: double
          minimum: 0
          nullable: true
        total:
          type: number
          format: double
          minimum: 0
          nullable: true
        factor:
          type: number
          nullable: true
        specialNotes:
          type: string
          nullable: true
          maxLength: 140
          description: The guest's note for this line (the kiosk's item note).
        modifierType:
          $ref: '#/components/schemas/ModifierType'
        uniqueId:
          type: integer
          description: Identifies the line within the basket.
        parentId:
          type: integer
          nullable: true
          description: Option lines only. `uniqueId` of the line this option belongs to (the parent option for a nested one).
        position:
          type: integer
          nullable: true
          description: Option lines only. The option's position inside its group (1-based, link order).
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/Tax'
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/Discount'
    Tax:
      type: object
      description: MODELS 8.3 (also `ITax`). Always empty lists in the pilot.
      required: [id, taxTotal]
      properties:
        id:
          type: string
        name:
          type: string
        taxRate:
          $ref: '#/components/schemas/Fraction'
        taxTotal:
          $ref: '#/components/schemas/Money'
        netTotal:
          $ref: '#/components/schemas/Money'
        quantity:
          type: integer
    Discount:
      type: object
      description: MODELS 8.4, a discount in requests.
      required: [id]
      properties:
        id:
          type: string
        name:
          type: string
        rate:
          $ref: '#/components/schemas/Fraction'
        value:
          $ref: '#/components/schemas/Money'
        providerType:
          type: string
        uniqueItemId:
          type: integer
    ServiceCharge:
      type: object
      description: MODELS 8.5. Not used in the pilot.
      required: [id, value]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        value:
          $ref: '#/components/schemas/Money'
    Customer:
      type: object
      description: MODELS 8.6. Personal data; never logged. Not collected by the kiosk in the pilot.
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
    Address:
      type: object
      description: MODELS 8.7. Not used in the pilot (dine-in only).
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        stateOrProvince:
          type: string
        postCode:
          type: string
        country:
          type: string
    Payment:
      type: object
      description: |
        MODELS 8.8. In the pilot, copied from the APPROVED `PaymentSession`: `tenderId`
        `MP_PIX` or `MP_POINT`, `tenderRef` = the Mercado Pago payment id.
      required: [tenderId, amount]
      properties:
        tenderId:
          type: string
          example: MP_PIX
        tenderRef:
          type: string
          nullable: true
          example: '1319876543'
        amount:
          $ref: '#/components/schemas/Money'
        tipAmount:
          type: number
          format: double
          minimum: 0
          nullable: true
        donationAmount:
          type: number
          format: double
          minimum: 0
          nullable: true
        customer:
          $ref: '#/components/schemas/Customer'
        collectPaymentOnDelivery:
          type: boolean
          nullable: true
        authCode:
          type: string
          nullable: true
        cardScheme:
          type: string
          nullable: true
          example: VISA
        cardLast4Digits:
          type: string
          nullable: true
          pattern: '^[0-9]{4}$'
    ExternalUserId:
      type: object
      description: MODELS 8.9. Not used in the pilot.
      required: [externalId, system]
      properties:
        externalId:
          type: string
        system:
          type: string
    Award:
      type: object
      description: |
        MODELS 8.10. A coupon is an award with `type: CODE` and `id` = the code; Go answers
        it with `description` and `discountAmount`.
      required: [id]
      properties:
        id:
          type: string
        posId:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        type:
          type: string
          description: '`PSEUDO_CURRENCY`, `CODE`, `PROMOTION` or `ITEM`. The pilot uses `CODE`.'
          example: CODE
        source:
          type: string
          nullable: true
        isExternal:
          type: boolean
          nullable: true
        sourceExternalId:
          type: string
          nullable: true
        discountAmount:
          type: number
          format: double
          minimum: 0
          nullable: true
    OrderRequest:
      type: object
      description: |
        MODELS 8.11 without `config` (SPEC D-5). The totals a client sends are ignored: Go
        prices the basket itself.
      required: [orderType, items]
      properties:
        orderId:
          type: integer
          nullable: true
        basketId:
          type: string
          nullable: true
          description: The basket from an earlier `POST /v2/totals`. Required by discounts, payments and orders.
        orderType:
          $ref: '#/components/schemas/OrderType'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        subTotal:
          type: number
          format: double
          minimum: 0
          nullable: true
        discountTotal:
          type: number
          format: double
          minimum: 0
          nullable: true
        serviceChargeTotal:
          type: number
          format: double
          minimum: 0
          nullable: true
        taxTotal:
          type: number
          format: double
          minimum: 0
          nullable: true
        total:
          type: number
          format: double
          minimum: 0
          nullable: true
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/Discount'
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/Tax'
        serviceCharges:
          type: array
          items:
            $ref: '#/components/schemas/ServiceCharge'
    TotalsRequest:
      description: MODELS 8.11. Adds nothing to `OrderRequest`.
      allOf:
        - $ref: '#/components/schemas/OrderRequest'
    SubmitOrderRequest:
      description: MODELS 8.12. `payments` holds the approved payment; delivery, pickup and fiscal fields are not used in the pilot.
      allOf:
        - $ref: '#/components/schemas/OrderRequest'
        - type: object
          properties:
            payments:
              type: array
              items:
                $ref: '#/components/schemas/Payment'
            customer:
              $ref: '#/components/schemas/Customer'
            address:
              $ref: '#/components/schemas/Address'
            externalUserIds:
              type: array
              items:
                $ref: '#/components/schemas/ExternalUserId'
            specialNotes:
              type: string
              nullable: true
            notes:
              type: string
              nullable: true
            dateToFire:
              type: string
              nullable: true
            pickupTime:
              type: string
              nullable: true
            dateCreated:
              type: string
              nullable: true
            openCheck:
              type: boolean
              nullable: true
            invoiceCpfCnpj:
              type: string
              nullable: true
              description: Ignored in the pilot (no NFC-e).
    DiscountRequest:
      description: MODELS 8.13. The basket the coupon is for, plus the codes to apply or remove.
      allOf:
        - $ref: '#/components/schemas/OrderRequest'
        - type: object
          properties:
            awards:
              type: array
              items:
                $ref: '#/components/schemas/Award'
            codesToRemove:
              type: array
              items:
                type: string
    DiscountResponse:
      type: object
      description: MODELS 9.8.
      required: [awards]
      properties:
        awards:
          type: array
          items:
            $ref: '#/components/schemas/Award'
    CheckItem:
      type: object
      description: |
        MODELS 9.1. One priced line. A product line's `total` includes its options; option lines
        in `modifiers` carry their own share for display. Lines are named in `language` on totals
        and in pt-BR on orders.
      required: [id, quantity]
      properties:
        id:
          type: string
        name:
          type: string
        quantity:
          type: integer
        price:
          $ref: '#/components/schemas/Money'
        netTotal:
          $ref: '#/components/schemas/Money'
        taxTotal:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/CheckItem'
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/Tax'
        specialNotes:
          type: string
          nullable: true
          x-comanda: true
          description: The guest's note for this line, shown in the kitchen.
    ResponseDiscount:
      type: object
      description: MODELS 9.2 (`IDiscount`), a discount in responses. A coupon has `id` = its code.
      required: [id]
      properties:
        id:
          type: string
        name:
          type: string
        rate:
          $ref: '#/components/schemas/Fraction'
        value:
          $ref: '#/components/schemas/Money'
        locked:
          type: boolean
    TotalsResponse:
      type: object
      description: MODELS 9.4. `tax` is `0` and `taxes` is `[]` in the pilot. Comanda always returns `basketId`.
      required: [basketId, subTotal, tax, total]
      properties:
        basketId:
          type: string
        subTotal:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        serviceChargeTotal:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/CheckItem'
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/Tax'
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/ResponseDiscount'
    SubmitOrderResponse:
      description: |
        MODELS 9.5 plus the kitchen lifecycle (`x-comanda`). `number` is the order id in this
        API; `customerCheckNumber` is the short number on the success screen. Also the kitchen's
        order. Fiscal fields stay empty in the pilot.
      allOf:
        - $ref: '#/components/schemas/TotalsResponse'
        - type: object
          required: [number, customerCheckNumber, orderType, status, version, placedAt, history]
          properties:
            number:
              type: string
              example: 20261110-0042
            customerCheckNumber:
              type: string
              example: '42'
            displayText:
              type: string
              nullable: true
            text:
              type: string
              nullable: true
            orderType:
              $ref: '#/components/schemas/OrderType'
            externalUserIds:
              type: array
              items:
                $ref: '#/components/schemas/ExternalUserId'
            fiscalQrCodeData:
              type: string
              nullable: true
            fiscalAccessKey:
              type: string
              nullable: true
            status:
              allOf:
                - $ref: '#/components/schemas/OrderStatus'
              x-comanda: true
            version:
              type: integer
              minimum: 1
              x-comanda: true
              description: 1 when placed, +1 on every status change. Clients keep the highest.
            placedAt:
              type: string
              format: date-time
              x-comanda: true
            history:
              type: array
              x-comanda: true
              description: Every status the order had, oldest first. Starts with PAID.
              items:
                $ref: '#/components/schemas/OrderStatusChange'
    OrderStatus:
      type: string
      x-comanda: true
      description: |
        An order exists only once paid. NOT_COLLECTED: still open when the kitchen closed the
        day. CANCELLED: cancelled by the owner (refund in the Mercado Pago panel).
      enum: [PAID, PREPARING, READY, COLLECTED, NOT_COLLECTED, CANCELLED]
    OrderStatusChange:
      type: object
      x-comanda: true
      required: [status, at, by]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
        at:
          type: string
          format: date-time
        by:
          type: string
          enum: [KIOSK, KITCHEN, OWNER, SYSTEM]
          description: KIOSK for the payment, SYSTEM for automatic changes (webhook placement, resume).
    KitchenStatusUpdate:
      type: object
      x-comanda: true
      required: [status]
      properties:
        status:
          type: string
          enum: [PREPARING, READY, COLLECTED]
        expectedVersion:
          type: integer
          minimum: 1
    CloseDayResult:
      type: object
      x-comanda: true
      required: [count]
      properties:
        count:
          type: integer
          description: Orders moved to NOT_COLLECTED.
          example: 2
    OrderCancelRequest:
      type: object
      x-comanda: true
      required: [reason]
      properties:
        reason:
          type: string
          enum: [ITEM_SOLD_OUT, CANNOT_PREPARE, OTHER]
        note:
          type: string
          maxLength: 140
          nullable: true

    # ------------------------------------------------------------ Payments
    PaymentMethod:
      type: string
      x-comanda: true
      enum: [PIX, CARD]
    PaymentSessionStatus:
      type: string
      x-comanda: true
      enum: [PENDING, APPROVED, DECLINED, EXPIRED, CANCELLED]
    CreatePaymentRequest:
      type: object
      x-comanda: true
      required: [basketId, method, amount]
      properties:
        basketId:
          type: string
        method:
          $ref: '#/components/schemas/PaymentMethod'
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Must equal the basket's current total (`BASKET_CHANGED` otherwise).
    PaymentSession:
      type: object
      x-comanda: true
      description: One Mercado Pago attempt for a basket (SPEC 4.6).
      required: [id, basketId, method, amount, status, tenderId, tenderRef, qrCode, copyPaste, expiresAt, terminalId, createdAt]
      properties:
        id:
          type: string
          example: pay-8f2c
        basketId:
          type: string
        method:
          $ref: '#/components/schemas/PaymentMethod'
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/PaymentSessionStatus'
        tenderId:
          type: string
          enum: [MP_PIX, MP_POINT]
          description: Copy into `Payment.tenderId`.
        tenderRef:
          type: string
          nullable: true
          description: The Mercado Pago payment id once known. Copy into `Payment.tenderRef`.
        qrCode:
          type: string
          nullable: true
          description: PIX only. The QR image as a `data:image/png;base64,…` URL.
        copyPaste:
          type: string
          nullable: true
          description: PIX only. The "copia e cola" text.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: PIX only. 5 minutes after creation; still PENDING then = EXPIRED.
        terminalId:
          type: string
          nullable: true
          description: CARD only. The Point terminal the charge was sent to.
        createdAt:
          type: string
          format: date-time
        cardScheme:
          type: string
          nullable: true
        cardLast4Digits:
          type: string
          nullable: true
        authCode:
          type: string
          nullable: true
    SimulatePaymentRequest:
      type: object
      x-comanda: true
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [APPROVED, DECLINED, EXPIRED]

    # ------------------------------------------------------------ Admin
    OwnerLoginRequest:
      type: object
      x-comanda: true
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    OwnerToken:
      type: object
      x-comanda: true
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Seconds.
    MediaAsset:
      description: An uploaded picture, as the `IMAGE` entity it became, plus its size.
      allOf:
        - $ref: '#/components/schemas/PosEntityImage'
        - type: object
          required: [width, height]
          properties:
            width:
              type: integer
              x-comanda: true
            height:
              type: integer
              x-comanda: true
    DeviceStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    DeviceInput:
      type: object
      x-comanda: true
      required: [name, kind, status, idleTimerIntervalMilliseconds, printerEnabled, maintenanceMode, atCapacityMode, paymentTerminalId]
      properties:
        name:
          type: string
          example: Totem da entrada
        kind:
          $ref: '#/components/schemas/DeviceKind'
        status:
          $ref: '#/components/schemas/DeviceStatus'
        idleTimerIntervalMilliseconds:
          type: integer
          minimum: 0
          example: 45000
        printerEnabled:
          type: boolean
        maintenanceMode:
          type: boolean
        atCapacityMode:
          type: boolean
        paymentTerminalId:
          type: string
          nullable: true
          description: The Mercado Pago Point terminal next to this kiosk.
    AdminDevice:
      allOf:
        - $ref: '#/components/schemas/DeviceInput'
        - type: object
          required: [id, online, appVersion, lastSeenAt, ip, screenResolution]
          properties:
            id:
              type: string
              example: KIOSK-TBT-001
            online:
              type: boolean
              description: A heartbeat arrived in the last 3 minutes.
            appVersion:
              type: string
              nullable: true
            lastSeenAt:
              type: string
              format: date-time
              nullable: true
            ip:
              type: string
              nullable: true
            screenResolution:
              type: string
              nullable: true
    DeviceCredentials:
      type: object
      x-comanda: true
      required: [device, deviceSecret]
      properties:
        device:
          $ref: '#/components/schemas/AdminDevice'
        deviceSecret:
          type: string
          description: Shown once. The Go API stores only its hash.
    AdminMenu:
      type: object
      x-comanda: true
      description: A scheduled menu. `isActive` and `forcedUntil` are kept by Go and ignored on save.
      required: [id, name, root]
      properties:
        id:
          type: string
          example: mnu-tarde
        name:
          type: string
          example: Tarde
        translations:
          $ref: '#/components/schemas/Translations'
        root:
          type: array
          description: Top-level `CATEGORY` links, in display order.
          items:
            $ref: '#/components/schemas/Link'
        isActive:
          type: boolean
        forcedUntil:
          type: string
          format: date-time
          nullable: true
    ForceMenuRequest:
      type: object
      x-comanda: true
      required: [until]
      properties:
        until:
          type: string
          format: date-time
    AdminItem:
      description: A product, option, size, sized item or combo meal, with `translations`.
      oneOf:
        - $ref: '#/components/schemas/PosEntityItem'
        - $ref: '#/components/schemas/PosEntityComboMeal'
      discriminator:
        propertyName: type
        mapping:
          ITEM: '#/components/schemas/PosEntityItem'
          SIZED_ITEM: '#/components/schemas/PosEntityItem'
          COMBO_MEAL: '#/components/schemas/PosEntityComboMeal'
    DiscountRule:
      type: object
      x-comanda: true
      description: |
        A coupon (SPEC 4.5), applied to a basket as an `Award` of type `CODE`. One per order.
        PERCENT: `value` is whole percent 1–100, applied per line and rounded half up to the
        cent. FIXED: `value` is an amount in BRL, never more than the basket. `maxDiscount` caps
        the discount; `minOrderTotal` is checked against the subtotal.
      required: [id, code, name, type, value, active]
      properties:
        id:
          type: string
        code:
          type: string
          pattern: '^[A-Z0-9]{3,20}$'
          example: BEMVINDO10
        name:
          type: string
          description: Shown to the guest as the award `description` (pt-BR).
          example: 10% de boas-vindas
        translations:
          $ref: '#/components/schemas/Translations'
        type:
          type: string
          enum: [PERCENT, FIXED]
        value:
          type: number
          minimum: 0.01
          example: 10
        minOrderTotal:
          type: number
          format: double
          minimum: 0
          nullable: true
        maxDiscount:
          type: number
          format: double
          minimum: 0
          nullable: true
        maxUses:
          type: integer
          minimum: 1
          nullable: true
        usesCount:
          type: integer
          minimum: 0
          description: Orders placed with this coupon. Kept by Go; ignored on save.
        validFrom:
          type: string
          format: date-time
          nullable: true
        validTo:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
    DailyReport:
      type: object
      x-comanda: true
      description: One business day, amounts in BRL. Cancelled orders count only in `cancelledCount`.
      required: [date, ordersCount, revenue, averageTicket, discountTotal, cancelledCount, notCollectedCount, bestSellers]
      properties:
        date:
          type: string
          format: date
        ordersCount:
          type: integer
        revenue:
          $ref: '#/components/schemas/Money'
        averageTicket:
          $ref: '#/components/schemas/Money'
        discountTotal:
          $ref: '#/components/schemas/Money'
        cancelledCount:
          type: integer
        notCollectedCount:
          type: integer
        bestSellers:
          type: array
          items:
            type: object
            required: [id, name, quantity, revenue]
            properties:
              id:
                type: string
              name:
                type: string
              quantity:
                type: integer
              revenue:
                $ref: '#/components/schemas/Money'
