        - $ref: '#/components/parameters/CrossSellGroupId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/discounts:
    get:
      tags: [Admin]
      operationId: listDiscounts
      summary: Coupons and restaurant discounts
      x-phase: 1
      security:
        - ownerAuth: []
      responses:
        '200':
          description: Discounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDiscount'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Admin]
      operationId: createDiscount
      summary: Create a coupon or restaurant discount
      x-phase: 1
      security:
        - ownerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscountInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDiscount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Code already used by another discount (`DISCOUNT_CODE_TAKEN`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/admin/discounts/{discountId}:
    put:
      tags: [Admin]
      operationId: replaceDiscount
      summary: Replace a discount
      x-phase: 1
      security:
        - ownerAuth: []
      parameters:
        - $ref: '#/components/parameters/DiscountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscountInput'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDiscount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Code already used by another discount (`DISCOUNT_CODE_TAKEN`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Admin]
      operationId: deleteDiscount
      summary: Delete a discount
      x-phase: 1
      security:
        - ownerAuth: []
      parameters:
        - $ref: '#/components/parameters/DiscountId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/orders/{orderId}/cancel:
    post:
      tags: [Admin]
      operationId: cancelOrder
      summary: Cancel a paid order that cannot be made
      description: |
        Plan G-K11 and decision 12. Confirmed with the owner's login, not a PIN: the
        kitchen screen asks for the owner's email and password, its BFF signs in with
        `POST /v1/admin/auth/login`, calls this with that token and drops the token.
        Allowed from PAID, PREPARING and READY; anything else is
        `409 INVALID_STATUS_TRANSITION`. Sets CANCELLED with a history entry by OWNER
        and sends `order.status_changed`. While the gateway is SIMULATED there is no
        refund; from phase 4 a cancel of a paid order also needs the refund flow.
        Cancelled orders count on their own line in the report, never in revenue.
      x-phase: 3
      security:
        - ownerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCancelRequest'
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already collected, cancelled or not collected (`INVALID_STATUS_TRANSITION`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/pace:
    get:
      tags: [Admin]
      operationId: getStorePace
      summary: The store's pace, for the back office home
      x-phase: 3
      security:
        - ownerAuth: []
      responses:
        '200':
          description: Current pace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorePace'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Admin]
      operationId: setStorePace
      summary: Set the store's pace from the back office ("Pausar" on Início)
      x-phase: 3
      security:
        - ownerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorePaceUpdate'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorePace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/admin/pace/wait-minutes:
    put:
      tags: [Admin]
      operationId: setPaceWaitMinutes
      summary: Minutes shown to the guest for each pace level
      description: |
        Plan decision 4: `waitTime` is minutes per pace level, set by the owner.
        Defaults: NORMAL 8, BUSY 15.
      x-phase: 3
      security:
        - ownerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaceWaitMinutes'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorePace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/admin/reports/daily:
    get:
      tags: [Admin]
      operationId: getDailyReport
      summary: Orders, revenue, best sellers and average ticket for one business day
      x-phase: 3
      security:
        - ownerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          description: Business date in the restaurant's timezone.
          schema:
            type: string
            format: date
          example: '2026-10-30'
      responses:
        '200':
          description: Report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReport'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    deviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from `POST /v1/devices/auth`. Kiosk and kitchen devices.
    ownerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from `POST /v1/admin/auth/login`. Held by the back-office BFF.

  headers:
    ETag:
      description: Version of the representation. Send it back in `If-None-Match`.
      schema:
        type: string
      example: '"menu-mnu-manha-v17-pt-BR"'

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A UUID per logical attempt. Retrying with the same key and body returns the first result.
      schema:
        type: string
        format: uuid
      example: 6d1f2c9e-3b4a-4e5f-8a7b-9c0d1e2f3a4b
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    Language:
      name: language
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/LanguageCode'
    OrderNonce:
      name: orderNonce
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
    MenuId:
      name: menuId
      in: path
      required: true
      schema:
        type: string
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    OptionGroupId:
      name: optionGroupId
      in: path
      required: true
      schema:
        type: string
    TagId:
      name: tagId
      in: path
      required: true
      schema:
        type: string
    CrossSellGroupId:
      name: crossSellGroupId
      in: path
      required: true
      schema:
        type: string
    DiscountId:
      name: discountId
      in: path
      required: true
      schema:
        type: string

  responses:
    NotModified:
      description: The client's copy is current (matching `If-None-Match`).
    Unauthorized:
      description: Missing, expired or invalid token (`UNAUTHORIZED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/unauthorized
            title: Unauthorized
            status: 401
            code: UNAUTHORIZED
    InvalidCredentials:
      description: Wrong id, secret, email or password (`INVALID_CREDENTIALS`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/invalid-credentials
            title: Invalid credentials
            status: 401
            code: INVALID_CREDENTIALS
    DeviceDisabled:
      description: The device was disabled in the back office (`DEVICE_DISABLED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/device-disabled
            title: Device disabled
            status: 403
            code: DEVICE_DISABLED
    NotFound:
      description: No such resource (`NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/not-found
            title: Not found
            status: 404
            code: NOT_FOUND
    ValidationFailed:
      description: The body breaks a field rule (`VALIDATION_FAILED`); `errors` lists each field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/validation-failed
            title: Validation failed
            status: 422
            code: VALIDATION_FAILED
            errors:
              - field: orderItems[0].quantity
                message: must be at least 1
    IdempotencyConflict:
      description: The `Idempotency-Key` was already used with a different body (`IDEMPOTENCY_KEY_REUSED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/idempotency-key-reused
            title: Idempotency key reused with a different body
            status: 409
            code: IDEMPOTENCY_KEY_REUSED
    BasketRejected:
      description: |
        The basket cannot be priced: `BASKET_ITEM_LIMIT_EXCEEDED` (FR-421),
        `ITEM_UNAVAILABLE` (sold out or not on the active menu; `detail` names it),
        `ORDER_TYPE_UNAVAILABLE`, `INVALID_COUPON`, `NO_ACTIVE_MENU` or
        `VALIDATION_FAILED`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/basket-item-limit-exceeded
            title: Too many items in the basket
            status: 422
            code: BASKET_ITEM_LIMIT_EXCEEDED

  schemas:
    # ------------------------------------------------------------ Common
    Problem:
      type: object
      description: RFC 9457 problem details with a stable `code` the clients switch on.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ProblemCode'
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    ProblemCode:
      type: string
      enum:
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - DEVICE_DISABLED
        - NOT_FOUND
        - VALIDATION_FAILED
        - IDEMPOTENCY_KEY_REUSED
        - NO_ACTIVE_MENU
        - ITEM_UNAVAILABLE
        - ORDER_TYPE_UNAVAILABLE
        - BASKET_ITEM_LIMIT_EXCEEDED
        - INVALID_COUPON
        - COUPON_ALREADY_APPLIED
        - ORDER_NOT_AWAITING_PAYMENT
        - PAYMENT_IN_PROGRESS
        - PAYMENT_NOT_CANCELLABLE
        - PAYMENT_NOT_AUTHORISED
        - SIMULATION_DISABLED
        - INVALID_STATUS_TRANSITION
        - SCHEDULE_OVERLAP
        - DISCOUNT_CODE_TAKEN
        - STALE_ORDER_VERSION
    Money:
      type: integer
      format: int64
      minimum: 0
      description: Integer cents in BRL. 2800 = R$ 28,00.
      example: 2800
    LanguageCode:
      type: string
      enum: [pt-BR, en]
    OrderType:
      type: string
      description: ENT-START-03.
      enum: [DINEIN, TAKE_OUT]
    LocalizedText:
      type: object
      required: [pt-BR]
      properties:
        pt-BR:
          type: string
        en:
          type: string
      example:
        pt-BR: Fermentação natural
        en: Sourdough
    ServicePriceOverride:
      type: object
      description: Price per order type when it differs from `price`.
      properties:
        DINEIN:
          $ref: '#/components/schemas/Money'
        TAKE_OUT:
          $ref: '#/components/schemas/Money'
    ServiceAvailability:
      type: object
      required: [DINEIN, TAKE_OUT]
      properties:
        DINEIN:
          type: boolean
        TAKE_OUT:
          type: boolean
    Weekday:
      type: string
      enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
    LocalTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      example: '06:00'

    # ------------------------------------------------------------ Devices
    DeviceAuthRequest:
      type: object
      required: [deviceId, deviceSecret]
      properties:
        deviceId:
          type: string
          example: KIOSK-TBT-001
        deviceSecret:
          type: string
          example: s3cr3t-from-provisioning
    DeviceToken:
      type: object
      example:
        accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJLSU9TSy1UQlQtMDAxIn0.sig
        tokenType: Bearer
        expiresIn: 900
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Seconds.
          example: 900
    DeviceKind:
      type: string
      enum: [KIOSK, KITCHEN]
    DeviceConfig:
      type: object
      example:
        kioskID: KIOSK-TBT-001
        kind: KIOSK
        idleTimerIntervalMilliseconds: 20000
        printerEnabled: false
        maintenanceMode: false
        atCapacityMode: false
        pace:
          pace: NORMAL
          pausedUntil: null
        isOpen: true
        restaurant:
          locationId: rst-padaria-01
          name: '[Nome da padaria]'
          logo: /media/logo-padaria.png
          currency: BRL
          timezone: America/Sao_Paulo
          defaultLanguage: pt-BR
          supportedLanguages:
            - code: pt-BR
              name: Português
            - code: en
              name: English
          isDineInAvailable: true
          isTakeOutAvailable: true
          closedMessage:
            title:
              pt-BR: Fechado agora
              en: Closed now
            description:
              pt-BR: Voltamos em breve.
              en: We'll be back soon.
          posCheckNumberDisplayLength: 2
        activeMenu:
          id: mnu-manha
          name: Manhã
          until: '2026-10-30T14:00:00Z'
        nextOpeningAt: null
        serverTime: '2026-10-30T12:00:00Z'
      description: ENT-KIOSK-01 with the restaurant's brand config.
      required: [kioskID, kind, idleTimerIntervalMilliseconds, printerEnabled, maintenanceMode, atCapacityMode, pace, isOpen, restaurant, activeMenu, nextOpeningAt, serverTime]
      properties:
        kioskID:
          type: string
          example: KIOSK-TBT-001
        kind:
          $ref: '#/components/schemas/DeviceKind'
        idleTimerIntervalMilliseconds:
          type: integer
          description: Idle timeout; 0 disables it.
          example: 20000
        printerEnabled:
          type: boolean
          description: False until phase 4.
          example: false
        maintenanceMode:
          type: boolean
          example: false
        atCapacityMode:
          type: boolean
          description: |
            True while this device is at capacity in Aparelhos, or while the store's
            pace is PAUSED. The kiosk then shows its at-capacity screen.
          example: false
        pace:
          type: object
          description: |
            The store's pace, so the paused screen can say when the kiosk comes back.
            A change of pace changes the config ETag.
          required: [pace, pausedUntil]
          properties:
            pace:
              $ref: '#/components/schemas/Pace'
            pausedUntil:
              type: string
              format: date-time
              nullable: true
        isOpen:
          type: boolean
          description: True when a menu is active now.
          example: true
        restaurant:
          $ref: '#/components/schemas/RestaurantPublic'
        activeMenu:
          $ref: '#/components/schemas/ActiveMenuRef'
        nextOpeningAt:
          type: string
          format: date-time
          nullable: true
          description: When the next menu starts, if closed. Lets the kiosk say "back at 06:00".
        serverTime:
          type: string
          format: date-time
          example: '2026-10-30T12:00:00Z'
    RestaurantPublic:
      type: object
      required: [locationId, name, logo, currency, timezone, defaultLanguage, supportedLanguages, isDineInAvailable, isTakeOutAvailable, closedMessage, posCheckNumberDisplayLength]
      properties:
        locationId:
          type: string
          example: rst-padaria-01
        name:
          type: string
          example: '[Nome da padaria]'
        logo:
          type: string
          nullable: true
          example: /media/logo-padaria.png
        currency:
          type: string
          enum: [BRL]
        timezone:
          type: string
          example: America/Sao_Paulo
        defaultLanguage:
          $ref: '#/components/schemas/LanguageCode'
        supportedLanguages:
          type: array
          items:
            $ref: '#/components/schemas/SupportedLanguage'
        isDineInAvailable:
          type: boolean
        isTakeOutAvailable:
          type: boolean
        closedMessage:
          $ref: '#/components/schemas/ClosedMessage'
        posCheckNumberDisplayLength:
          type: integer
          description: Digits shown for the order number (BR-POST-01).
          example: 2
    SupportedLanguage:
      type: object
      required: [code, name]
      properties:
        code:
          $ref: '#/components/schemas/LanguageCode'
        name:
          type: string
          example: Português
    ClosedMessage:
      type: object
      description: ENT-KIOSK-03, both languages so the kiosk can switch without a call.
      required: [title, description]
      properties:
        title:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
    ActiveMenuRef:
      type: object
      nullable: true
      required: [id, name, until]
      properties:
        id:
          type: string
          example: mnu-manha
        name:
          type: string
          example: Manhã
        until:
          type: string
          format: date-time
          description: When this menu stops being active.
          example: '2026-10-30T14:00:00Z'
    Heartbeat:
      type: object
      required: [appVersion, screenResolution]
      properties:
        appVersion:
          type: string
          example: 0.1.0+3f9c2a1
        screenResolution:
          type: string
          example: 1080x1920
        ip:
          type: string
          description: LAN address if the device knows it; the server also records the source IP.
    DeviceReport:
      oneOf:
        - $ref: '#/components/schemas/DeviceStatusReport'
        - $ref: '#/components/schemas/DeviceKeyActionReport'
      discriminator:
        propertyName: kind
        mapping:
          STATUS: '#/components/schemas/DeviceStatusReport'
          KEY_ACTION: '#/components/schemas/DeviceKeyActionReport'
    KioskStatusType:
      type: string
      enum: [APPLICATION_STARTING, APPLICATION_START_FAILED, TRADING, UNAVAILABLE]
    DeviceStatusReport:
      type: object
      required: [kind, statusType, category]
      properties:
        kind:
          type: string
          enum: [STATUS]
        statusType:
          $ref: '#/components/schemas/KioskStatusType'
        reason:
          type: string
          enum: [MAINTENANCE, AT_CAPACITY, STORE_CLOSED, UNKNOWN]
        category:
          type: string
          enum: [APPLICATION_STATUS, DISPLAYING_SCREEN]
        message:
          type: string
    DeviceKeyActionReport:
      type: object
      required: [kind, type, kioskStatusType]
      properties:
        kind:
          type: string
          enum: [KEY_ACTION]
        type:
          type: string
          enum: [START_JOURNEY_SUCCESS, START_JOURNEY_FAILED, APPLICATION_START_FAILED]
        kioskStatusType:
          $ref: '#/components/schemas/KioskStatusType'
        reason:
          type: string
          enum: [FAILED_START_JOURNEY, FAILED_LOAD_MENU]
        message:
          type: string

    # ------------------------------------------------------------ Menu (kiosk)
    Menu:
      type: object
      description: ENT-MENU-01. Root `entities` are categories sorted by `displayOrder`.
      required: [id, name, language, currency, showCategoriesPrice, entities, customizedItemTags, crossSellGroups]
      properties:
        id:
          type: string
        name:
          type: string
        language:
          $ref: '#/components/schemas/LanguageCode'
        currency:
          type: string
          enum: [BRL]
        showCategoriesPrice:
          type: boolean
        entities:
          type: array
          items:
            $ref: '#/components/schemas/MenuEntity'
        customizedItemTags:
          type: array
          items:
            $ref: '#/components/schemas/CustomizedItemTag'
        crossSellGroups:
          type: array
          items:
            $ref: '#/components/schemas/CrossSellGroup'
      example:
        id: mnu-manha
        name: Manhã
        language: pt-BR
        currency: BRL
        showCategoriesPrice: false
        entities:
          - id: cat-paes
            type: CATEGORY
            name: Pães
            image: null
            displayOrder: 1
            childEntities:
              - id: itm-fermentacao-natural
                type: ITEM
                plu: '1001'
                name: Fermentação natural
                shortName: Fermentação
                description: Pão de fermentação natural, casca crocante.
                image: /media/fermentacao-natural.jpg
                price: 2800
                servicePriceOverride: {}
                serviceAvailability:
                  DINEIN: true
                  TAKE_OUT: true
                calories: null
                itemLabels: []
                displayOrder: 1
                showFromPrice: false
                defaultEntity: null
                crossSellGroupId: null
                childEntities: []
                optionGroups:
                  - id: grp-corte
                    name: Como você quer?
                    role: REQUIRED-MODIFIER
                    minimum: 1
                    maximum: 1
                    defaultOption: opt-inteiro-fatiado
                    displayOrder: 1
                    compositeOptions: []
                    options:
                      - id: opt-inteiro-fatiado
                        plu: '9001'
                        name: Inteiro, fatiado
                        price: 0
                        servicePriceOverride: {}
                        maximumQuantity: 1
                        defaultQuantity: 1
                        supersede: false
                        displayOrder: 1
                        optionGroups: []
                      - id: opt-inteiro
                        plu: '9002'
                        name: Inteiro
                        price: 0
                        servicePriceOverride: {}
                        maximumQuantity: 1
                        defaultQuantity: 0
                        supersede: false
                        displayOrder: 2
                        optionGroups: []
              - id: itm-baguete
                type: ITEM
                plu: '1002'
                name: Baguete tradicional
                shortName: Baguete
                description: null
                image: /media/baguete.jpg
                price: 1200
                servicePriceOverride: {}
                serviceAvailability:
                  DINEIN: true
                  TAKE_OUT: true
                calories: null
                itemLabels: []
                displayOrder: 2
