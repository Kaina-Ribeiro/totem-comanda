  schemas:
    # ------------------------------------------------------------ Common
    Problem:
      type: object
      x-comanda: true
      description: RFC 9457 problem details with a stable `code` the clients switch on.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ProblemCode'
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
              rule:
                $ref: '#/components/schemas/MenuRule'
              entity:
                $ref: '#/components/schemas/Link'
    ProblemCode:
      type: string
      x-comanda: true
      description: |
        v1 codes that still apply, plus the pilot's payment and menu codes (SPEC 4.7). Each
        has pt-BR and en copy in the kiosk.
      enum:
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - DEVICE_DISABLED
        - NOT_FOUND
        - VALIDATION_FAILED
        - IDEMPOTENCY_KEY_REUSED
        - NO_ACTIVE_MENU
        - ITEM_UNAVAILABLE
        - ORDER_TYPE_UNAVAILABLE
        - BASKET_ITEM_LIMIT_EXCEEDED
        - INVALID_COUPON
        - COUPON_ALREADY_APPLIED
        - ORDER_NOT_AWAITING_PAYMENT
        - PAYMENT_IN_PROGRESS
        - PAYMENT_NOT_CANCELLABLE
        - PAYMENT_NOT_AUTHORISED
        - SIMULATION_DISABLED
        - INVALID_STATUS_TRANSITION
        - SCHEDULE_OVERLAP
        - DISCOUNT_CODE_TAKEN
        - STALE_ORDER_VERSION
        - BASKET_CHANGED
        - BASKET_ALREADY_PAID
        - DISCOUNT_INVALID
        - DISCOUNT_LIMIT_REACHED
        - PAYMENT_DECLINED
        - PAYMENT_EXPIRED
        - PAYMENT_NOT_APPROVED
        - PAYMENT_TERMINAL_UNAVAILABLE
        - MENU_INVALID
    MenuRule:
      type: string
      x-comanda: true
      description: Which catalogue rule an entry of `MENU_INVALID` breaks (see the `MenuInvalid` response).
      enum:
        - MISSING_LINK
        - EMPTY_GROUP
        - EMPTY_SWAP_SELL
        - LOOP
        - INVALID_ID
        - DUPLICATE_PRODUCT_ID
        - COMBO_INCOMPLETE
        - LINK_NOT_ALLOWED
        - ID_MISMATCH
    Money:
      type: number
      format: double
      minimum: 0
      description: |
        BRL in the main currency unit with at most 2 decimals (MODELS 2.3, SPEC D-3).
        `9.50` = R$ 9,50. Never cents. Format for display with
        `Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' })`.
      example: 9.5
    Fraction:
      type: number
      format: double
      minimum: 0
      maximum: 1
      description: A rate written as a fraction. `0.10` is 10%.
      example: 0.1
    Flag:
      type: integer
      enum: [0, 1]
      description: '`1` yes, `0` no (MODELS 2.3).'
    EntityId:
      type: string
      x-comanda: true
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
      description: An id the back office may write. No `:` at all, so never `::` (SPEC D-4).
      example: M-EXTRAS
    LanguageCode:
      type: string
      enum: [pt-BR, en]
    LocalizedText:
      type: object
      x-comanda: true
      required: [pt-BR]
      properties:
        pt-BR:
          type: string
        en:
          type: string
      example:
        pt-BR: Se quiser nota fiscal, dirija-se ao caixa.
        en: If you need an invoice, please go to the counter.
    LocalTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$'
      description: Local time of day, `HH:mm:ss` (MODELS 2.3); `HH:mm` is accepted when reading.
      example: '11:00:00'
    DayOfWeek:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]

    # ------------------------------------------------------------ Menu (MODELS 5)
    MenuResponse:
      type: object
      description: |
        MODELS 5.1. `root` lists the top-level sections in display order; `entities` holds
        every entity of the menu in one flat list; entities point at each other with `links`.
      required: [root, entities, menuId, validUntil, badges]
      properties:
        root:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        entities:
          type: array
          items:
            $ref: '#/components/schemas/PosEntity'
        menuId:
          type: string
          x-comanda: true
          description: Which scheduled menu (`AdminMenu.id`) this is.
          example: mnu-tarde
        validUntil:
          type: string
          format: date-time
          nullable: true
          x-comanda: true
          description: When the active menu next switches (end of its window or of the owner's force).
          example: '2026-11-10T23:00:00Z'
        badges:
          type: array
          x-comanda: true
          description: The badges `badgeIds` point at, names resolved to `language`.
          items:
            $ref: '#/components/schemas/Badge'
    Link:
      type: object
      description: MODELS 5.6 (`PosEntityLink`). Points at the entity with this `type` and `id`.
      required: [id, type]
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/PosEntityType'
      example:
        id: M-EXTRAS
        type: MODIFIERS
    PosEntityType:
      type: string
      description: |
        MODELS 5.3. `CROSS_SELLS`, `INGREDIENTS` and `COMBO_ITEM` exist in the enum but are not
        used in menus; `TAX` is not used in the pilot.
      enum: [CATEGORY, ITEM, SIZED_ITEM, MODIFIERS, COMBO_MEAL, COMBO_MAIN, COMBO_SIDE, IMAGE, TAX, SWAP_SELL, CROSS_SELLS, INGREDIENTS, COMBO_ITEM]
    PosEntity:
      description: One entity of the menu graph; its `type` decides its shape (MODELS 5.3).
      oneOf:
        - $ref: '#/components/schemas/PosEntitySection'
        - $ref: '#/components/schemas/PosEntityItem'
        - $ref: '#/components/schemas/PosEntityComboMeal'
        - $ref: '#/components/schemas/PosEntityModifier'
        - $ref: '#/components/schemas/PosEntityImage'
        - $ref: '#/components/schemas/PosEntitySwapSell'
        - $ref: '#/components/schemas/PosEntityTaxGroup'
      discriminator:
        propertyName: type
        mapping:
          CATEGORY: '#/components/schemas/PosEntitySection'
          ITEM: '#/components/schemas/PosEntityItem'
          SIZED_ITEM: '#/components/schemas/PosEntityItem'
          CROSS_SELLS: '#/components/schemas/PosEntityItem'
          COMBO_MEAL: '#/components/schemas/PosEntityComboMeal'
          MODIFIERS: '#/components/schemas/PosEntityModifier'
          COMBO_MAIN: '#/components/schemas/PosEntityModifier'
          COMBO_SIDE: '#/components/schemas/PosEntityModifier'
          IMAGE: '#/components/schemas/PosEntityImage'
          SWAP_SELL: '#/components/schemas/PosEntitySwapSell'
          TAX: '#/components/schemas/PosEntityTaxGroup'
    PosEntityCommon:
      type: object
      description: MODELS 5.5 (`IPosEntity`), the fields every entity has.
      required: [id, name, type, links]
      properties:
        id:
          type: string
          description: Unique within its type. Never contains `::`. Sent back in orders.
        name:
          type: string
          description: The name guests see. Resolved to `language` on guest endpoints; pt-BR in the back office.
        type:
          $ref: '#/components/schemas/PosEntityType'
        gfcId:
          type: integer
          nullable: true
        links:
          type: array
          description: Arrows to other entities (MODELS 5.4), in display order. `[]` when none.
          items:
            $ref: '#/components/schemas/Link'
        posMetadata:
          type: object
          nullable: true
          additionalProperties:
            type: string
        translations:
          $ref: '#/components/schemas/Translations'
    Translations:
      type: object
      x-comanda: true
      description: |
        Back office only: the English text of an entity whose `name`/`description` are pt-BR.
        Never sent on guest endpoints, which resolve `name`/`description` to `language`.
      properties:
        en:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
      example:
        en:
          name: Extra cheese
    PosEntitySection:
      description: MODELS 5.7, `CATEGORY`. Links sub-sections, products and pictures.
      allOf:
        - $ref: '#/components/schemas/PosEntityCommon'
        - type: object
          properties:
            type:
              type: string
              enum: [CATEGORY]
            description:
              type: string
              nullable: true
            available:
              type: boolean
              description: '`true` (default) shows the section, `false` hides it.'
            availableHours:
              type: array
              description: When present and not empty, the section is shown only in these windows.
              items:
                $ref: '#/components/schemas/PosEntitySectionHours'
    PosEntitySectionHours:
      type: object
      description: |
        MODELS 5.8. One window, local store time. `close` before `open` runs past midnight;
        the closing minute is closed. Also the shape of menu schedules.
      required: [dayOfWeek, open, close]
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeek'
        open:
          $ref: '#/components/schemas/LocalTime'
        close:
          $ref: '#/components/schemas/LocalTime'
    PosEntityItemFields:
      type: object
      description: MODELS 5.9, the item shape shared by `ITEM`, `SIZED_ITEM` and `COMBO_MEAL`.
      required: [price, available]
      properties:
        price:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Base price. For an option, the extra amount (`0` when free). `0` on a `SIZED_ITEM` (its sizes carry the price).
        dineInPriceOverride:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: Price for dine-in orders; `price` when absent. The only override the pilot uses.
        takeOutPriceOverride:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: Not used in the pilot.
        deliveryPriceOverride:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: Not used in the pilot.
        description:
          type: string
          nullable: true
        available:
          type: boolean
          description: '`false` = shown grey ("Indisponível" / "Unavailable") and cannot be added.'
        alcoholic:
          type: boolean
          nullable: true
        ageRestriction:
          type: integer
          nullable: true
        plu:
          type: string
          nullable: true
        internalName:
          type: string
          nullable: true
          description: Short name for kitchen tickets; `name` when empty.
        calories:
          type: string
          nullable: true
        allergens:
          type: array
          items:
            $ref: '#/components/schemas/Allergen'
        barcodes:
          type: array
          nullable: true
          items:
            type: string
        factor:
          type: number
          nullable: true
        deliveryFlag:
          $ref: '#/components/schemas/Flag'
        pickupFlag:
          $ref: '#/components/schemas/Flag'
        seatFlag:
          $ref: '#/components/schemas/Flag'
        dineinFlag:
          $ref: '#/components/schemas/Flag'
        takeoutFlag:
          $ref: '#/components/schemas/Flag'
        defaultQuantity:
          type: integer
          minimum: 0
          nullable: true
          description: Options only. How many are pre-selected (`1` for an `INGR` ingredient). Default `0`.
        minChoices:
          type: integer
          minimum: 0
          nullable: true
          description: Options only. Fewest of this option. Default `0`.
        maxChoices:
          type: integer
          minimum: 0
          nullable: true
          description: Options only. Most of this option. Default `1`.
        displayPrice:
          allOf:
            - $ref: '#/components/schemas/Money'
          x-comanda: true
          description: |
            "A partir de R$ X" for products with sizes or required options, computed by Go
            (cheapest size, or `price` plus the cheapest required choices). The front end never
            computes it. Ignored on back-office saves.
        allergenTraces:
          type: array
          x-comanda: true
          description: '"Pode conter" (may contain), same values as `allergens`.'
          items:
            $ref: '#/components/schemas/Allergen'
        allergensDeclared:
          type: boolean
          x-comanda: true
          description: '`false` = allergens "não informado"; an empty `allergens` list never reads as safe.'
        badgeIds:
          type: array
          x-comanda: true
          description: Ids of `Badge`s shown on the item (`MenuResponse.badges`).
          items:
            type: string
        crossSellIds:
          type: array
          x-comanda: true
          description: |
            Products suggested after this one is added (`ITEM`, `SIZED_ITEM` or `COMBO_MEAL`
            ids; Comanda keeps those ids unique across the three types). They must exist in
            `entities`.
          items:
            type: string
    PosEntityItem:
      description: |
        MODELS 5.9 and 5.10. `ITEM` is a product, an option inside a group, a size of a
        `SIZED_ITEM`, or a swap-sell target. `SIZED_ITEM` links its sizes as `ITEM`s; Go
        creates the size group (`min` 1, `max` 1, type `SIZE`).
      allOf:
        - $ref: '#/components/schemas/PosEntityCommon'
        - $ref: '#/components/schemas/PosEntityItemFields'
        - type: object
          properties:
            type:
              type: string
              enum: [ITEM, SIZED_ITEM, CROSS_SELLS]
    PosEntityComboMeal:
      description: MODELS 5.14, `COMBO_MEAL`. Links one `COMBO_MAIN`, one or more `COMBO_SIDE`.
      allOf:
        - $ref: '#/components/schemas/PosEntityCommon'
        - $ref: '#/components/schemas/PosEntityItemFields'
        - type: object
          required: [comboMealId]
          properties:
            type:
              type: string
              enum: [COMBO_MEAL]
            comboMealId:
              type: integer
    PosEntityModifier:
      description: |
        MODELS 5.12 and 5.14: `MODIFIERS`, `COMBO_MAIN` and `COMBO_SIDE` share this shape.
        `min`/`max` count picks across the group; `minChoices`/`maxChoices` on each option limit
        that option. Links options (`ITEM`/`SIZED_ITEM`, at least one) and pictures.
      allOf:
        - $ref: '#/components/schemas/PosEntityCommon'
        - type: object
          required: [min, max]
          properties:
            type:
              type: string
              enum: [MODIFIERS, COMBO_MAIN, COMBO_SIDE]
            min:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
            included:
              type: integer
              minimum: 0
              nullable: true
              description: Picks included in the price. Ignored by Go in the pilot.
            modifierType:
              $ref: '#/components/schemas/ModifierType'
            internalName:
              type: string
              nullable: true
    ModifierType:
      type: string
      description: MODELS 5.13. `SIZE` groups are shown first; `INGR` options start selected and can be removed.
      enum: [MODI, SIZE, INGR, SURC, INGM]
    PosEntityImage:
      description: 'MODELS 5.15, `IMAGE`. A leaf (`links: []`).'
      allOf:
        - $ref: '#/components/schemas/PosEntityCommon'
        - type: object
          required: [url]
          properties:
            type:
              type: string
              enum: [IMAGE]
            url:
              type: string
              description: Address of the picture (absolute, or a path the BFF resolves against the Core API).
            altText:
              type: string
              nullable: true
    PosEntitySwapSell:
      description: MODELS 5.17, `SWAP_SELL`. Only the common fields; `links` point at the products the guest can swap to.
      allOf:
        - $ref: '#/components/schemas/PosEntityCommon'
        - type: object
          properties:
            type:
              type: string
              enum: [SWAP_SELL]
    PosEntityTaxGroup:
      description: MODELS 5.16, `TAX`. In the schema for completeness; never sent in the pilot (SPEC D-9).
      allOf:
        - $ref: '#/components/schemas/PosEntityCommon'
        - type: object
          required: [taxRates]
          properties:
            type:
              type: string
              enum: [TAX]
            taxRates:
              type: array
              items:
                $ref: '#/components/schemas/PosEntityTaxRate'
    PosEntityTaxRate:
      type: object
      description: MODELS 5.16. Not used in the pilot.
