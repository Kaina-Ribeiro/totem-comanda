    put:
      tags: [Admin]
      operationId: putDiscountRule
      summary: Create or replace a coupon
      description: '`usesCount` is kept by Go and ignored on save. A code another coupon uses is `409 DISCOUNT_CODE_TAKEN`.'
      x-phase: 3
      security:
        - ownerAuth: []
      parameters:
        - $ref: '#/components/parameters/DiscountRuleId'
      requestBody:
        required: true
        content:
          application/json:
