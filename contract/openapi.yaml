        - LUPIN
        - MILK
        - MOLLUSCS
        - MUSTARD
        - NUTS
        - PEANUTS
        - SHELLFISH
        - SOYA
        - SULPHUR
        - SESAME
        - SULPHITES
        - CEREALS
        - DAIRY
        - ALMONDS
        - BARLEY
        - BRAZIL_NUT
        - CASHEW
        - HAZELNUTS
        - KAMUT
        - MACADAMIA
        - OATS
        - PECAN
        - PISTACHIOS
        - RYE
        - SPELT
        - WALNUTS
        - WHEAT
        - GLUTEN_FREE
        - DAIRY_FREE
        - LACTOSE_FREE
        - SUGAR_FREE
        - VEGETARIAN
        - VEGAN
        - PLANT_BASED
        - HALAL
        - KOSHER
        - ORGANIC
        - NATURAL
        - KETO
        - PALEO
