openapi: 3.0.3
info:
  title: Comanda Core API
  version: 2.0.0
  license:
    name: Proprietary
  description: |
    Contract v2 between the Comanda BFF (Next.js server, built by Kai) and the Comanda
    Core API (Go, built by the partner), for the dine-in pilot (`docs/pilot-v2/SPEC.md`).
    Every data model follows `docs/v2-research/MODELS.md` (the "v2" models of
    `lib-pos-integration`): same schema names without the Java `I` prefix, same JSON field
    names and types. The Go API owns every business rule: prices, discounts, availability,
    order numbers and payment approval. The BFF only combines and formats.

    This is the only contract: every path is under `/v2` (the v1 contract was removed in
    pilot phase 5, COM-149). Any change goes through a pull request both partners approve.

    Conventions
    - Money: JSON number in BRL, main currency unit, 2 decimals. `9.50` means R$ 9,50.
      Never cents. Go computes every amount; discounts are rounded per line, half up, to the
      cent, then summed. No tax in the pilot: tax amounts are `0` and tax lists are `[]`.
    - Ids are strings and never contain `::`. An entity is identified by `type` + `id`.
      Comanda keeps product ids (`ITEM`, `SIZED_ITEM`, `COMBO_MEAL`) unique across those three
      types. Back-office writes take the id in the path and refuse anything outside
      `^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$`.
    - `x-comanda: true` on a property marks a field Comanda adds inside a v2 model (SPEC D-2);
      on a schema it marks a schema that is Comanda's own (not in MODELS.md).
    - Optional fields may be left out or sent as `null`. Lists the reader walks (`root`,
      `links`) are `[]` when empty, never `null`. Clients ignore fields they do not know.
    - Timestamps added by Comanda are ISO 8601 in UTC (`2026-11-10T12:00:00Z`). Times of day
      follow MODELS (`HH:mm:ss` in menus, `HH:mm:ss.SSS` in store hours).
    - Errors: `application/problem+json` (RFC 9457) with a stable `code`; switch on `code`.
    - `POST /v2/payments` and `POST /v2/orders` require an `Idempotency-Key` header.
    - `GET /v2/devices/me/config` and `GET /v2/menus/active` return an `ETag`; send it back
      in `If-None-Match` to get `304`.
    - Guest endpoints take `language` (`pt-BR` or `en`) and return text already resolved;
      back-office endpoints return `name`/`description` in pt-BR plus `translations.en`.
    - Every order is `DINEIN`. Payment is Mercado Pago (Pix and Point), called only by Go.
    - `x-phase` on each operation is the pilot v2 plan phase (`docs/plans/pilot-v2.md`) that
      moves the app onto it: 2 kiosk, 3 menu editor, 4 kitchen, store, devices, orders, report.
servers:
  - url: http://localhost:4011
    description: Prism in front of the stateful mock (front-end work before Go v2 exists)
  - url: http://localhost:8080
    description: Go API, local
tags:
  - name: Devices
    description: Kiosk and kitchen device identity, configuration and health.
  - name: Kiosk
    description: Guest menu, journey, totals and coupons.
  - name: Payments
    description: Mercado Pago Pix and Point sessions, and placing the paid order.
  - name: Kitchen
    description: Kitchen screen.
  - name: Admin
    description: Back office for the owner.

paths:
  # ---------------------------------------------------------------- Devices
  /v2/devices/auth:
    post:
      tags: [Devices]
      operationId: authenticateDevice
      summary: Exchange device credentials for a short-lived token
      description: |
        Called by the BFF with the `deviceId` and `deviceSecret` typed at `/setup`.
        A device disabled in the back office gets `403 DEVICE_DISABLED`.
      x-phase: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAuthRequest'
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceToken'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/DeviceDisabled'

  /v2/devices/me/config:
    get:
      tags: [Devices]
      operationId: getDeviceConfig
      summary: Configuration of the calling device and its store
      description: |
        Evaluates the menu schedule in the store's timezone and returns `isOpen`. With no
        active menu, `isOpen` is false and the kiosk shows the closed screen with
        `store.closedMessage`. The kiosk retries every 5 s on failure. A change of pace, store
        settings or active menu changes the ETag.
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current configuration.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceConfig'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v2/devices/heartbeat:
    post:
      tags: [Devices]
      operationId: sendHeartbeat
      summary: Report that the device is alive
      description: Updates `lastSeenAt` on the device. The server records the request's source IP.
      x-phase: 2
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Heartbeat'
      responses:
        '204':
          description: Recorded.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v2/devices/status:
    post:
      tags: [Devices]
      operationId: reportDeviceStatus
      summary: Report a status change or a key action
      description: Fire-and-forget; the kiosk ignores errors.
      x-phase: 2
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceReport'
            examples:
              trading:
                value:
                  kind: STATUS
                  statusType: TRADING
                  category: APPLICATION_STATUS
                  message: Config refreshed
      responses:
        '204':
          description: Recorded.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  # ---------------------------------------------------------------- Kiosk
  /v2/menus/active:
    get:
      tags: [Kiosk]
      operationId: getActiveMenu
      summary: The menu active right now, as one MenuResponse
      description: |
        The graph reachable from the active menu's `root`, following MODELS.md section 5:
        flat `entities`, `links` between them, `root` in display order. Called once per
        journey (at start and on a language change); the kiosk keeps it in memory until the
        journey ends.

        - Text is resolved to `language` (`name`, `description`, badge names); entities
          carry no `translations` here.
        - Items and options with `available: false` are sent; the kiosk shows them grey
          ("Indisponível" / "Unavailable") and they cannot be added.
        - A section outside its `availableHours` at request time is sent with
          `available: false` (hidden); `availableHours` stays for display. A window whose
          `close` is before its `open` runs past midnight; the closing minute is closed.
        - `TAX` entities and `TAX` links are never sent in the pilot.
        - Go ignores `included` on modifier groups in the pilot (MODELS: a venue feature, off).
        - `menuId` and `validUntil` say which scheduled menu this is and when the next switch
          happens.
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Active menu.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
              examples:
                reference:
                  $ref: '#/components/examples/ReferenceMenu'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No menu is active now (`NO_ACTIVE_MENU`); the kiosk shows the closed screen.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: /problems/no-active-menu
                title: No menu is active now
                status: 404
                code: NO_ACTIVE_MENU

  /v2/languages/{code}:
    get:
      tags: [Kiosk]
      operationId: getLanguagePack
      summary: Language pack override for the kiosk UI
      description: |
        Strings the owner changed; the kiosk merges them over its bundled pack and falls back
        to the bundled pack on any error.
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/LanguageCode'
      responses:
        '200':
          description: Language pack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguagePack'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v2/journeys:
    post:
      tags: [Kiosk]
      operationId: startJourney
      summary: Record the start of a guest journey
      description: Non-blocking for the guest; the kiosk logs failures and carries on.
      x-phase: 2
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartJourneyRequest'
      responses:
        '201':
          description: Journey recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyStarted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v2/journeys/{orderNonce}/events:
    post:
      tags: [Kiosk]
      operationId: recordJourneyEvent
      summary: Record a reset or an abandoned journey
      description: Fire-and-forget.
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderNonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyEvent'
      responses:
        '204':
          description: Recorded.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v2/totals:
    post:
      tags: [Kiosk]
      operationId: createTotals
      summary: Price the basket (TotalsRequest → TotalsResponse)
      description: |
        Called after every basket or coupon change. Go keeps the basket and returns its
        `basketId`; send it back on later calls so the coupon and the payment stay attached
        to the same basket. Without `basketId`, Go opens a new basket.

        The kiosk sends ids, quantities and the line tree only (`uniqueId`, `parentId`,
        `position`, one line per unit); any price or total it sends is ignored. Go prices
        every line from the menu: the product's price (`dineInPriceOverride` when set), plus
        each option's extra `price` × quantity; a sized item costs its chosen size. An
        option's group is found among the groups its parent links (an option is linked from
        at most one group of the same parent). Lines in `orderItems` are named in `language`.
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotalsRequest'
            example:
              basketId: null
              orderType: DINEIN
              items:
                - id: '1001'
                  quantity: 1
                  uniqueId: 1
                  specialNotes: Cortar ao meio, por favor
                  modifiers:
                    - id: X-CHEESE
                      quantity: 2
                      uniqueId: 2
                      parentId: 1
                      position: 1
                      modifierType: MODI
                    - id: X-SAUCE
                      quantity: 1
                      uniqueId: 3
                      parentId: 1
                      position: 3
                      modifierType: MODI
                    - id: S-BBQ
                      quantity: 1
                      uniqueId: 4
                      parentId: 3
                      position: 1
                      modifierType: MODI
                - id: '2001'
                  quantity: 1
                  uniqueId: 5
                  modifiers:
                    - id: 2001-L
                      quantity: 1
                      uniqueId: 6
                      parentId: 5
                      position: 2
                      modifierType: SIZE
      responses:
        '200':
          description: The priced basket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotalsResponse'
              example:
                basketId: B-55501
                subTotal: 14.7
                discount: 0
                serviceChargeTotal: 0
                tax: 0
                total: 14.7
                orderItems:
                  - id: '1001'
                    name: Classic Burger
                    quantity: 1
                    price: 9.5
                    netTotal: 11.5
                    taxTotal: 0
                    total: 11.5
                    specialNotes: Cortar ao meio, por favor
                    modifiers:
                      - id: X-CHEESE
                        name: Queijo extra
                        quantity: 2
                        price: 1
                        netTotal: 2
                        taxTotal: 0
                        total: 2
                        modifiers: []
                        taxes: []
                      - id: X-SAUCE
                        name: Adicionar molho
                        quantity: 1
                        price: 0
                        netTotal: 0
                        taxTotal: 0
                        total: 0
                        modifiers:
                          - id: S-BBQ
                            name: Molho barbecue
                            quantity: 1
                            price: 0
                            netTotal: 0
                            taxTotal: 0
                            total: 0
                            modifiers: []
                            taxes: []
                        taxes: []
                    taxes: []
                  - id: '2001'
                    name: Refrigerante de cola
                    quantity: 1
                    price: 0
                    netTotal: 3.2
                    taxTotal: 0
                    total: 3.2
                    modifiers:
                      - id: 2001-L
                        name: Grande
                        quantity: 1
                        price: 3.2
                        netTotal: 3.2
                        taxTotal: 0
                        total: 3.2
                        modifiers: []
                        taxes: []
                    taxes: []
                taxes: []
                discounts: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BasketNotFound'
        '422':
          $ref: '#/components/responses/BasketRejected'

  /v2/discounts/apply:
    post:
      tags: [Kiosk]
      operationId: applyDiscount
      summary: Apply a coupon code to the basket
      description: |
        The code is sent as one `Award` with `type: CODE` and `id` = the code typed by the
        guest. Go checks the `DiscountRule` (active, dates, `minOrderTotal`, `maxUses`),
        attaches it to `basketId` and answers the award with its `discountAmount`. One coupon
        per order: a different code replaces the current one (the kiosk warns first); the
        same code again is `409 COUPON_ALREADY_APPLIED`. Call `POST /v2/totals` afterwards
        for the new total; the coupon shows in `discounts` with `id` = the code.
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscountRequest'
            example:
              basketId: B-55501
              orderType: DINEIN
              items:
                - id: '1001'
                  quantity: 1
                  uniqueId: 1
              awards:
                - id: BEMVINDO10
                  type: CODE
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscountResponse'
              example:
                awards:
                  - id: BEMVINDO10
                    description: 10% de boas-vindas
                    type: CODE
                    source: COMANDA
                    isExternal: false
                    discountAmount: 0.95
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BasketNotFound'
        '409':
          description: The same code is already on the basket (`COUPON_ALREADY_APPLIED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            Unknown, inactive, expired code or minimum order not reached (`DISCOUNT_INVALID`,
            `detail` says which), the coupon's uses are used up (`DISCOUNT_LIMIT_REACHED`), or
            the basket cannot be priced (see `BasketRejected`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: /problems/discount-invalid
                title: Coupon not valid
                status: 422
                code: DISCOUNT_INVALID
                detail: Pedido mínimo de R$ 20,00

  /v2/discounts/cancel:
    post:
      tags: [Kiosk]
      operationId: cancelDiscount
      summary: Remove a coupon from the basket
      description: Codes in `codesToRemove` are taken off `basketId`. Unknown codes are ignored.
      x-phase: 2
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscountRequest'
            example:
              basketId: B-55501
              orderType: DINEIN
              items:
                - id: '1001'
                  quantity: 1
                  uniqueId: 1
              codesToRemove: [BEMVINDO10]
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BasketNotFound'

  # ---------------------------------------------------------------- Payments
  /v2/payments:
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Start a Mercado Pago Pix or Point payment for a basket
      description: |
        Anchored on `basketId`, not on an order: the order only exists after payment.
        `amount` must equal the basket's current total, else `409 BASKET_CHANGED` (price or
        availability changed since totals; the kiosk re-prices and asks the guest again,
        never charging the old total).

        - `PIX`: Go creates a Mercado Pago Pix charge; the session carries `qrCode`,
          `copyPaste` and `expiresAt` (5 minutes, Mercado Pago setting).
        - `CARD`: Go sends the charge to the Point terminal in the device's
          `paymentTerminalId`; the guest follows the terminal. No terminal configured, or the
          terminal offline or busy, is `409 PAYMENT_TERMINAL_UNAVAILABLE`.

        A new session for a basket cancels its other PENDING session ("Gerar novo", or a
        change of method). A basket that already has an APPROVED session is
        `409 BASKET_ALREADY_PAID`: the kiosk goes on to `POST /v2/orders`. Same
        `Idempotency-Key` and body returns the first session.
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            example:
              basketId: B-55501
              method: PIX
              amount: 14.7
      responses:
        '201':
          description: Session started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BasketNotFound'
        '409':
          description: |
            `BASKET_CHANGED`, `BASKET_ALREADY_PAID`, `PAYMENT_TERMINAL_UNAVAILABLE` or
            `IDEMPOTENCY_KEY_REUSED`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: /problems/basket-changed
                title: The basket changed since totals
                status: 409
                code: BASKET_CHANGED
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v2/payments/{paymentId}:
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Poll a payment session
      description: |
        The kiosk polls at most once per second while `PENDING`. Go learns the outcome from
        Mercado Pago (webhook or query) and moves the session to APPROVED, DECLINED, EXPIRED
        or CANCELLED. A Pix still PENDING at `expiresAt` becomes EXPIRED.
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v2/payments/{paymentId}/cancel:
    post:
      tags: [Payments]
      operationId: cancelPayment
      summary: Cancel a session that is still PENDING
      description: Go cancels the Pix charge or the Point order on Mercado Pago. The basket is kept.
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already final (`PAYMENT_NOT_CANCELLABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v2/payments/{paymentId}/simulate:
    post:
      tags: [Payments]
      operationId: simulatePayment
      summary: Force the outcome of a session (mock and dev only)
      description: |
        Only where Mercado Pago is simulated (the mock, local dev). Returns
        `404 SIMULATION_DISABLED` against a real Mercado Pago account. Approving a session that
        already EXPIRED is `409 PAYMENT_EXPIRED`, and that session is flagged for refund (a
        Pix paid late). Any other final session is `409 INVALID_STATUS_TRANSITION`.
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatePaymentRequest'
      responses:
        '200':
          description: Outcome applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`PAYMENT_EXPIRED` or `INVALID_STATUS_TRANSITION`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v2/orders:
    post:
      tags: [Payments]
      operationId: submitOrder
      summary: Place the paid basket as an order (SubmitOrderRequest → SubmitOrderResponse)
      description: |
        Placed only with an approved payment (SPEC 4.6):

        - `payments` holds one `Payment` copied from the APPROVED session (`tenderId`
          `MP_PIX` or `MP_POINT`, `tenderRef` = the Mercado Pago payment id, `amount`, and the
          card fields when the terminal returned them). Go checks it against its own session:
          PENDING or CANCELLED is `409 PAYMENT_NOT_APPROVED`, DECLINED is
          `409 PAYMENT_DECLINED`, EXPIRED is `409 PAYMENT_EXPIRED`.
        - The approved amount must equal the basket total, else `409 BASKET_CHANGED`.
        - **A paid basket always becomes exactly one order.** This call is idempotent on
          `basketId` as well as on `Idempotency-Key`: a second call for the same basket (a
          retry, or after the webhook placed it) returns the existing order with `200`.
        - **Requirement for Go:** if the kiosk never calls this (crash, network), Go places
          the order itself from the Mercado Pago webhook of the approved payment, with a
          history entry `by: SYSTEM`.
        - `orderType` must be `DINEIN` (`422 ORDER_TYPE_UNAVAILABLE` otherwise).
        - Go assigns `number` (the order id in this API) and `customerCheckNumber` (the short
          number on the success screen, a sequence per business day from
          `businessDayCutoff`), sets `status: PAID`, records the lines in pt-BR (the kitchen's
          language) and notifies the kitchen (`order.paid`).
        - `invoiceCpfCnpj` is ignored in the pilot (no NFC-e).
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderRequest'
            example:
              basketId: B-55501
              orderType: DINEIN
              items:
                - id: '1001'
                  quantity: 1
                  uniqueId: 1
              payments:
                - tenderId: MP_PIX
                  tenderRef: '1319876543'
                  amount: 9.5
      responses:
        '200':
          description: This basket was already placed; the existing order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOrderResponse'
        '201':
          description: Order placed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOrderResponse'
              examples:
                paid:
                  $ref: '#/components/examples/PlacedOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BasketNotFound'
        '409':
          description: |
            `PAYMENT_NOT_APPROVED`, `PAYMENT_DECLINED`, `PAYMENT_EXPIRED`, `BASKET_CHANGED` or
            `IDEMPOTENCY_KEY_REUSED`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: /problems/payment-not-approved
                title: The payment is not approved
                status: 409
                code: PAYMENT_NOT_APPROVED
        '422':
          $ref: '#/components/responses/BasketRejected'

  /v2/orders/{number}:
    get:
      tags: [Payments]
      operationId: getOrder
      summary: Read a placed order
      x-phase: 2
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Kitchen
  /v2/kitchen/orders:
    get:
      tags: [Kitchen]
      operationId: listKitchenOrders
      summary: Open orders oldest first, or today's collected orders newest first
      description: |
        `open` (default): PAID, PREPARING and READY orders, oldest `placedAt` first.
        `collected`: COLLECTED orders of the current business day, newest change first, so
        the kitchen can find one and move it back to READY. Lines are `orderItems`
        (`CheckItem` with nested `modifiers`), in pt-BR.
      x-phase: 4
      security:
        - deviceAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, collected]
            default: open
      responses:
        '200':
          description: Orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubmitOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v2/kitchen/stream:
    get:
      tags: [Kitchen]
      operationId: streamKitchenEvents
      summary: Server-Sent Events for the kitchen screen
      description: |
        One event per change. `event: order.paid` and `event: order.status_changed`, each
        with a `SubmitOrderResponse` as JSON in `data`; a cancelled or not-collected order is
        an `order.status_changed` with that status. `event: store.pace_changed` carries a
        `StorePace` whenever the pace changes, including the automatic resume after a pause.
        A `: ping` comment every 15 s keeps the connection open. If the stream drops, the
        kitchen polls `GET /v2/kitchen/orders` every 2 s.

        Events can arrive late or twice. Clients keep the order with the highest `version`.
      x-phase: 4
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: order.paid
                data: {"number":"20261110-0042","customerCheckNumber":"42","status":"PAID","version":1}

        '401':
          $ref: '#/components/responses/Unauthorized'

  /v2/kitchen/orders/{number}/status:
    post:
      tags: [Kitchen]
      operationId: updateKitchenOrderStatus
      summary: Move an order to PREPARING, READY or COLLECTED, forward or one step back
      description: |
        Forward: PAID → PREPARING → READY → COLLECTED (PAID → READY is allowed too).
        Back one step ("Desfazer", "Voltar uma etapa"): READY → PREPARING and
        COLLECTED → READY, only while the order's business day is the current one. Anything
        else is `409 INVALID_STATUS_TRANSITION`.

        Each change adds a `history` entry and increments `version`. With `expectedVersion`,
        Go applies the move only if the order is still at that version, else
        `409 STALE_ORDER_VERSION`.
      x-phase: 4
      security:
        - deviceAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitchenStatusUpdate'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`INVALID_STATUS_TRANSITION` or `STALE_ORDER_VERSION`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v2/kitchen/availability:
    put:
      tags: [Kitchen]
      operationId: setKitchenAvailability
      summary: '"Acabou": set a product, option or size unavailable, or back'
      description: |
        The kitchen marks what ran out without leaving its screen. `id` is a `CheckItem.id`
        from an order line (any `ITEM`, `SIZED_ITEM` or `COMBO_MEAL`). Sets `available` on that
        entity until changed (no "unavailable until"); `available: true` is the undo. Orders
        already placed stay open. Go changes the menu ETag, so the next journey loads the new
        menu. Answers the entity's current price and availability.
      x-phase: 4
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitchenAvailabilityUpdate'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LightMenuResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v2/kitchen/close-day:
    post:
      tags: [Kitchen]
      operationId: closeKitchenDay
      summary: '"Encerrar o dia": every open order of today becomes NOT_COLLECTED'
      description: |
        Moves every PAID, PREPARING and READY order of the current business day to
        NOT_COLLECTED, with a history entry, and sends one `order.status_changed` per order.
        Calling it again with nothing open returns `count: 0`.
      x-phase: 4
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseDayResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v2/kitchen/pace:
    get:
      tags: [Kitchen]
      operationId: getKitchenPace
      summary: The store's pace (Normal, Movimentado, Pausado)
      x-phase: 4
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Current pace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorePace'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Kitchen]
      operationId: setKitchenPace
      summary: Set the store's pace from the kitchen
