              schema:
                $ref: '#/components/schemas/DailyReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

components:
  securitySchemes:
    deviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from `POST /v2/devices/auth`. Kiosk and kitchen devices.
    ownerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from `POST /v2/admin/auth/login`. Held by the back-office BFF.

  headers:
    ETag:
      description: Version of the representation. Send it back in `If-None-Match`.
      schema:
        type: string
      example: '"menu-mnu-tarde-v17-pt-BR"'

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A UUID per logical attempt. Retrying with the same key and body returns the first result.
      schema:
        type: string
        format: uuid
      example: 6d1f2c9e-3b4a-4e5f-8a7b-9c0d1e2f3a4b
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    Language:
      name: language
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/LanguageCode'
    OrderNonce:
      name: orderNonce
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderNumber:
      name: number
      in: path
      required: true
      description: '`SubmitOrderResponse.number`.'
      schema:
        type: string
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
    MenuId:
      name: menuId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntityId'
    SectionId:
      name: sectionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntityId'
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntityId'
    ModifierGroupId:
      name: modifierGroupId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntityId'
    SwapSellId:
      name: swapSellId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntityId'
    BadgeId:
      name: badgeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntityId'
    DiscountRuleId:
      name: discountRuleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntityId'

  responses:
    NotModified:
      description: The client's copy is current (matching `If-None-Match`).
    Unauthorized:
      description: Missing, expired or invalid token (`UNAUTHORIZED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/unauthorized
            title: Unauthorized
            status: 401
            code: UNAUTHORIZED
    InvalidCredentials:
      description: Wrong id, secret, email or password (`INVALID_CREDENTIALS`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/invalid-credentials
            title: Invalid credentials
            status: 401
            code: INVALID_CREDENTIALS
    DeviceDisabled:
      description: The device was disabled in the back office (`DEVICE_DISABLED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/device-disabled
            title: Device disabled
            status: 403
            code: DEVICE_DISABLED
    NotFound:
      description: No such resource (`NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/not-found
            title: Not found
            status: 404
            code: NOT_FOUND
    BasketNotFound:
      description: No basket with this `basketId` (`NOT_FOUND`); price the basket again without it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/not-found
            title: Basket not found
            status: 404
            code: NOT_FOUND
    ValidationFailed:
      description: The body breaks a field rule (`VALIDATION_FAILED`); `errors` lists each field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/validation-failed
            title: Validation failed
            status: 422
            code: VALIDATION_FAILED
            errors:
              - field: items[0].quantity
                message: must be at least 1
    BasketRejected:
      description: |
        The basket cannot be priced: `ITEM_UNAVAILABLE` (unavailable, unknown or not on the
        active menu; `detail` names it), `ORDER_TYPE_UNAVAILABLE` (anything but DINEIN),
        `BASKET_ITEM_LIMIT_EXCEEDED`, `NO_ACTIVE_MENU` or `VALIDATION_FAILED` (an option
        outside its parent's groups, or a group's `min`/`max` or an option's
        `minChoices`/`maxChoices` broken).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/item-unavailable
            title: An item is unavailable
            status: 422
            code: ITEM_UNAVAILABLE
            detail: X-BACON
    MenuInvalid:
      description: |
        The catalogue would be broken after this save (`MENU_INVALID`). Comanda refuses what
        v2 would drop silently. Each problem is one `errors` entry with its `rule` and the
        `entity` it is about:
        `MISSING_LINK` (a link to an entity that does not exist), `EMPTY_GROUP` (a
        `MODIFIERS`, `COMBO_MAIN` or `COMBO_SIDE` with no option), `EMPTY_SWAP_SELL`, `LOOP`
        (an entity leads back to itself), `INVALID_ID` (empty, `::`, or outside the id
        pattern), `DUPLICATE_PRODUCT_ID` (the same id on two of `ITEM`, `SIZED_ITEM`,
        `COMBO_MEAL`), `COMBO_INCOMPLETE` (a combo without one `COMBO_MAIN` and at least one
        `COMBO_SIDE`), `LINK_NOT_ALLOWED` (a link MODELS 5.4 does not follow, or an option
        linked from two groups of the same parent) and `ID_MISMATCH` (body id ≠ path id).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/menu-invalid
            title: The menu would be broken
            status: 422
            code: MENU_INVALID
            errors:
              - field: links[3]
                message: ITEM X-NOPE does not exist
                rule: MISSING_LINK
                entity:
                  type: MODIFIERS
                  id: M-EXTRAS

