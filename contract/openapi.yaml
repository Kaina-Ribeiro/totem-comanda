          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorePace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v2/admin/reports/daily:
    get:
      tags: [Admin]
      operationId: getDailyReport
      summary: Orders, revenue, best sellers and average ticket for one business day
      x-phase: 4
      security:
        - ownerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          description: Business date in the store's timezone (days start at `businessDayCutoff`).
          schema:
            type: string
            format: date
          example: '2026-11-10'
      responses:
