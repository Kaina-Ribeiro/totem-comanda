                  $ref: '#/components/schemas/PosEntitySectionHours'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Admin]
      operationId: replaceMenuSchedules
      summary: Replace all opening windows of a menu
      description: |
        Same shape as section hours, in the store's timezone; `close` before `open` runs past
        midnight. Rejected with `409 SCHEDULE_OVERLAP` when a window overlaps another menu's,
        so at most one menu is active.
      x-phase: 3
      security:
        - ownerAuth: []
      parameters:
        - $ref: '#/components/parameters/MenuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
