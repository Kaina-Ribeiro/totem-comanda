    # ------------------------------------------------------------ Journey and basket
    StartJourneyRequest:
      type: object
      required: [orderNonce, language]
      properties:
        orderNonce:
          type: string
          format: uuid
          description: Generated by the kiosk at journey start; identifies the order until it gets an id.
        language:
          $ref: '#/components/schemas/LanguageCode'
    JourneyStarted:
      type: object
      example:
        journeyStartedTimestamp: '2026-10-30T11:58:02Z'
      required: [journeyStartedTimestamp]
      properties:
        journeyStartedTimestamp:
          type: string
          format: date-time
    JourneyEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [RESET, IDLE_TIMEOUT, CANCELLED_BY_GUEST]
        orderTotal:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Basket total at the moment of the event.
    OrderLineInput:
      type: object
      description: ENT-BASKET-03 as the kiosk sends it. No prices; the Go API prices everything.
      required: [guid, itemId, quantity, options]
      properties:
        guid:
          type: string
          format: uuid
        itemId:
          type: string
        quantity:
          type: integer
          minimum: 1
        options:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineOptionInput'
    OrderLineOptionInput:
      type: object
      required: [optionId, quantity]
      properties:
        optionId:
          type: string
          description: For a composite option, the id of the chosen positive or negative option.
        quantity:
          type: integer
          minimum: 1
        options:
          type: array
          description: Choices inside this option's nested groups.
          items:
            $ref: '#/components/schemas/OrderLineOptionInput'
    QuoteRequest:
      type: object
      required: [orderType, orderItems]
      properties:
        orderType:
          $ref: '#/components/schemas/OrderType'
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineInput'
        discountCode:
          type: string
          nullable: true
    OrderTotal:
      type: object
      description: ENT-BASKET-02. Prices are tax-inclusive; `tax` is filled from phase 4 with the NFC-e data. `discount` is absent when none applies.
      required: [subtotal, discountTotal, total, taxInclusive, tax, currency]
      properties:
        subtotal:
          $ref: '#/components/schemas/Money'
        discountTotal:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        taxInclusive:
          type: boolean
        tax:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Integer cents in BRL, or null.
        currency:
          type: string
          enum: [BRL]
        discount:
          $ref: '#/components/schemas/DiscountItem'
      example:
        subtotal: 8280
        discountTotal: 0
        total: 8280
        taxInclusive: true
        tax: null
        currency: BRL
    DiscountType:
      type: string
      enum: [COMANDA_COUPON, RESTAURANT_DISCOUNT]
    DiscountValidationRequest:
      type: object
      required: [code, entryMethod, orderType, orderItems]
      properties:
        code:
          type: string
          example: BEMVINDO10
        entryMethod:
          type: string
          enum: [MANUAL, SCAN, UNKNOWN]
        orderType:
          $ref: '#/components/schemas/OrderType'
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineInput'
        currentDiscountCode:
          type: string
          nullable: true
          description: The code already on the order, if any.
    DiscountItem:
      type: object
      example:
        type: COMANDA_COUPON
        value: BEMVINDO10
        entryMethod: MANUAL
        title: 10% na primeira compra
        description: null
        amount: 828
      description: ENT-DISC-01 (applied side), amount computed for the sent basket.
      required: [type, value, entryMethod, title, amount]
      properties:
        type:
          $ref: '#/components/schemas/DiscountType'
        value:
          type: string
          description: The code.
          example: BEMVINDO10
        entryMethod:
          type: string
          enum: [MANUAL, SCAN, UNKNOWN]
        title:
          type: string
          example: 10% na primeira compra
        description:
          type: string
          nullable: true
        amount:
          $ref: '#/components/schemas/Money'

    # ------------------------------------------------------------ Orders and payments
    OrderStatus:
      type: string
      enum: [AWAITING_PAYMENT, PAID, PREPARING, READY, COLLECTED, CANCELLED, NOT_COLLECTED]
      description: |
        NOT_COLLECTED: still open when the kitchen closed the day (`closeKitchenDay`);
        paid, never handed over. CANCELLED: cancelled by the owner (`cancelOrder`).
    CreateOrderRequest:
      type: object
      required: [orderNonce, orderType, language, orderItems]
      properties:
        orderNonce:
          type: string
          format: uuid
        orderType:
          $ref: '#/components/schemas/OrderType'
        language:
          $ref: '#/components/schemas/LanguageCode'
        orderItems:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderLineInput'
        discountCode:
          type: string
          nullable: true
        cpfCnpj:
          type: string
          nullable: true
          description: Digits only, 11 (CPF) or 14 (CNPJ). OP-BASKET-04.
          pattern: '^([0-9]{11}|[0-9]{14})$'
        journeyStartedTimestamp:
          type: string
          format: date-time
          nullable: true
    Order:
      type: object
      required: [id, orderNonce, orderType, status, posCheckNumber, businessDate, language, orderItems, orderTotal, cpfCnpj, journeyStartedTimestamp, createdAt, placedAt, readyAt]
      properties:
        id:
          type: string
          example: ord-7f3a
        orderNonce:
          type: string
          format: uuid
        orderType:
          $ref: '#/components/schemas/OrderType'
        status:
          $ref: '#/components/schemas/OrderStatus'
        posCheckNumber:
          type: string
          nullable: true
          description: Set when placed.
        businessDate:
          type: string
          format: date
        language:
          $ref: '#/components/schemas/LanguageCode'
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        orderTotal:
          $ref: '#/components/schemas/OrderTotal'
        cpfCnpj:
          type: string
          nullable: true
        journeyStartedTimestamp:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        placedAt:
          type: string
          format: date-time
          nullable: true
        readyAt:
          type: string
          format: date-time
          nullable: true
      example:
        id: ord-7f3a
        orderNonce: 0b6c7d8e-1f2a-4b3c-9d4e-5f6a7b8c9d0e
        orderType: TAKE_OUT
        status: AWAITING_PAYMENT
        posCheckNumber: null
        businessDate: '2026-10-30'
        language: pt-BR
        orderItems:
          - guid: 3f0c9a52-6f0e-4d7b-9c61-0d1f4b7f2a10
            itemId: itm-croque-monsieur
            name: Croque monsieur
            unitPrice: 4090
            quantity: 1
            lineTotal: 4090
            options:
              - optionId: opt-pao-brioche
                name: Brioche
                price: 0
                quantity: 1
                options: []
              - optionId: opt-ovo-poche
                name: Ovo pochê
                price: 600
                quantity: 1
                options: []
          - guid: 8b2d1c47-2a6e-4f53-8d0b-5e9a7c3f1b22
            itemId: itm-cappuccino
            name: Cappuccino
            unitPrice: 1390
            quantity: 1
            lineTotal: 1390
            options:
              - optionId: opt-leite-integral
                name: Leite integral
                price: 0
                quantity: 1
                options: []
          - guid: c51e7a90-4b3d-4c8e-a2f6-9d0b1e3c5f44
            itemId: itm-fermentacao-natural
            name: Fermentação natural
            unitPrice: 2800
            quantity: 1
            lineTotal: 2800
            options:
              - optionId: opt-inteiro-fatiado
                name: Inteiro, fatiado
                price: 0
                quantity: 1
                options: []
        orderTotal:
          subtotal: 8280
          discountTotal: 0
          total: 8280
          taxInclusive: true
          tax: null
          currency: BRL
        cpfCnpj: null
        journeyStartedTimestamp: '2026-10-30T11:58:02Z'
        createdAt: '2026-10-30T12:03:40Z'
        placedAt: null
        readyAt: null
    OrderLine:
      type: object
      description: ENT-BASKET-03 as sold. `unitPrice` includes the options.
      required: [guid, itemId, name, unitPrice, quantity, lineTotal, options]
      properties:
        guid:
          type: string
          format: uuid
        itemId:
          type: string
        name:
          type: string
        unitPrice:
          $ref: '#/components/schemas/Money'
        quantity:
          type: integer
          minimum: 1
        lineTotal:
          $ref: '#/components/schemas/Money'
        options:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineOption'
    OrderLineOption:
      type: object
      required: [optionId, name, price, quantity, options]
      properties:
        optionId:
          type: string
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        quantity:
          type: integer
        options:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineOption'
    PaymentMethod:
      type: string
      enum: [PIX, CREDIT, DEBIT]
    PaymentStatus:
      type: string
      enum: [AUTHORISING, AUTHORISED, FAILED, CANCELLED]
    StartPaymentRequest:
      type: object
      required: [method]
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'
    Payment:
      type: object
      example:
        id: pay-91c2
        orderId: ord-7f3a
        method: CREDIT
        amount: 8280
        paymentStatus: AUTHORISING
        gatewayType: SIMULATED
        providerRef: null
        failureReason: null
        pix: null
        createdAt: '2026-10-30T12:03:45Z'
        updatedAt: '2026-10-30T12:03:45Z'
      description: ENT-PAY-01.
      required: [id, orderId, method, amount, paymentStatus, gatewayType, providerRef, failureReason, pix, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: pay-91c2
        orderId:
          type: string
          example: ord-7f3a
        method:
          $ref: '#/components/schemas/PaymentMethod'
        amount:
          $ref: '#/components/schemas/Money'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        gatewayType:
          type: string
          description: '`SIMULATED` until phase 4; then the chosen provider.'
          example: SIMULATED
        providerRef:
          type: string
          nullable: true
        failureReason:
          type: string
          nullable: true
          example: null
        pix:
          $ref: '#/components/schemas/PixCharge'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PixCharge:
      type: object
      nullable: true
      description: Only for `PIX` shown on screen.
      required: [copyPaste, expiresAt]
      properties:
        copyPaste:
          type: string
          description: Pix "copia e cola" payload; the kiosk draws the QR code from it.
        expiresAt:
          type: string
          format: date-time
    SimulatePaymentRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [AUTHORISED, FAILED]
    PlacedOrder:
      type: object
      example:
        orderId: ord-7f3a
        posCheckNumber: '42'
        waitTime: 8
        status: PAID
      description: OP-PAY-03 response (`OrderResponse`).
      required: [orderId, posCheckNumber, waitTime, status]
      properties:
        orderId:
          type: string
          example: ord-7f3a
        posCheckNumber:
          type: string
          example: '42'
        waitTime:
          type: integer
          nullable: true
          description: |
            Minutes: the owner's wait minutes for the current pace (NORMAL or BUSY;
            `PaceWaitMinutes`). Plan decision 4 closes open question 2. Null only if
            the owner cleared them.
          example: 8
        status:
          $ref: '#/components/schemas/OrderStatus'

    # ------------------------------------------------------------ Kitchen
    KitchenOrder:
      type: object
      example:
        id: ord-7f3a
        posCheckNumber: '42'
        orderType: TAKE_OUT
        status: PREPARING
        placedAt: '2026-10-30T12:04:10Z'
        readyAt: null
        updatedAt: '2026-10-30T12:05:02Z'
        version: 2
        history:
          - status: PAID
            at: '2026-10-30T12:04:10Z'
            by: KIOSK
          - status: PREPARING
            at: '2026-10-30T12:05:02Z'
            by: KITCHEN
        lines:
          - itemId: itm-croque
            name: Croque monsieur
            quantity: 1
            options: [Brioche, Ovo pochê]
            choices:
              - optionId: opt-brioche
                name: Brioche
                quantity: 1
              - optionId: opt-ovo-poche
                name: Ovo pochê
                quantity: 1
          - itemId: itm-cappuccino
            name: Cappuccino
            quantity: 1
            options: [Leite integral]
            choices:
              - optionId: opt-leite-integral
                name: Leite integral
                quantity: 1
      required: [id, posCheckNumber, orderType, status, placedAt, readyAt, updatedAt, version, history, lines]
      properties:
        id:
          type: string
        posCheckNumber:
          type: string
        orderType:
          $ref: '#/components/schemas/OrderType'
        status:
          $ref: '#/components/schemas/OrderStatus'
        placedAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          description: Time of the last status change.
        version:
          type: integer
          minimum: 1
          description: |
            1 when paid, +1 on every status change. Clients keep the highest version
            they have seen (stale-event guard, plan G-K3).
        history:
          type: array
          description: Every status the order had, oldest first (plan G-K2). Starts with PAID.
          items:
            $ref: '#/components/schemas/KitchenStatusChange'
        lines:
          type: array
          items:
            type: object
            required: [itemId, name, quantity, options, choices]
            properties:
              itemId:
                type: string
                description: For "Acabou" (`setKitchenAvailability`).
              name:
                type: string
              quantity:
                type: integer
              options:
                type: array
                description: Option names, flattened, in pt-BR. Same order as `choices`.
                items:
                  type: string
              choices:
                type: array
                description: The chosen options with their ids, flattened, in pt-BR.
                items:
                  type: object
                  required: [optionId, name, quantity]
                  properties:
                    optionId:
                      type: string
                    name:
                      type: string
                    quantity:
                      type: integer
    KitchenStatusChange:
      type: object
      required: [status, at, by]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
        at:
          type: string
          format: date-time
        by:
          type: string
          enum: [KIOSK, KITCHEN, OWNER, SYSTEM]
          description: KIOSK for the payment, SYSTEM for automatic changes.
    KitchenStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PREPARING, READY, COLLECTED]
        expectedVersion:
          type: integer
          minimum: 1
          description: Optional. The `version` the client saw; a different one is `409 STALE_ORDER_VERSION`.
    KitchenAvailabilityUpdate:
      type: object
      required: [itemId, optionId, soldOut]
      properties:
        itemId:
          type: string
        optionId:
          type: string
          nullable: true
          description: Null marks the whole item; an id marks only that option of the item.
        soldOut:
          type: boolean
          description: True sold out for today; false back in stock.
    KitchenAvailability:
      type: object
      required: [itemId, optionId, soldOutDate]
      properties:
        itemId:
          type: string
        optionId:
          type: string
          nullable: true
        soldOutDate:
          type: string
          format: date
          nullable: true
          description: Today's business date while sold out; null when back in stock.
    OrderCancelRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [ITEM_SOLD_OUT, CANNOT_PREPARE, OTHER]
        note:
          type: string
          maxLength: 140
          nullable: true
    Pace:
      type: string
      enum: [NORMAL, BUSY, PAUSED]
      description: |
        NORMAL: the kiosk sells, `waitTime` is the NORMAL minutes.
        BUSY ("Movimentado"): the kiosk sells, `waitTime` is the BUSY minutes.
        PAUSED: every kiosk shows the at-capacity screen until `pausedUntil`, when Go
        returns to NORMAL by itself (server time, restaurant timezone).
    StorePace:
      type: object
      example:
        pace: PAUSED
        pausedUntil: '2026-10-30T12:30:00Z'
        changedAt: '2026-10-30T12:15:00Z'
        changedBy: KITCHEN
        waitMinutes:
          NORMAL: 8
          BUSY: 15
      required: [pace, pausedUntil, changedAt, changedBy, waitMinutes]
      properties:
        pace:
          $ref: '#/components/schemas/Pace'
        pausedUntil:
          type: string
          format: date-time
          nullable: true
          description: Set only while PAUSED.
        changedAt:
          type: string
          format: date-time
        changedBy:
          type: string
          enum: [KITCHEN, OWNER, SYSTEM]
          description: SYSTEM for the automatic resume.
        waitMinutes:
          $ref: '#/components/schemas/PaceWaitMinutes'
    StorePaceUpdate:
      type: object
      required: [pace]
      properties:
        pace:
          $ref: '#/components/schemas/Pace'
        pauseMinutes:
          type: integer
          enum: [15, 30]
          description: Required when `pace` is PAUSED, ignored otherwise.
    PaceWaitMinutes:
      type: object
      required: [NORMAL, BUSY]
      properties:
        NORMAL:
          type: integer
          minimum: 1
          maximum: 120
          example: 8
        BUSY:
          type: integer
          minimum: 1
          maximum: 120
          example: 15

    # ------------------------------------------------------------ Admin
    OwnerLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    OwnerToken:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Seconds.
    RestaurantInput:
      type: object
      required: [name, cnpj, timezone, defaultLanguage, supportedLanguages, isDineInAvailable, isTakeOutAvailable, closedMessage, posCheckNumberDisplayLength]
      properties:
        name:
          type: string
        logo:
          type: string
          nullable: true
        cnpj:
          type: string
          pattern: '^[0-9]{14}$'
        timezone:
          type: string
          example: America/Sao_Paulo
        defaultLanguage:
          $ref: '#/components/schemas/LanguageCode'
        supportedLanguages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageCode'
        isDineInAvailable:
          type: boolean
        isTakeOutAvailable:
          type: boolean
        closedMessage:
          $ref: '#/components/schemas/ClosedMessage'
        posCheckNumberDisplayLength:
          type: integer
          minimum: 1
          maximum: 6
        receiptFooter:
          $ref: '#/components/schemas/LocalizedText'
    Restaurant:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: string
        - $ref: '#/components/schemas/RestaurantInput'
    MediaAsset:
      type: object
      required: [id, url, width, height]
      properties:
        id:
          type: string
        url:
          type: string
          example: /media/fermentacao-natural.jpg
        width:
          type: integer
        height:
          type: integer
    DeviceStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    DeviceInput:
      type: object
      required: [name, kind, status, idleTimerIntervalMilliseconds, printerEnabled, maintenanceMode, atCapacityMode]
      properties:
        name:
          type: string
          example: Totem da entrada
        kind:
          $ref: '#/components/schemas/DeviceKind'
        status:
          $ref: '#/components/schemas/DeviceStatus'
        idleTimerIntervalMilliseconds:
          type: integer
          minimum: 0
        printerEnabled:
          type: boolean
        maintenanceMode:
          type: boolean
        atCapacityMode:
          type: boolean
    AdminDevice:
      allOf:
        - $ref: '#/components/schemas/DeviceInput'
        - type: object
          required: [id, online, appVersion, lastSeenAt, ip, screenResolution]
          properties:
            id:
              type: string
              example: KIOSK-TBT-001
            online:
              type: boolean
              description: A heartbeat arrived in the last 3 minutes.
            appVersion:
              type: string
              nullable: true
            lastSeenAt:
              type: string
              format: date-time
              nullable: true
            ip:
              type: string
              nullable: true
            screenResolution:
              type: string
              nullable: true
    DeviceCredentials:
      type: object
      required: [device, deviceSecret]
      properties:
        device:
          $ref: '#/components/schemas/AdminDevice'
        deviceSecret:
          type: string
          description: Shown once. The Go API stores only its hash.
    MenuInput:
      type: object
      required: [name, showCategoriesPrice]
      properties:
        name:
          $ref: '#/components/schemas/LocalizedText'
        showCategoriesPrice:
          type: boolean
    AdminMenu:
      allOf:
        - $ref: '#/components/schemas/MenuInput'
        - type: object
          required: [id, currency, isActive, forcedUntil]
          properties:
            id:
              type: string
            currency:
              type: string
              enum: [BRL]
            isActive:
              type: boolean
            forcedUntil:
              type: string
              format: date-time
              nullable: true
    MenuSchedule:
      type: object
      description: Opening window in the restaurant's timezone. `timeStart` later than `timeEnd` runs past midnight.
      required: [weekday, timeStart, timeEnd]
      properties:
        weekday:
          $ref: '#/components/schemas/Weekday'
        timeStart:
          $ref: '#/components/schemas/LocalTime'
        timeEnd:
          $ref: '#/components/schemas/LocalTime'
    ForceMenuRequest:
      type: object
      required: [until]
      properties:
        until:
          type: string
          format: date-time
    CategoryInput:
      type: object
      required: [menuId, name, displayOrder]
      properties:
        menuId:
          type: string
        parentId:
          type: string
          nullable: true
        name:
          $ref: '#/components/schemas/LocalizedText'
        image:
          type: string
          nullable: true
        displayOrder:
          type: integer
    AdminCategory:
      allOf:
        - $ref: '#/components/schemas/CategoryInput'
        - type: object
          required: [id]
          properties:
            id:
              type: string
    CategoryItemLink:
      type: object
      required: [itemId, displayOrder]
      properties:
        itemId:
          type: string
        displayOrder:
          type: integer
        priceOverride:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Integer cents in BRL, or null.
    FiscalFields:
      type: object
      nullable: true
      description: Phase 4. Final shape depends on the NFC-e API and the accountant (open question 5).
      properties:
        ncm:
          type: string
          example: '19059090'
        cfop:
          type: string
          example: '5102'
        taxes:
          type: object
          additionalProperties:
            type: string
    ItemInput:
      type: object
      required: [name, price, serviceAvailability]
      properties:
        plu:
          type: string
          nullable: true
        name:
          $ref: '#/components/schemas/LocalizedText'
        shortName:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        image:
          type: string
          nullable: true
        price:
          $ref: '#/components/schemas/Money'
        servicePriceOverride:
          $ref: '#/components/schemas/ServicePriceOverride'
        serviceAvailability:
          $ref: '#/components/schemas/ServiceAvailability'
        calories:
          type: string
          nullable: true
        itemLabels:
          type: array
          items:
            type: string
        defaultEntity:
          type: string
          nullable: true
        crossSellGroupId:
          type: string
          nullable: true
        fiscal:
          $ref: '#/components/schemas/FiscalFields'
    AdminItem:
      allOf:
        - $ref: '#/components/schemas/ItemInput'
        - type: object
          required: [id, soldOutDate]
          properties:
            id:
              type: string
            soldOutDate:
              type: string
              format: date
              nullable: true
    AdminOption:
      type: object
      required: [name, price, maximumQuantity, defaultQuantity, supersede, displayOrder]
      properties:
        id:
          type: string
          description: Empty on create; kept on replace so order history stays linked.
        plu:
          type: string
          nullable: true
        name:
          $ref: '#/components/schemas/LocalizedText'
        price:
          $ref: '#/components/schemas/Money'
        servicePriceOverride:
          $ref: '#/components/schemas/ServicePriceOverride'
        maximumQuantity:
          type: integer
          minimum: 1
        defaultQuantity:
          type: integer
          minimum: 0
        supersede:
          type: boolean
        displayOrder:
          type: integer
    AdminCompositeOption:
      type: object
      required: [positiveOption, negativeOption]
      properties:
        positiveOption:
          $ref: '#/components/schemas/AdminOption'
        negativeOption:
          $ref: '#/components/schemas/AdminOption'
        defaultChoice:
          type: string
          nullable: true
          enum: [POSITIVE, NEGATIVE]
    OptionGroupInput:
      type: object
      description: Belongs to an item, or to an option for nested groups.
      required: [name, role, minimum, maximum, displayOrder, options]
      properties:
        itemId:
          type: string
          nullable: true
        parentOptionId:
          type: string
          nullable: true
        name:
          $ref: '#/components/schemas/LocalizedText'
        role:
          $ref: '#/components/schemas/OptionGroupRole'
        minimum:
          type: integer
          minimum: 0
        maximum:
          type: integer
          minimum: 0
        defaultOption:
          type: string
          nullable: true
        displayOrder:
          type: integer
        options:
          type: array
          items:
            $ref: '#/components/schemas/AdminOption'
        compositeOptions:
          type: array
          items:
            $ref: '#/components/schemas/AdminCompositeOption'
    AdminOptionGroup:
      allOf:
        - $ref: '#/components/schemas/OptionGroupInput'
        - type: object
          required: [id]
          properties:
            id:
              type: string
    TagInput:
