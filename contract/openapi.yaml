        '404':
          $ref: '#/components/responses/NotFound'

  /v2/admin/orders/{number}/cancel:
    post:
      tags: [Admin]
      operationId: cancelOrder
      summary: Cancel a paid order that cannot be made
      description: |
        Confirmed with the owner's login. Allowed from PAID, PREPARING and READY; anything else
        is `409 INVALID_STATUS_TRANSITION`. Sets CANCELLED with a history entry by OWNER and
        sends `order.status_changed`. The refund is done in the Mercado Pago panel, outside
        Comanda. Cancelled orders count on their own line in the report, never in revenue.
      x-phase: 4
      security:
        - ownerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCancelRequest'
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already collected, cancelled or not collected (`INVALID_STATUS_TRANSITION`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v2/admin/pace:
    get:
