      description: Defaults NORMAL 8, BUSY 15. The success screen shows `store.waitMinutes` for the current pace.
      x-phase: 4
      security:
        - ownerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaceWaitMinutes'
      responses:
        '200':
