<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Garçom · Entrar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.tap{transition:transform .12s ease,background-color .15s ease}
.tap:active{transform:scale(.97)}
main{scrollbar-width:none}main::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3EFE8; color: #2B211C; font-family: Manrope, system-ui, sans-serif; font-feature-settings: 'tnum' 1; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E5DDD2; padding: 14px 16px 12px; display: flex; align-items: center; gap: 8px; flex-shrink: 0">
    <span style="font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 500; font-size: 22px">Comanda</span>
    <span style="height: 22px; padding: 0 8px; border-radius: 11px; display: inline-flex; align-items: center; background: #EFE4C9; font-size: 11px; font-weight: 800; color: #8A5A2B">Garçom</span>
  </header>

  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-weight: 700; font-size: 24px; letter-spacing: -0.02em">Quem está no turno?</h1>
      <p style="margin: 0; font-size: 14px; font-weight: 600; color: #625750">Escolha seu nome e digite seu PIN de 4 números.</p>
    </div>

    <div role="radiogroup" aria-label="Garçom" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{names}}" as="n" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{n.checked}}" onClick="{{n.pick}}" class="tap" style="{{n.style}}"><span aria-hidden="true" style="{{n.avatarStyle}}">{{n.initial}}</span><span>{{n.label}}</span></button>
      </sc-for>
    </div>

    <section aria-labelledby="pin-h" style="border-radius: 14px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
        <h2 id="pin-h" style="margin: 0; font-size: 16px; font-weight: 800">PIN</h2>
        <p style="margin: 0; font-size: 13px; font-weight: 600; color: #625750">{{pinHint}}</p>
      </div>
      <div aria-label="PIN digitado" style="display: flex; gap: 14px">
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="4"><span style="{{d.style}}"></span></sc-for>
      </div>
      <div role="group" aria-label="Teclado numérico" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
          <button type="button" aria-label="{{k.aria}}" onClick="{{k.press}}" class="tap" style="{{k.style}}">{{k.label}}</button>
        </sc-for>
      </div>
    </section>

    <div role="note" style="border-radius: 14px; background: #EFE4C9; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 14px; font-weight: 800">Login do garçom ainda em aberto</span>
      <span style="font-size: 12px; font-weight: 600; color: #625750; line-height: 1.4">Nome e PIN são só o desenho: o jeito de entrar ainda não foi decidido.</span>
    </div>
  </main>

  <footer style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E5DDD2; padding: 12px 16px 20px">
    <sc-if value="{{pinFull}}" hint-placeholder-val="{{false}}">
      <a href="G2-Mesas.dc.html" class="tap" style="height: 54px; border-radius: 27px; background: #4E3426; color: #FAF6F0; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">Entrar</a>
    </sc-if>
    <sc-if value="{{pinOpen}}" hint-placeholder-val="{{true}}">
      <button type="button" disabled style="width: 100%; height: 54px; border-radius: 27px; border: 0; background: #D6CCC0; color: #625750; font-size: 16px; font-weight: 800">Entrar</button>
    </sc-if>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: '', pin: '' };
  }
  renderVals() {
    const s = this.state;
    const NAMES = [['ana', 'Ana'], ['bruno', 'Bruno'], ['carla', 'Carla']];
    const picked = NAMES.find((n) => n[0] === s.name);
    const names = NAMES.map(([id, nm]) => {
      const on = s.name === id;
      return {
        label: nm,
        initial: nm.charAt(0),
        checked: on ? 'true' : 'false',
        pick: () => this.setState({ name: id }),
        style: 'min-height: 96px; box-sizing: border-box; border-radius: 14px; border: ' + (on ? '2px solid #4E3426; background: #FBF8F3;' : '1.5px solid #E5DDD2; background: #FFFFFF;') + ' display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: ' + (on ? '800' : '700') + ';',
        avatarStyle: 'width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; background: ' + (on ? '#4E3426; color: #FAF6F0;' : '#EAD9C6; color: #2B211C;')
      };
    });
    const dots = [0, 1, 2, 3].map((i) => {
      const on = i < s.pin.length;
      return { style: 'display: block; width: 16px; height: 16px; border-radius: 8px; box-sizing: border-box; border: 2px solid ' + (on ? '#4E3426' : '#B5ADA3') + '; background: ' + (on ? '#4E3426' : 'transparent') + ';' };
    });
    const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'Apagar'];
    const keys = KEYS.map((k) => {
      if (k === '') return { label: '', aria: '', press: () => {}, style: 'visibility: hidden; height: 64px;' };
      const back = k === 'Apagar';
      return {
        label: back ? 'Apagar' : k,
        aria: back ? 'Apagar último número' : 'Número ' + k,
        press: () => {
          if (back) this.setState({ pin: s.pin.slice(0, -1) });
          else if (s.pin.length < 4) this.setState({ pin: s.pin + k });
        },
        style: 'height: 64px; border-radius: 14px; border: 1px solid #E5DDD2; background: #FFFFFF; display: flex; align-items: center; justify-content: center; ' + (back ? 'font-size: 15px; font-weight: 800; color: #625750;' : 'font-size: 24px; font-weight: 700;')
      };
    });
    const pinFull = !!picked && s.pin.length === 4;
    return {
      names, dots, keys,
      pinHint: picked ? 'Entrando como ' + picked[1] : 'Escolha seu nome primeiro',
      pinFull,
      pinOpen: !pinFull
    };
  }
}
</script>
</body>
</html>
