<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Garçom · Mesas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.tap{transition:transform .12s ease,background-color .15s ease}
.tap:active{transform:scale(.97)}
main,.chips{scrollbar-width:none}main::-webkit-scrollbar,.chips::-webkit-scrollbar,.alerts::-webkit-scrollbar{display:none}
.alerts{scrollbar-width:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3EFE8; color: #2B211C; font-family: Manrope, system-ui, sans-serif; font-feature-settings: 'tnum' 1; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E5DDD2; padding: 14px 16px 12px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 500; font-size: 22px">Comanda</span>
      <span style="height: 22px; padding: 0 8px; border-radius: 11px; display: inline-flex; align-items: center; background: #EFE4C9; font-size: 11px; font-weight: 800; color: #8A5A2B">Garçom</span>
    </div>
    <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 14px; background: #4E3426; color: #FAF6F0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">A</span>Ana</span>
  </header>

  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <div role="status" aria-label="Alertas" class="alerts" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 0 16px; flex-shrink: 0">
      <span style="height: 36px; flex-shrink: 0; padding: 0 12px; border-radius: 18px; display: inline-flex; align-items: center; gap: 8px; background: #DCDFD2; font-size: 13px; font-weight: 800; white-space: nowrap"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #4F6B45"></span>Mesa 6: pedido pronto</span>
      <span style="height: 36px; flex-shrink: 0; padding: 0 12px; border-radius: 18px; display: inline-flex; align-items: center; gap: 8px; background: #F4E1DB; color: #8C3A24; font-size: 13px; font-weight: 800; white-space: nowrap"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #A3472F"></span>Mesa 4 pediu a conta</span>
      <span style="height: 36px; flex-shrink: 0; padding: 0 12px; border-radius: 18px; display: inline-flex; align-items: center; gap: 8px; background: #EAD9C6; font-size: 13px; font-weight: 800; white-space: nowrap"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #8A5A2B"></span>Mesa 8: pedido novo pelo QR</span>
    </div>

    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 style="margin: 0; font-weight: 700; font-size: 24px; letter-spacing: -0.02em">Mesas</h1>
      <span style="font-size: 13px; font-weight: 700; color: #625750">Qua, 4 nov · 10:42</span>
    </div>

    <div class="chips" role="radiogroup" aria-label="Filtrar mesas" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 0 16px; flex-shrink: 0">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{f.checked}}" onClick="{{f.pick}}" class="tap" style="{{f.style}}">{{f.label}} <span style="{{f.countStyle}}">{{f.count}}</span></button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
        <a href="{{t.href}}" aria-label="{{t.aria}}" class="tap" style="{{t.style}}">
          <span style="font-size: 16px; font-weight: 800; color: #2B211C">{{t.title}}</span>
          <span style="font-size: 12px; font-weight: 800; line-height: 1.2">{{t.status}}</span>
          <span style="font-size: 12px; font-weight: 700; line-height: 1.2; color: #2B211C">{{t.detail}}</span>
          <span style="font-size: 11px; font-weight: 700; line-height: 1.2; color: #625750">{{t.sub}}</span>
        </a>
      </sc-for>
    </div>
  </main>

  <footer style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E5DDD2; padding: 12px 16px 20px">
    <button type="button" class="tap" style="width: 100%; height: 54px; border-radius: 27px; border: 0; background: #4E3426; color: #FAF6F0; font-size: 16px; font-weight: 800">Pedido no balcão</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const s = this.state;
    const T = [
      { n: 1, kind: 'free', status: 'Livre' },
      { n: 2, kind: 'busy', status: 'Ocupada', detail: 'R$ 48,30', sub: 'há 25 min' },
      { n: 3, kind: 'free', status: 'Livre' },
      { n: 4, kind: 'bill', status: 'Pediu a conta', detail: 'R$ 72,10' },
      { n: 5, kind: 'busy', status: 'Ocupada', detail: 'R$ 31,80' },
      { n: 6, kind: 'ready', status: 'Pronto para servir' },
      { n: 7, kind: 'free', status: 'Livre' },
      { n: 8, kind: 'qr', status: 'Pedido novo pelo QR' },
      { n: 9, kind: 'free', status: 'Livre' },
      { n: 10, kind: 'busy', status: 'Ocupada', detail: 'R$ 22,40' },
      { n: 11, kind: 'free', status: 'Livre' },
      { n: 12, kind: 'mine', status: 'Ocupada', detail: 'R$ 95,60', sub: '1 preparando · aberta por Ana' }
    ];
    const KIND = {
      free: 'background: #FFFFFF; border: 1px solid #E5DDD2; color: #625750;',
      busy: 'background: #EFE4C9; border: 1px solid #E0D0AE; color: #2B211C;',
      bill: 'background: #F4E1DB; border: 1.5px solid #A3472F; color: #8C3A24;',
      ready: 'background: #DCDFD2; border: 1px solid #C2C8B5; color: #2B211C;',
      qr: 'background: #EAD9C6; border: 1px solid #D5BFA3; color: #2B211C;',
      mine: 'background: #EFE4C9; border: 2px solid #4E3426; color: #2B211C;'
    };
    const MATCH = {
      all: () => true,
      mine: (t) => t.n === 12,
      attention: (t) => t.kind === 'bill' || t.kind === 'ready' || t.kind === 'qr'
    };
    const tiles = T.filter((t) => MATCH[s.filter](t)).map((t) => ({
      title: 'Mesa ' + t.n,
      status: t.status,
      detail: t.detail || '',
      sub: t.sub || '',
      href: t.n === 12 ? 'G3-Mesa.dc.html' : '#mesa-' + t.n,
      style: 'min-height: 104px; box-sizing: border-box; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 3px; text-align: left; text-decoration: none; ' + KIND[t.kind],
      aria: 'Mesa ' + t.n + ', ' + t.status + (t.detail ? ', ' + t.detail : '') + (t.n === 12 ? ', abrir' : '')
    }));
    const F = [['all', 'Todas', 12], ['mine', 'Minhas', 1], ['attention', 'Precisam de mim', 3]];
    const filters = F.map(([id, label, count]) => {
      const on = id === s.filter;
      return {
        label, count, checked: on ? 'true' : 'false',
        pick: () => this.setState({ filter: id }),
        style: 'height: 40px; flex-shrink: 0; padding: 0 14px; border-radius: 12px; font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; ' + (on ? 'border: 0; background: #4E3426; color: #FAF6F0;' : 'border: 1px solid #E5DDD2; background: #FFFFFF; color: #2B211C;'),
        countStyle: 'font-size: 12px; font-weight: 800; ' + (on ? 'color: #D9C8B8;' : 'color: #625750;')
      };
    });
    return { filters, tiles };
  }
}
</script>
</body>
</html>
