<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Garçom · Adicionar itens</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.tap{transition:transform .12s ease,background-color .15s ease}
.tap:active{transform:scale(.97)}
main,.chips{scrollbar-width:none}main::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3EFE8; color: #2B211C; font-family: Manrope, system-ui, sans-serif; font-feature-settings: 'tnum' 1; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E5DDD2; height: 60px; padding: 0 8px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
    <a href="G3-Mesa.dc.html" aria-label="Voltar para a Mesa 12" class="tap" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
      <h1 style="margin: 0; font-weight: 800; font-size: 18px; letter-spacing: -0.01em">Adicionar itens</h1>
      <span style="font-size: 12px; font-weight: 700; color: #625750">Mesa 12 · Rodada 3</span>
    </div>
  </header>

  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <label style="height: 48px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 0 12px; display: flex; align-items: center; gap: 8px; flex-shrink: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#625750" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar item</span>
      <input type="search" placeholder="Buscar item" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; font-weight: 600">
    </label>

    <div class="chips" role="radiogroup" aria-label="Categorias" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 0 16px; flex-shrink: 0">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
        <button type="button" role="radio" aria-checked="{{c.checked}}" onClick="{{c.pick}}" class="tap" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-if value="{{showCroque}}" hint-placeholder-val="{{true}}">
        <a href="G5-Item.dc.html" class="tap" style="border-radius: 14px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 8px 12px 8px 8px; min-height: 68px; box-sizing: border-box; display: flex; align-items: center; gap: 12px">
          <img src="/_blob/a479abedd3198e4acec76278caec4352" alt="" style="width: 52px; height: 52px; border-radius: 12px; object-fit: cover; flex-shrink: 0">
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 800">Croque monsieur</span>
            <span style="font-size: 13px; font-weight: 700; color: #6B4430">R$ 34,90 · tem opções</span>
          </span>
          <span style="height: 36px; padding: 0 14px; border-radius: 18px; background: #4E3426; color: #FAF6F0; display: inline-flex; align-items: center; font-size: 13px; font-weight: 800; flex-shrink: 0">Escolher</span>
        </a>
      </sc-if>
      <sc-for list="{{items}}" as="it" hint-placeholder-count="8">
        <div style="border-radius: 14px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 8px 8px 8px 8px; min-height: 68px; box-sizing: border-box; display: flex; align-items: center; gap: 12px">
          <img src="{{it.img}}" alt="" style="{{it.imgStyle}}">
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="{{it.nameStyle}}">{{it.name}}</span>
            <span style="{{it.subStyle}}">{{it.sub}}</span>
          </span>
          <button type="button" aria-disabled="{{it.dis}}" aria-label="{{it.aria}}" onClick="{{it.act}}" class="tap" style="{{it.btnStyle}}">{{it.btn}}</button>
        </div>
      </sc-for>
    </div>
  </main>

  <footer style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E5DDD2; padding: 10px 16px 20px">
    <a href="G6-Enviar.dc.html" class="tap" style="min-height: 56px; border-radius: 28px; background: #4E3426; color: #FAF6F0; padding: 0 12px 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; font-weight: 800">
      <span>{{barText}}</span>
      <span style="height: 36px; padding: 0 14px; border-radius: 18px; background: #FAF6F0; color: #4E3426; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; flex-shrink: 0">Revisar<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
    </a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'all', cart: { latte: 1, cappuccino: 1 } };
  }
  renderVals() {
    const s = this.state;
    const PH = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 52 52'><rect width='52' height='52' rx='12' fill='%23E9E2D7'/><circle cx='18' cy='19' r='4' fill='%23B5ADA3'/><path d='M10 40l11-12 7 7 5-5 9 10z' fill='%23B5ADA3'/></svg>";
    const B = (id) => '/_blob/' + id;
    const CATS = [['all', 'Todos'], ['paes', 'Pães'], ['folhados', 'Folhados'], ['doces', 'Doces'], ['sanduiches', 'Sanduíches'], ['cafes', 'Cafés']];
    const ITEMS = [
      { id: 'cappuccino', name: 'Cappuccino', c: 1390, cat: 'cafes', img: B('fad654d6989d25fca51c9d92d94e87fe') },
      { id: 'latte', name: 'Latte', c: 1490, cat: 'cafes', img: B('0574bc346cd2005a374bc24f039ce368') },
      { id: 'suco', name: 'Suco de laranja', c: 1290, cat: 'cafes', img: PH },
      { id: 'fermentacao', name: 'Fermentação natural', c: 2800, cat: 'paes', img: B('98cbb1f4f6b7f3edec9da5925073bf50') },
      { id: 'baguete', name: 'Baguete tradicional', c: 1200, cat: 'paes', img: B('52aefe2f38711a9dba6c6d98a667e764') },
      { id: 'brioche', name: 'Brioche', c: 2200, cat: 'paes', img: B('047746f7a157bfdd9c6001ac23ce2a96') },
      { id: 'centeio', name: 'Centeio com sementes', c: 2600, cat: 'paes', img: B('a23de7c0c843835788b1621744dd8774'), out: true },
      { id: 'pao-queijo', name: 'Pão de queijo', c: 550, cat: 'paes', img: PH },
      { id: 'croissant', name: 'Croissant', c: 1400, cat: 'folhados', img: B('0471b8153aad0569ffc277ed8052709f') },
      { id: 'amendoas', name: 'Croissant de amêndoas', c: 1990, cat: 'folhados', img: B('ffc594607ef0406da7409e8e48bc9786'), out: true },
      { id: 'cookie', name: 'Cookie de chocolate', c: 990, cat: 'doces', img: B('7d2f91e3af9882691725f05f3343cffd') },
      { id: 'donut', name: 'Donut de morango', c: 1190, cat: 'doces', img: B('efa0d879f959d1026df53e039ac2c7cf') }
    ];
    const money = (c) => 'R$ ' + Math.floor(c / 100) + ',' + String(c % 100).padStart(2, '0');
    const count = (id) => s.cart[id] || 0;
    const add = (id) => this.setState({ cart: Object.assign({}, s.cart, { [id]: count(id) + 1 }) });
    const n = Object.keys(s.cart).reduce((a, k) => a + s.cart[k], 0);
    const total = ITEMS.reduce((a, it) => a + it.c * count(it.id), 0);
    const cats = CATS.map(([id, label]) => {
      const on = id === s.cat;
      return {
        label, checked: on ? 'true' : 'false',
        pick: () => this.setState({ cat: id }),
        style: 'height: 40px; flex-shrink: 0; padding: 0 14px; border-radius: 12px; font-size: 14px; font-weight: 800; ' + (on ? 'border: 0; background: #4E3426; color: #FAF6F0;' : 'border: 1px solid #E5DDD2; background: #FFFFFF; color: #2B211C;')
      };
    });
    const items = ITEMS.filter((it) => s.cat === 'all' || it.cat === s.cat).map((it) => {
      const q = count(it.id);
      const out = !!it.out;
      return {
        name: it.name,
        img: it.img,
        imgStyle: 'width: 52px; height: 52px; border-radius: 12px; object-fit: cover; flex-shrink: 0;' + (out ? ' filter: grayscale(1); opacity: .55;' : ''),
        nameStyle: 'font-size: 15px; font-weight: 800;' + (out ? ' color: #625750;' : ''),
        sub: out ? 'Esgotado hoje' : money(it.c) + (q ? ' · no pedido: ' + q : ''),
        subStyle: 'font-size: 13px; font-weight: 700; color: ' + (out ? '#8C3A24' : '#6B4430') + ';',
        dis: out ? 'true' : 'false',
        aria: out ? it.name + ', esgotado hoje' : 'Adicionar ' + it.name,
        act: out ? () => {} : () => add(it.id),
        btn: out ? 'Esgotado' : '+',
        btnStyle: out
          ? 'height: 36px; flex-shrink: 0; padding: 0 12px; border-radius: 18px; border: 0; background: #E2DED8; color: #625750; font-size: 12px; font-weight: 800;'
          : 'width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 0; background: #4E3426; color: #FAF6F0; font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; line-height: 1;'
      };
    });
    return {
      cats, items,
      showCroque: s.cat === 'all' || s.cat === 'sanduiches',
      barText: 'Rodada 3 · ' + n + (n === 1 ? ' item' : ' itens') + ' · ' + money(total)
    };
  }
}
</script>
</body>
</html>
