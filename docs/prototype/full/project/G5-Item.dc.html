<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Garçom · Croque monsieur</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.tap{transition:transform .12s ease,background-color .15s ease}
.tap:active{transform:scale(.97)}
main{scrollbar-width:none}main::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3EFE8; color: #2B211C; font-family: Manrope, system-ui, sans-serif; font-feature-settings: 'tnum' 1; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E5DDD2; height: 60px; padding: 0 8px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
    <a href="G4-Adicionar.dc.html" aria-label="Voltar para Adicionar itens" class="tap" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <h1 style="margin: 0; flex-grow: 1; font-weight: 800; font-size: 18px; letter-spacing: -0.01em">Croque monsieur</h1>
  </header>

  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <section aria-label="Item" style="border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 14px; display: flex; gap: 12px; align-items: center">
      <img src="/_blob/a479abedd3198e4acec76278caec4352" alt="Foto do Croque monsieur" style="width: 76px; height: 76px; border-radius: 12px; object-fit: cover; flex-shrink: 0">
      <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <span style="font-size: 13px; font-weight: 700; color: #625750; line-height: 1.35">Presunto, gruyère e bechamel gratinados no pão.</span>
        <span style="font-size: 15px; font-weight: 800">Preço base R$ 34,90</span>
      </span>
    </section>

    <section aria-labelledby="g-pao" style="border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 14px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-bottom: 6px"><h2 id="g-pao" style="margin: 0; font-size: 15px; font-weight: 800">Pão</h2><span style="font-size: 12px; font-weight: 700; color: #625750">Obrigatório · escolha 1</span></div>
      <div role="radiogroup" aria-label="Pão" style="display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{breads}}" as="b" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{b.checked}}" aria-disabled="{{b.dis}}" onClick="{{b.pick}}" class="tap" style="{{b.style}}"><span style="{{b.ringStyle}}"><span style="{{b.dotStyle}}"></span></span><span style="flex-grow: 1; font-size: 14px; font-weight: 700; text-align: left">{{b.name}}</span><span style="{{b.chipStyle}}">{{b.state}}</span></button>
        </sc-for>
      </div>
    </section>

    <section aria-labelledby="g-tirar" style="border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 14px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-bottom: 6px"><h2 id="g-tirar" style="margin: 0; font-size: 15px; font-weight: 800">Tirar ingredientes</h2><span style="font-size: 12px; font-weight: 700; color: #625750">Opcional · sem custo</span></div>
      <sc-for list="{{removals}}" as="r" hint-placeholder-count="2">
        <button type="button" role="checkbox" aria-checked="{{r.checked}}" onClick="{{r.pick}}" class="tap" style="{{r.style}}"><span style="{{r.boxStyle}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FAF6F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{r.iconStyle}}"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="flex-grow: 1; font-size: 14px; font-weight: 700; text-align: left">{{r.label}}</span><span style="font-size: 12px; font-weight: 700; color: #625750">R$ 0,00</span></button>
      </sc-for>
    </section>

    <section aria-labelledby="g-add" style="border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 14px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-bottom: 6px"><h2 id="g-add" style="margin: 0; font-size: 15px; font-weight: 800">Adicionais</h2><span style="font-size: 12px; font-weight: 700; color: #625750">Opcional · até 3</span></div>
      <sc-for list="{{extras}}" as="e" hint-placeholder-count="3">
        <button type="button" role="checkbox" aria-checked="{{e.checked}}" onClick="{{e.pick}}" class="tap" style="{{e.style}}"><span style="{{e.boxStyle}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FAF6F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{e.iconStyle}}"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; text-align: left"><span style="font-size: 14px; font-weight: 700">{{e.name}}</span></span><span style="font-size: 13px; font-weight: 800">{{e.price}}</span></button>
      </sc-for>
      <p style="margin: 4px 0 0; font-size: 12px; font-weight: 600; color: #625750">{{extraHint}}</p>
    </section>

    <section aria-labelledby="g-seat" style="border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><h2 id="g-seat" style="margin: 0; font-size: 15px; font-weight: 800">Para quem</h2><span style="font-size: 12px; font-weight: 700; color: #625750">Opcional</span></div>
      <div role="radiogroup" aria-label="Para quem" style="display: flex; gap: 6px; flex-wrap: wrap">
        <sc-for list="{{seats}}" as="p" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{p.checked}}" onClick="{{p.pick}}" class="tap" style="{{p.style}}">{{p.label}}</button>
        </sc-for>
      </div>
    </section>

    <label style="border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 14px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 800">Observação para a cozinha</span>
      <textarea rows="2" placeholder="Ex.: pão bem tostado" style="border-radius: 12px; border: 1.5px solid #E5DDD2; padding: 10px 12px; font-size: 16px; font-weight: 600; line-height: 1.4; resize: none; background: #FFFFFF"></textarea>
    </label>

    <section aria-label="Quantidade" style="border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 15px; font-weight: 800">Quantidade</span>
      <span style="display: flex; align-items: center; gap: 12px">
        <button type="button" aria-label="Tirar um" onClick="{{decQty}}" class="tap" style="{{qtyBtnStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
        <span style="min-width: 24px; text-align: center; font-size: 18px; font-weight: 800">{{qty}}</span>
        <button type="button" aria-label="Adicionar um" onClick="{{incQty}}" class="tap" style="{{qtyBtnStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      </span>
    </section>
  </main>

  <footer style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E5DDD2; padding: 12px 16px 20px">
    <a href="G4-Adicionar.dc.html" class="tap" style="height: 54px; border-radius: 27px; background: #4E3426; color: #FAF6F0; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{addLabel}}</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { bread: 'brioche', removed: {}, extra: { ovo: true }, seat: '', qty: 1 };
  }
  renderVals() {
    const s = this.state;
    const money = (c) => 'R$ ' + Math.floor(c / 100) + ',' + String(c % 100).padStart(2, '0');
    const BASE = 3490;
    const EXTRAS = [['ovo', 'Ovo pochê', 600], ['parma', 'Presunto de parma', 900], ['gruyere', 'Gruyère extra', 700]];
    const REMOVALS = [['bechamel', 'Sem bechamel'], ['presunto', 'Sem presunto']];
    const SEATS = [['1', 'Pessoa 1'], ['2', 'Pessoa 2'], ['3', 'Pessoa 3']];
    const chip = (bg, fg) => 'height: 24px; padding: 0 9px; border-radius: 12px; display: inline-flex; align-items: center; font-size: 11px; font-weight: 800; white-space: nowrap; background: ' + bg + '; color: ' + (fg || '#2B211C') + ';';
    const box = (on) => 'width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 6px; display: flex; align-items: center; justify-content: center; border: ' + (on ? '0; background: #4E3426;' : '1.5px solid #B5ADA3; background: #FFFFFF;');
    const icon = (on) => (on ? '' : 'visibility: hidden;');
    const row = (on) => 'min-height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; background: ' + (on ? '#FBF8F3' : 'transparent') + '; border: ' + (on ? '1.5px solid #4E3426;' : '1px solid #E5DDD2;') + ' margin-top: 6px;';
    const breads = [
      { name: 'Brioche', state: 'Disponível', id: 'brioche', dis: false, chip: chip('#DCDFD2') },
      { name: 'Fermentação', state: 'Esgotado hoje', id: 'fermentacao', dis: true, chip: chip('#F4E1DB', '#8C3A24') },
      { name: 'Ciabatta', state: 'Esgotado hoje', id: 'ciabatta', dis: true, chip: chip('#F4E1DB', '#8C3A24') }
    ].map((b) => {
      const on = s.bread === b.id;
      const dis = b.dis;
      return {
        name: b.name, state: b.state, checked: on ? 'true' : 'false', dis: dis ? 'true' : 'false',
        pick: () => { if (!dis) this.setState({ bread: b.id }); },
        style: 'min-height: 48px; box-sizing: border-box; padding: 0 10px; border-radius: 12px; display: flex; align-items: center; gap: 10px; border: ' + (on ? '1.5px solid #4E3426; background: #FBF8F3;' : '1px solid transparent; background: transparent;') + (dis ? ' opacity: .55;' : ''),
        ringStyle: 'width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 11px; border: 2px solid ' + (on ? '#4E3426' : '#B5ADA3') + '; display: flex; align-items: center; justify-content: center;',
        dotStyle: 'width: 10px; height: 10px; border-radius: 5px; background: ' + (on ? '#4E3426' : 'transparent') + ';',
        chipStyle: b.chip
      };
    });
    const removals = REMOVALS.map(([id, label]) => {
      const on = !!s.removed[id];
      return {
        label, checked: on ? 'true' : 'false',
        pick: () => this.setState({ removed: Object.assign({}, s.removed, { [id]: !on }) }),
        style: row(on) + ' cursor: pointer; font: inherit;',
        boxStyle: box(on), iconStyle: icon(on)
      };
    });
    const onCount = EXTRAS.filter(([id]) => !!s.extra[id]).length;
    const extras = EXTRAS.map(([id, name, c]) => {
      const on = !!s.extra[id];
      return {
        name, price: '+ ' + money(c), checked: on ? 'true' : 'false',
        pick: () => { if (on || onCount < 3) this.setState({ extra: Object.assign({}, s.extra, { [id]: !on }) }); },
        style: row(on) + ' cursor: pointer; font: inherit;',
        boxStyle: box(on), iconStyle: icon(on)
      };
    });
    const seats = SEATS.map(([id, label]) => {
      const on = s.seat === id;
      return {
        label, checked: on ? 'true' : 'false',
        pick: () => this.setState({ seat: on ? '' : id }),
        style: 'height: 40px; padding: 0 14px; border-radius: 12px; font-size: 14px; font-weight: 800; ' + (on ? 'border: 0; background: #4E3426; color: #FAF6F0;' : 'border: 1.5px solid #E5DDD2; background: #FFFFFF; color: #2B211C;')
      };
    });
    const extraTotal = EXTRAS.filter(([id]) => !!s.extra[id]).reduce((a, [, , c]) => a + c, 0);
    const total = (BASE + extraTotal) * s.qty;
    const qty = s.qty;
    return {
      breads, removals, extras, seats,
      extraHint: onCount + (onCount === 1 ? ' adicional escolhido' : ' adicionais escolhidos') + ' de 3.',
      qty: String(qty),
      decQty: () => this.setState({ qty: Math.max(1, qty - 1) }),
      incQty: () => this.setState({ qty: Math.min(9, qty + 1) }),
      qtyBtnStyle: 'width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #E5DDD2; background: #FFFFFF; display: flex; align-items: center; justify-content: center;' + (qty <= 1 ? ' opacity: .4;' : ''),
      addLabel: 'Adicionar · ' + money(total)
    };
  }
}
</script>
</body>
</html>
