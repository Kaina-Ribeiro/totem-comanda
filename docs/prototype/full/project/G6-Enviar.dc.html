<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Garçom · Revisar rodada</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.tap{transition:transform .12s ease,background-color .15s ease}
.tap:active{transform:scale(.97)}
main{scrollbar-width:none}main::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3EFE8; color: #2B211C; font-family: Manrope, system-ui, sans-serif; font-feature-settings: 'tnum' 1; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E5DDD2; height: 60px; padding: 0 8px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
    <a href="G4-Adicionar.dc.html" aria-label="Voltar para Adicionar itens" class="tap" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
      <h1 style="margin: 0; font-weight: 800; font-size: 18px; letter-spacing: -0.01em">Revisar rodada 3</h1>
      <span style="font-size: 12px; font-weight: 700; color: #625750">Mesa 12 · Ana · 3 pessoas</span>
    </div>
  </header>

  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
      <section role="status" aria-label="Rodada enviada" style="border-radius: 12px; background: #DCDFD2; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 15px; font-weight: 800; color: #2B211C">Enviado às 10:44 · a cozinha já recebeu</span>
        <span style="font-size: 13px; font-weight: 600; color: #2B211C; line-height: 1.4">A rodada 3 já aparece na Mesa 12 como Preparando.</span>
      </section>
    </sc-if>

    <section aria-label="Itens da rodada" style="border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 4px 14px">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="2">
        <div style="{{l.rowStyle}}">
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 800">{{l.name}}</span>
            <span style="font-size: 12px; font-weight: 600; color: #625750">{{l.unit}}</span>
          </span>
          <span style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
            <button type="button" aria-label="{{l.decLabel}}" onClick="{{l.dec}}" class="tap" style="{{l.btnStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
            <span style="min-width: 20px; text-align: center; font-size: 15px; font-weight: 800">{{l.qty}}</span>
            <button type="button" aria-label="Adicionar um {{l.name}}" onClick="{{l.inc}}" class="tap" style="{{l.btnStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
          </span>
          <span style="width: 74px; text-align: right; font-size: 15px; font-weight: 800; flex-shrink: 0">{{l.total}}</span>
        </div>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
        <p style="margin: 0; padding: 14px 0; font-size: 14px; font-weight: 700; color: #625750">Nenhum item na rodada. Volte e adicione.</p>
      </sc-if>
    </section>

    <section aria-label="Total da rodada" style="border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 14px; display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 15px; font-weight: 800">Total da rodada</span>
      <span style="font-size: 18px; font-weight: 800">{{roundTotal}}</span>
    </section>

    <label style="border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 14px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 800">Observação para a cozinha</span>
      <textarea rows="2" placeholder="Ex.: Cappuccino sem açúcar" style="border-radius: 12px; border: 1.5px solid #E5DDD2; padding: 10px 12px; font-size: 16px; font-weight: 600; line-height: 1.4; resize: none; background: #FFFFFF"></textarea>
    </label>
  </main>

  <footer style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E5DDD2; padding: 12px 16px 20px">
    <sc-if value="{{notSent}}" hint-placeholder-val="{{true}}">
      <button type="button" onClick="{{send}}" class="tap" style="width: 100%; height: 54px; border-radius: 27px; border: 0; background: #4E3426; color: #FAF6F0; font-size: 16px; font-weight: 800">Enviar para a cozinha</button>
    </sc-if>
    <sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
      <a href="G3-Mesa.dc.html" class="tap" style="height: 54px; border-radius: 27px; background: #4E3426; color: #FAF6F0; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">Voltar para a Mesa 12</a>
    </sc-if>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { latte: 1, cappuccino: 1, sent: false };
  }
  renderVals() {
    const s = this.state;
    const money = (c) => 'R$ ' + Math.floor(c / 100) + ',' + String(c % 100).padStart(2, '0');
    const ITEMS = [['latte', 'Latte', 1490], ['cappuccino', 'Cappuccino', 1390]];
    const btnStyle = 'width: 40px; height: 40px; border-radius: 20px; border: 1.5px solid #E5DDD2; background: #FFFFFF; display: flex; align-items: center; justify-content: center;';
    const setQty = (id, q) => this.setState({ [id]: Math.max(0, Math.min(9, q)) });
    const lines = ITEMS.filter(([id]) => s[id] > 0).map(([id, name, c], i, arr) => {
      const q = s[id];
      return {
        name,
        unit: money(c) + ' cada',
        qty: String(q),
        total: money(c * q),
        decLabel: q === 1 ? 'Remover ' + name : 'Tirar um ' + name,
        dec: () => setQty(id, q - 1),
        inc: () => setQty(id, q + 1),
        btnStyle,
        rowStyle: 'display: flex; align-items: center; gap: 10px; padding: 12px 0;' + (i ? ' border-top: 1px solid #E5DDD2;' : '')
      };
    });
    const roundC = ITEMS.reduce((a, [id, , c]) => a + c * s[id], 0);
    return {
      lines,
      empty: lines.length === 0,
      roundTotal: money(roundC),
      sent: s.sent,
      notSent: !s.sent,
      send: () => this.setState({ sent: true })
    };
  }
}
</script>
</body>
</html>
