<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cozinha · Ativar som</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.tap{transition:transform .12s ease,background-color .15s ease}
.tap:active{transform:scale(.98)}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #F3EFE8; color: #2B211C; font-family: Manrope, system-ui, sans-serif; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column">
    <div style="height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px">
      <span style="font-family: Manrope, system-ui, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">Cozinha</span>
      <span style="width: 360px; height: 52px; border-radius: 16px; background: #E6DED2"></span>
      <span style="width: 280px; height: 44px; border-radius: 14px; background: #FFFFFF"></span>
    </div>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 16px 24px 24px">
      <sc-for list="{{ghostCols}}" as="g" hint-placeholder-count="3">
        <div style="border-radius: 16px; background: #EAE3D8; padding: 12px; display: flex; flex-direction: column; gap: 12px">
          <div style="height: 28px"></div>
          <div style="height: 228px; border-radius: 12px; background: #FFFFFF"></div>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(28,28,26,.55)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="som-title" style="position: absolute; left: 320px; top: 92px; width: 640px; box-sizing: border-box; border-radius: 16px; background: #FFFFFF; padding: 36px 40px 32px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; box-shadow: 0 24px 60px rgba(28,28,26,.25)">
    <span style="width: 88px; height: 88px; border-radius: 44px; background: #EAD9C6; color: #8A5A2B; display: flex; align-items: center; justify-content: center">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 01-3.4 0"></path></svg>
    </span>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="som-title" style="margin: 0; font-family: Manrope, system-ui, sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.02em">Ligar o som de pedido novo?</h2>
      <p style="margin: 0; font-size: 16px; font-weight: 600; color: #625750; line-height: 1.5">O navegador só toca som depois de um toque na tela. Ligue agora para ouvir quando chegar pedido, mesmo de costas para o tablet.</p>
    </div>

    <div style="width: 100%; display: flex; flex-direction: column; gap: 10px; text-align: left">
      <span style="font-size: 15px; font-weight: 800">Qual som?</span>
      <div role="radiogroup" aria-label="Som" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{sounds}}" as="s" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{s.checked}}" onClick="{{s.pick}}" class="tap" style="{{s.style}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
            {{s.label}}
          </button>
        </sc-for>
      </div>
      <button type="button" role="switch" aria-checked="{{repeatChecked}}" onClick="{{toggleRepeat}}" class="tap" style="margin-top: 6px; min-height: 64px; padding: 0 18px; border-radius: 12px; border: 0; background: #F3EFE8; display: flex; align-items: center; justify-content: space-between; gap: 16px; text-align: left">
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 800">Repetir até alguém tocar na tela</span>
          <span style="font-size: 14px; font-weight: 600; color: #625750">Desligado, toca uma vez por pedido.</span>
        </span>
        <span style="{{switchStyle}}"><span style="{{knobStyle}}"></span></span>
      </button>
    </div>

    <div style="width: 100%; display: flex; gap: 12px">
      <a href="K1-Pedidos.dc.html" class="tap" style="flex: 1 1 0; height: 60px; border-radius: 30px; background: #F3EFE8; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800">Agora não</a>
      <a href="K1-Pedidos.dc.html" class="tap" style="flex: 1.4 1 0; height: 60px; border-radius: 30px; background: #4E3426; color: #FAF6F0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800">Ligar som</a>
    </div>
    <span style="font-size: 13px; font-weight: 600; color: #625750">Dá para mudar depois no ícone de som, no topo. A escolha fica salva neste tablet.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sound: 'sino', repeat: true };
  }
  renderVals() {
    const OPTS = [{ id: 'sino', label: 'Sino' }, { id: 'campainha', label: 'Campainha' }, { id: 'apito', label: 'Apito' }];
    const sounds = OPTS.map((o) => {
      const on = o.id === this.state.sound;
      return {
        label: o.label,
        checked: on ? 'true' : 'false',
        pick: () => this.setState({ sound: o.id }),
        style: 'height: 56px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 800; ' + (on ? 'border: 2px solid #4E3426; background: #FBF8F3; color: #2B211C;' : 'border: 1.5px solid #E5DDD2; background: #FFFFFF; color: #625750;')
      };
    });
    const r = this.state.repeat;
    return {
      ghostCols: [1, 2, 3],
      sounds,
      repeatChecked: r ? 'true' : 'false',
      toggleRepeat: () => this.setState({ repeat: !r }),
      switchStyle: 'width: 52px; height: 30px; flex-shrink: 0; border-radius: 15px; padding: 3px; box-sizing: border-box; display: flex; justify-content: ' + (r ? 'flex-end' : 'flex-start') + '; background: ' + (r ? '#4E3426' : '#C9C1B6') + '; transition: background-color .15s ease;',
      knobStyle: 'width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF;'
    };
  }
}
</script>
</body>
</html>
