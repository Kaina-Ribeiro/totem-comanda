<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.tap{transition:transform .12s ease,background-color .15s ease}

</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3EFE8; color: #2B211C; font-family: Manrope, system-ui, sans-serif; font-feature-settings: 'tnum' 1; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E5DDD2; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 500; font-size: 22px">Comanda</span>
      <span style="height: 28px; padding: 0 10px; border-radius: 14px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; background: #DCDFD2"><span style="width: 7px; height: 7px; border-radius: 4px; background: #4F6B45"></span>Aberto</span>
    </div>
    <nav aria-label="Back office" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 0 16px" ref="{{navRef}}">

      <a href="M2-Pedidos.dc.html" style="height: 36px; flex-shrink: 0; padding: 0 14px; border-radius: 12px; display: flex; align-items: center; font-size: 14px; font-weight: 700">Pedidos</a>
      <a href="M4-Esgotados.dc.html" style="height: 36px; flex-shrink: 0; padding: 0 14px; border-radius: 12px; display: flex; align-items: center; font-size: 14px; font-weight: 700">Esgotados</a>
      <a href="M9-Relatorio.dc.html" style="height: 36px; flex-shrink: 0; padding: 0 14px; border-radius: 12px; display: flex; align-items: center; font-size: 14px; font-weight: 700">Relatório</a>
      <a href="M6-Itens.dc.html" style="height: 36px; flex-shrink: 0; padding: 0 14px; border-radius: 12px; display: flex; align-items: center; font-size: 14px; font-weight: 700">Cardápio</a>
      <a href="M0-Mais.dc.html" aria-current="page" style="height: 36px; flex-shrink: 0; padding: 0 14px; border-radius: 12px; background: #EAD9C6; display: flex; align-items: center; font-size: 14px; font-weight: 800">Mais</a>
    </nav>
  </header>

  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-weight: 700; font-size: 24px; letter-spacing: -0.02em">Mais</h1>
      <span style="font-size: 13px; font-weight: 700; color: #625750">Padaria Café e Trigo</span>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 700; color: #625750">{{g.title}}</h2>
        <ul style="list-style: none; margin: 0; padding: 0 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2">
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
            <li style="{{it.rowStyle}}">
              <a href="{{it.href}}" class="tap" style="min-height: 56px; display: flex; align-items: center; gap: 12px">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4E3426" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>
                <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 800">{{it.label}}</span><span style="font-size: 12px; font-weight: 600; color: #625750">{{it.hint}}</span></span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#625750" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
              </a>
            </li>
          </sc-for>
        </ul>
      </section>
    </sc-for>

    <button type="button" class="tap" style="min-height: 52px; border-radius: 12px; border: 1px solid #E5DDD2; background: #FFFFFF; font-size: 15px; font-weight: 800; color: #A3472F">Sair</button>
  </main>
</div>
</x-dc>

    const G = [

        ['Categorias', 'Ordem no totem', 'M11-Categorias.dc.html', 'categorias'],
