<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Celular · Cardápios</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.tap{transition:transform .12s ease,background-color .15s ease}
.tap:active{transform:scale(.97)}
main{scrollbar-width:none}main::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3EFE8; color: #2B211C; font-family: Manrope, system-ui, sans-serif; font-feature-settings: 'tnum' 1; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E5DDD2; height: 60px; padding: 0 8px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
    <a href="M0-Mais.dc.html" aria-label="Voltar para Mais" class="tap" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <h1 style="margin: 0; flex-grow: 1; font-weight: 800; font-size: 18px; letter-spacing: -0.01em">Cardápios</h1>
  </header>

  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <p style="margin: 0; font-size: 13px; font-weight: 600; color: #625750; line-height: 1.45">Cada cardápio tem dias e horários. Esses horários também são o horário da loja.</p>

    <div role="radiogroup" aria-label="Cardápio a editar" style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{menus}}" as="m" hint-placeholder-count="2">
        <button type="button" role="radio" aria-checked="{{m.checked}}" onClick="{{m.pick}}" class="tap" style="{{m.style}}">
          <span style="display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%">
            <span style="font-size: 15px; font-weight: 800">{{m.name}}</span>
            <span style="display: flex; gap: 6px">
              <sc-if value="{{m.isLive}}" hint-placeholder-val="{{true}}"><span style="height: 24px; padding: 0 8px; border-radius: 12px; display: inline-flex; align-items: center; font-size: 11px; font-weight: 800; white-space: nowrap; background: #DCDFD2; color: #4F6B45">No ar agora</span></sc-if>
              <sc-if value="{{m.isForced}}" hint-placeholder-val="{{false}}"><span style="height: 24px; padding: 0 8px; border-radius: 12px; display: inline-flex; align-items: center; font-size: 11px; font-weight: 800; white-space: nowrap; background: #EFE4C9; color: #8A5A2B">Forçado</span></sc-if>
            </span>
          </span>
          <span style="font-size: 12px; font-weight: 600; color: #625750; text-align: left; line-height: 1.4">{{m.when}}</span>
          <span style="font-size: 12px; font-weight: 700; color: #625750">{{m.items}}</span>
        </button>
      </sc-for>
    </div>

    <section aria-labelledby="ed-h" style="border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <h2 id="ed-h" style="margin: 0; font-size: 17px; font-weight: 800">Editar: {{editName}}</h2>

      <sc-for list="{{windows}}" as="w" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: #FBF8F3; border: 1px solid #E5DDD2">
          <span style="font-size: 13px; font-weight: 800">{{w.label}}</span>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 700; color: #625750">Abre</span><input type="time" value="{{w.start}}" style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1.5px solid #E5DDD2; padding: 0 10px; font-size: 16px; font-weight: 700; background: #FFFFFF; min-width: 0"></label>
            <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 700; color: #625750">Fecha</span><input type="time" value="{{w.end}}" style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1.5px solid #E5DDD2; padding: 0 10px; font-size: 16px; font-weight: 700; background: #FFFFFF; min-width: 0"></label>
          </div>
          <div role="group" aria-label="Dias de {{w.label}}" style="display: flex; gap: 4px; flex-wrap: wrap">
            <sc-for list="{{w.dayBtns}}" as="db" hint-placeholder-count="7">
              <button type="button" aria-pressed="{{db.pressed}}" aria-label="{{db.aria}}" onClick="{{db.toggle}}" class="tap" style="{{db.style}}">{{db.label}}</button>
            </sc-for>
          </div>
        </div>
      </sc-for>

      <button type="button" class="tap" style="height: 44px; border-radius: 12px; border: 1px dashed #B5ADA3; background: transparent; font-size: 14px; font-weight: 800; color: #8A5A2B">+ Adicionar janela de horário</button>

      <sc-if value="{{hasConflict}}" hint-placeholder-val="{{false}}">
        <p role="alert" style="margin: 0; padding: 12px; border-radius: 12px; background: #F4E1DB; color: #8C3A24; font-size: 13px; font-weight: 800; line-height: 1.45">{{conflictText}}</p>
      </sc-if>
      <sc-if value="{{noConflict}}" hint-placeholder-val="{{true}}">
        <p style="margin: 0; font-size: 13px; font-weight: 700; color: #4F6B45">Sem sobreposição entre os cardápios.</p>
      </sc-if>

      <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid #E5DDD2">
        <button type="button" role="switch" aria-checked="{{forcedChecked}}" onClick="{{toggleForce}}" style="min-height: 52px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 800">Forçar este cardápio agora</span><span style="font-size: 12px; font-weight: 600; color: #625750">{{forceHint}}</span></span>
          <span style="{{trackStyle}}"><span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></span></span>
        </button>
        <sc-if value="{{forced}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div role="radiogroup" aria-label="Até quando" style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #F3EFE8">
              <sc-for list="{{untils}}" as="u" hint-placeholder-count="2">
                <button type="button" role="radio" aria-checked="{{u.checked}}" onClick="{{u.pick}}" class="tap" style="{{u.style}}">{{u.label}}</button>
              </sc-for>
            </div>
            <p style="margin: 0; font-size: 13px; font-weight: 600; color: #625750; line-height: 1.45">{{untilText}}</p>
          </div>
        </sc-if>
      </div>
    </section>

    <a href="M5-Datas.dc.html" class="tap" style="min-height: 60px; padding: 0 14px; border-radius: 12px; border: 1px solid #E5DDD2; background: #FFFFFF; display: flex; align-items: center; gap: 12px">
      <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 800">Datas especiais</span><span style="font-size: 12px; font-weight: 600; color: #625750">Próxima: Véspera de Natal, 24 dez</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#625750" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
    </a>
  </main>

  <footer style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E5DDD2; padding: 12px 16px 20px">
    <button type="button" class="tap" style="width: 100%; height: 54px; border-radius: 27px; border: 0; background: #4E3426; color: #FAF6F0; font-size: 16px; font-weight: 800">Salvar</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      menu: 'manha',
      days: { m1: [0, 1, 2, 3, 4, 5], m2: [6], t1: [0, 1, 2, 3, 4, 5, 6] },
      forced: { manha: false, tarde: false },
      until: 'eu'
    };
  }
  renderVals() {
    const s = this.state;
    const DAYS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
    const DAYS_LONG = ['segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado', 'domingo'];
    const MENUS = [
      { id: 'manha', name: 'Cardápio da manhã', items: '14 itens' },
      { id: 'tarde', name: 'Cardápio da tarde', items: '22 itens' }
    ];
    const WIN = [
      { id: 'm1', menu: 'manha', start: '06:00', end: '11:00' },
      { id: 'm2', menu: 'manha', start: '07:00', end: '11:00' },
      { id: 't1', menu: 'tarde', start: '11:00', end: '20:00' }
    ];
    // Demo clock: Qua (2), 10:42
    const NOW = { day: 2, min: 642 };
    const toMin = (t) => Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));
    const dayText = (list) => {
      if (list.length === 7) return 'Todos os dias';
      const run = list.length > 2 && list.every((d, i) => i === 0 || d === list[i - 1] + 1);
      if (run) return DAYS[list[0]] + ' a ' + DAYS[list[list.length - 1]].toLowerCase();
      return list.map((d) => DAYS[d]).join(', ');
    };
    let conflict = null;
    WIN.forEach((a, i) => WIN.forEach((b, j) => {
      if (conflict || j <= i) return;
      const shared = s.days[a.id].filter((d) => s.days[b.id].includes(d));
      if (shared.length && toMin(a.start) < toMin(b.end) && toMin(b.start) < toMin(a.end)) conflict = { a, b, day: shared[0] };
    }));
    const isLive = (id) => WIN.some((w) => w.menu === id && s.days[w.id].includes(NOW.day) && toMin(w.start) <= NOW.min && NOW.min < toMin(w.end));

    const menus = MENUS.map((m) => {
      const on = s.menu === m.id;
      return {
        name: m.name, items: m.items, isLive: isLive(m.id), isForced: s.forced[m.id], checked: on ? 'true' : 'false',
        when: WIN.filter((w) => w.menu === m.id).map((w) => dayText(s.days[w.id]) + ', ' + w.start + ' – ' + w.end).join(' · '),
        pick: () => this.setState({ menu: m.id }),
        style: 'width: 100%; padding: 12px 14px; border-radius: 12px; display: flex; flex-direction: column; gap: 4px; text-align: left; border: 1px solid #E5DDD2; background: #FFFFFF; ' + (on ? 'box-shadow: inset 0 0 0 1px #4E3426; background: #FBF8F3;' : '')
      };
    });

    const dayStyle = (on) => 'width: 40px; height: 44px; border-radius: 12px; font-size: 14px; font-weight: 800; ' + (on ? 'border: 0; background: #4E3426; color: #FAF6F0;' : 'border: 1px solid #E5DDD2; background: #FFFFFF; color: #625750;');
    const editMenu = s.menu;
    const windows = WIN.filter((w) => w.menu === editMenu).map((w, i) => {
      const cur = s.days[w.id];
      return {
        label: 'Janela ' + (i + 1), start: w.start, end: w.end,
        dayBtns: DAYS.map((name, d) => {
          const on = cur.includes(d);
          return {
            label: name, pressed: on ? 'true' : 'false', aria: DAYS_LONG[d] + (on ? ', ligado' : ', desligado'), style: dayStyle(on),
            toggle: () => this.setState({ days: { ...s.days, [w.id]: on ? cur.filter((x) => x !== d) : cur.concat(d).sort((x, y) => x - y) } })
          };
        })
      };
    });

    const seg = (on) => 'flex: 1 1 0; height: 40px; border-radius: 10px; border: 0; font-size: 13px; font-weight: 800; ' + (on ? 'background: #FFFFFF; box-shadow: 0 1px 3px rgba(28,28,26,.14);' : 'background: transparent; color: #625750;');
    const forced = s.forced[editMenu];
    const untils = [{ id: 'eu', label: 'Até eu voltar' }, { id: 'dia', label: 'Até o fim do dia' }].map((u) => ({ label: u.label, checked: s.until === u.id ? 'true' : 'false', pick: () => this.setState({ until: u.id }), style: seg(s.until === u.id) }));
    const sw = (on) => 'width: 48px; height: 28px; flex-shrink: 0; border-radius: 14px; padding: 3px; box-sizing: border-box; display: flex; background: ' + (on ? '#4E3426' : '#D6CCC0') + '; justify-content: ' + (on ? 'flex-end' : 'flex-start') + ';';

    return {
      menus, windows,
      editName: MENUS.find((m) => m.id === editMenu).name,
      hasConflict: !!conflict, noConflict: !conflict,
      conflictText: conflict ? 'Em ' + DAYS_LONG[conflict.day] + ', ' + conflict.a.start + '–' + conflict.a.end + ' e ' + conflict.b.start + '–' + conflict.b.end + ' se sobrepõem. Ajuste os horários ou os dias.' : '',
      forced, forcedChecked: forced ? 'true' : 'false',
      forceHint: forced ? 'No ar fora dos dias e horários.' : 'Segue os dias e horários.',
      toggleForce: () => this.setState({ forced: { ...s.forced, [editMenu]: !forced } }),
      trackStyle: sw(forced),
      untils,
      untilText: s.until === 'eu' ? 'Fica no ar até você desligar. Depois, volta aos horários.' : 'Fica no ar até o fim de hoje. Amanhã volta aos horários.'
    };
  }
}
</script>
</body>
</html>
