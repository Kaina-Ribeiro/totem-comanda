<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Celular · Selos e sugestões</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.tap{transition:transform .12s ease,background-color .15s ease}
.tap:active{transform:scale(.97)}
main{scrollbar-width:none}main::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3EFE8; color: #2B211C; font-family: Manrope, system-ui, sans-serif; font-feature-settings: 'tnum' 1; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E5DDD2; height: 60px; padding: 0 8px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
    <a href="M0-Mais.dc.html" aria-label="Voltar para Mais" class="tap" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <h1 style="margin: 0; flex-grow: 1; font-weight: 800; font-size: 18px; letter-spacing: -0.01em">Selos e sugestões</h1>
  </header>

  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div role="radiogroup" aria-label="Parte" style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #E6DED2">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button type="button" role="radio" aria-checked="{{t.checked}}" onClick="{{t.pick}}" class="tap" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{isSelos}}" hint-placeholder-val="{{true}}">
      <section aria-label="Card no totem" style="border-radius: 12px; background: #2A1C16; color: #FAF6F0; padding: 12px; display: flex; gap: 12px; align-items: center">
        <img src="{{selSrc}}" alt="" style="width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #E9E2D7">
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 10px; font-weight: 800; color: #D8B98A">Card no totem</span>
          <span style="font-size: 15px; font-weight: 800">{{selName}} · {{selPrice}}</span>
          <span style="display: flex; flex-wrap: wrap; gap: 4px">
            <sc-for list="{{selBadges}}" as="sb" hint-placeholder-count="2"><span style="{{sb.style}}">{{sb.label}}</span></sc-for>
          </span>
        </span>
      </section>

      <sc-for list="{{items}}" as="it" hint-placeholder-count="8">
        <section aria-label="{{it.name}}" style="border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 12px; display: flex; flex-direction: column; gap: 10px">
          <button type="button" aria-pressed="{{it.selPressed}}" onClick="{{it.pick}}" style="min-height: 36px; padding: 0; border: 0; background: transparent; display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left">
            <span style="font-size: 14px; font-weight: 800">{{it.name}}</span>
            <span style="font-size: 13px; font-weight: 700; color: #625750">{{it.price}}</span>
          </button>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{it.cells}}" as="c" hint-placeholder-count="4">
              <button type="button" aria-pressed="{{c.pressed}}" aria-label="{{c.aria}}" onClick="{{c.toggle}}" class="tap" style="{{c.style}}">{{c.label}}</button>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </sc-if>

    <sc-if value="{{isSug}}" hint-placeholder-val="{{false}}">
      <section aria-label="Combina com" style="border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <h2 style="margin: 0 0 4px; font-size: 15px; font-weight: 800">Combina com</h2>
        <p style="margin: 0 0 6px; font-size: 12px; font-weight: 600; color: #625750">Aparecem antes do pagamento.</p>
        <sc-for list="{{combos}}" as="cb" hint-placeholder-count="3">
          <button type="button" role="switch" aria-checked="{{cb.checked}}" onClick="{{cb.toggle}}" style="min-height: 56px; padding: 0; border: 0; border-top: 1px solid #E5DDD2; background: transparent; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left">
            <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 800">{{cb.title}}</span><span style="font-size: 12px; font-weight: 600; color: #625750">{{cb.hint}}</span></span>
            <span style="{{cb.track}}"><span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></span></span>
          </button>
        </sc-for>
      </section>

      <section aria-label="Troca com mais valor" style="border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <h2 style="margin: 0 0 4px; font-size: 15px; font-weight: 800">Troca com mais valor</h2>
        <button type="button" role="switch" aria-checked="{{swap.checked}}" onClick="{{swap.toggle}}" style="min-height: 56px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 800">Troque o Cappuccino por um Latte por + R$ 1,00</span><span style="font-size: 12px; font-weight: 600; color: #625750">Só aparece se o Latte estiver disponível.</span></span>
          <span style="{{swap.track}}"><span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></span></span>
        </button>
      </section>
    </sc-if>
  </main>

  <footer style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E5DDD2; padding: 12px 16px 20px">
    <p style="margin: 0 0 8px; font-size: 12px; font-weight: 700; color: #625750; text-align: center">{{onText}}</p>
    <button type="button" class="tap" style="width: 100%; height: 54px; border-radius: 27px; border: 0; background: #4E3426; color: #FAF6F0; font-size: 16px; font-weight: 800">Salvar</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tab: 'selos',
      sel: 'croque',
      on: {
        'croque.mais': true, 'cappuccino.mais': true, 'croissant.mais': true,
        'fermentacao.casa': true, 'fermentacao.vegano': true, 'baguete.vegano': true,
        'cookie.novo': true, 'donut.novo': true
      },
      sug: { combo1: true, combo2: true, combo3: true, troca: true }
    };
  }
  renderVals() {
    const s = this.state;
    const BADGES = [
      { id: 'mais', label: 'Mais pedido', bg: '#4E3426', fg: '#FAF6F0' },
      { id: 'novo', label: 'Novo', bg: '#EAD9C6', fg: '#2B211C' },
      { id: 'casa', label: 'Da casa', bg: '#EFE4C9', fg: '#8A5A2B' },
      { id: 'vegano', label: 'Vegano', bg: '#DCDFD2', fg: '#4F6B45' }
    ];
    const ITEMS = [
      { id: 'croque', name: 'Croque monsieur', price: 'R$ 34,90', img: 'a479abedd3198e4acec76278caec4352' },
      { id: 'cappuccino', name: 'Cappuccino', price: 'R$ 13,90', img: 'fad654d6989d25fca51c9d92d94e87fe' },
      { id: 'fermentacao', name: 'Fermentação natural', price: 'R$ 28,00', img: '98cbb1f4f6b7f3edec9da5925073bf50' },
      { id: 'baguete', name: 'Baguete tradicional', price: 'R$ 12,00', img: '52aefe2f38711a9dba6c6d98a667e764' },
      { id: 'croissant', name: 'Croissant', price: 'R$ 14,00', img: '0471b8153aad0569ffc277ed8052709f' },
      { id: 'cookie', name: 'Cookie de chocolate', price: 'R$ 9,90', img: '7d2f91e3af9882691725f05f3343cffd' },
      { id: 'donut', name: 'Donut de morango', price: 'R$ 11,90', img: 'efa0d879f959d1026df53e039ac2c7cf' }
    ];
    const cellStyle = (on, b) => 'min-height: 44px; border-radius: 12px; font-size: 13px; font-weight: 800; line-height: 1.15; color: ' + (on ? b.fg : '#625750') + '; border: ' + (on ? '0' : '1.5px solid #E5DDD2') + '; background: ' + (on ? b.bg : '#FFFFFF') + ';';
    const items = ITEMS.map((it) => {
      const sel = s.sel === it.id;
      return {
        name: it.name, price: it.price, selPressed: sel ? 'true' : 'false', pick: () => this.setState({ sel: it.id }),
        cells: BADGES.map((b) => {
          const key = it.id + '.' + b.id;
          const on = !!s.on[key];
          return {
            label: b.label, pressed: on ? 'true' : 'false', aria: it.name + ', ' + b.label + (on ? ', ligado' : ', desligado'),
            style: cellStyle(on, b),
            toggle: () => this.setState({ on: { ...s.on, [key]: !on } })
          };
        })
      };
    });

    const cur = ITEMS.find((x) => x.id === s.sel);
    const selBadges = BADGES.filter((b) => s.on[cur.id + '.' + b.id]).map((b) => ({
      label: b.label,
      style: 'height: 22px; padding: 0 8px; border-radius: 11px; display: inline-flex; align-items: center; font-size: 11px; font-weight: 800; white-space: nowrap; background: ' + b.bg + '; color: ' + b.fg + ';'
    }));

    const tab = s.tab;
    const tabs = [{ id: 'selos', label: 'Selos' }, { id: 'sugestoes', label: 'Sugestões' }].map((t) => ({
      label: t.label, checked: t.id === tab ? 'true' : 'false', pick: () => this.setState({ tab: t.id }),
      style: 'flex: 1 1 0; height: 40px; border-radius: 10px; border: 0; font-size: 14px; font-weight: 800; ' + (t.id === tab ? 'background: #FFFFFF; box-shadow: 0 1px 3px rgba(28,28,26,.14);' : 'background: transparent; color: #625750;')
    }));

    const sw = (on) => 'width: 48px; height: 28px; flex-shrink: 0; border-radius: 14px; padding: 3px; box-sizing: border-box; display: flex; background: ' + (on ? '#4E3426' : '#D6CCC0') + '; justify-content: ' + (on ? 'flex-end' : 'flex-start') + ';';
    const COMBOS = [
      { id: 'combo1', title: 'Croque monsieur + Suco de laranja', hint: 'Suco de laranja, R$ 12,90' },
      { id: 'combo2', title: 'Cappuccino + Croissant', hint: 'Croissant, R$ 14,00' },
      { id: 'combo3', title: 'Fermentação natural + Brioche', hint: 'Brioche, R$ 22,00' }
    ];
    const combos = COMBOS.map((c) => {
      const on = !!s.sug[c.id];
      return { title: c.title, hint: c.hint, checked: on ? 'true' : 'false', track: sw(on), toggle: () => this.setState({ sug: { ...s.sug, [c.id]: !on } }) };
    });
    const swapOn = !!s.sug.troca;
    const swap = { checked: swapOn ? 'true' : 'false', track: sw(swapOn), toggle: () => this.setState({ sug: { ...s.sug, troca: !swapOn } }) };
    const count = Object.values(s.sug).filter(Boolean).length;

    return {
      tabs, items, combos, swap,
      isSelos: tab === 'selos', isSug: tab === 'sugestoes',
      selName: cur.name, selPrice: cur.price, selSrc: '/_blob/' + cur.img, selBadges,
      onText: 'Ligadas: ' + count + ' de 4'
    };
  }
}
</script>
</body>
</html>
