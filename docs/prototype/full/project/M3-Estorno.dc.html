<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Celular · Estornar pedido</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.tap{transition:transform .12s ease,background-color .15s ease}
.tap:active{transform:scale(.97)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #F3EFE8; color: #2B211C; font-family: Manrope, system-ui, sans-serif; font-feature-settings: 'tnum' 1; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column">
    <div style="background: #FFFFFF; border-bottom: 1px solid #E5DDD2; height: 60px; padding: 0 16px 0 60px; display: flex; align-items: center; font-size: 18px; font-weight: 800">Pedido 38</div>
    <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="height: 210px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2"></div>
      <div style="height: 130px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2"></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(43,33,28,.48)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="t" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 24px 24px 0 0; background: #FFFFFF; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 14px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #E5DDD2"></span>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 id="t" style="margin: 0; font-weight: 800; font-size: 20px; letter-spacing: -0.01em">Estornar pedido 38</h1>
      <p style="margin: 0; font-size: 13px; font-weight: 600; color: #625750">Pago R$ 78,66 no crédito · já estornado R$ 0,00</p>
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0 0 8px; font-size: 14px; font-weight: 800">Quanto?</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
          <button type="button" role="radio" aria-checked="{{k.checked}}" onClick="{{k.pick}}" class="tap" style="{{k.style}}"><span style="font-size: 15px; font-weight: 800">{{k.label}}</span><span style="font-size: 12px; font-weight: 700; color: #625750">{{k.hint}}</span></button>
        </sc-for>
      </div>
    </fieldset>

    <sc-if value="{{part}}" hint-placeholder-val="{{false}}">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; font-weight: 800">Valor do estorno</span>
        <span style="height: 52px; border-radius: 12px; border: 1.5px solid #E5DDD2; padding: 0 14px; display: flex; align-items: center; gap: 8px"><span style="font-weight: 800; color: #625750">R$</span><input inputmode="decimal" value="13,90" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 17px; font-weight: 800"></span>
        <span style="font-size: 12px; font-weight: 600; color: #625750">Máximo R$ 78,66 (pago menos o que já foi estornado).</span>
      </label>
    </sc-if>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
      <legend style="padding: 0 0 8px; font-size: 14px; font-weight: 800">Motivo</legend>
      <sc-for list="{{reasons}}" as="r" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{r.checked}}" onClick="{{r.pick}}" class="tap" style="{{r.style}}"><span style="{{r.ringStyle}}"><span style="{{r.dotStyle}}"></span></span>{{r.label}}</button>
      </sc-for>
    </fieldset>

    <p style="margin: 0; padding: 10px 12px; border-radius: 12px; background: #EFE4C9; font-size: 13px; font-weight: 700; line-height: 1.4">{{confirmText}}</p>

    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 8px">
      <a href="M2-Pedido.dc.html" class="tap" style="height: 56px; border-radius: 28px; border: 1.5px solid #E5DDD2; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">Voltar</a>
      <a href="M2-Pedido.dc.html" class="tap" style="height: 56px; border-radius: 28px; background: #A3472F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">{{confirmLabel}}</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 'full', reason: 'soldout' };
  }
  renderVals() {
    const s = this.state;
    const kinds = [['full', 'Tudo', 'R$ 78,66'], ['part', 'Parte do valor', 'Até R$ 78,66']].map(([id, label, hint]) => {
      const on = id === s.kind;
      return { label, hint, checked: on ? 'true' : 'false', pick: () => this.setState({ kind: id }), style: 'min-height: 64px; border-radius: 14px; padding: 0 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; text-align: left; ' + (on ? 'border: 2px solid #4E3426; background: #FBF8F3;' : 'border: 1.5px solid #E5DDD2; background: #FFFFFF;') };
    });
    const reasons = [['soldout', 'Item esgotado'], ['cancel', 'Cancelamento do cliente'], ['complaint', 'Reclamação do cliente']].map(([id, label]) => {
      const on = id === s.reason;
      return {
        label, checked: on ? 'true' : 'false', pick: () => this.setState({ reason: id }),
        style: 'min-height: 48px; padding: 0 12px; border-radius: 14px; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 700; text-align: left; ' + (on ? 'border: 2px solid #4E3426; background: #FBF8F3;' : 'border: 1.5px solid #E5DDD2; background: #FFFFFF;'),
        ringStyle: 'width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 11px; border: 2px solid ' + (on ? '#4E3426' : '#B5ADA3') + '; display: flex; align-items: center; justify-content: center;',
        dotStyle: 'width: 10px; height: 10px; border-radius: 5px; background: ' + (on ? '#4E3426' : 'transparent') + ';'
      };
    });
    const part = s.kind === 'part';
    const value = part ? 'R$ 13,90' : 'R$ 78,66';
    return {
      kinds, reasons, part,
      confirmText: value + ' voltam para o cartão de crédito do cliente. Quando aparece depende do banco dele.',
      confirmLabel: 'Estornar ' + value
    };
  }
}
</script>
</body>
</html>
