<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Celular · Item</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.tap{transition:transform .12s ease,background-color .15s ease}
.tap:active{transform:scale(.97)}
main{scrollbar-width:none}main::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3EFE8; color: #2B211C; font-family: Manrope, system-ui, sans-serif; font-feature-settings: 'tnum' 1; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E5DDD2; height: 60px; padding: 0 8px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
    <a href="M6-Itens.dc.html" aria-label="Voltar para Itens" class="tap" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <h1 style="margin: 0; flex-grow: 1; font-weight: 800; font-size: 18px; letter-spacing: -0.01em">Croque monsieur</h1>
  </header>

  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <section aria-label="Foto e dados" style="border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; gap: 12px; align-items: center">
        <img src="/_blob/a479abedd3198e4acec76278caec4352" alt="Foto do Croque monsieur" style="width: 76px; height: 76px; border-radius: 12px; object-fit: cover; flex-shrink: 0">
        <span style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start">
          <button type="button" class="tap" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid #E5DDD2; background: #FFFFFF; font-size: 14px; font-weight: 800">Trocar foto</button>
          <span style="font-size: 12px; font-weight: 600; color: #625750">JPG, PNG ou WebP</span>
        </span>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 800">Nome</span><input value="Croque monsieur" style="height: 48px; border-radius: 12px; border: 1.5px solid #E5DDD2; padding: 0 12px; font-size: 16px; font-weight: 700; background: #FFFFFF"></label>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 800">Preço</span><span style="height: 48px; border-radius: 12px; border: 1.5px solid #E5DDD2; padding: 0 12px; display: flex; align-items: center; gap: 6px"><span style="font-weight: 800; color: #625750">R$</span><input inputmode="decimal" value="34,90" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; font-weight: 700"></span></label>
        <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 800">Categoria</span><span style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1.5px solid #E5DDD2; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 700">Sanduíches<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#625750" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></label>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 800">Descrição</span><textarea rows="2" style="border-radius: 12px; border: 1.5px solid #E5DDD2; padding: 10px 12px; font-size: 16px; font-weight: 600; line-height: 1.4; resize: none; background: #FFFFFF">Presunto, gruyère e bechamel gratinados no pão.</textarea></label>
      <button type="button" role="switch" aria-checked="{{visibleChecked}}" onClick="{{toggleVisible}}" style="min-height: 52px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left">
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 800">Aparece no totem</span><span style="font-size: 12px; font-weight: 600; color: #625750">{{visibleHint}}</span></span>
        <span style="{{trackStyle}}"><span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></span></span>
      </button>
    </section>

    <section aria-labelledby="al" style="border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <h2 id="al" style="margin: 0; font-size: 16px; font-weight: 800">Alergênicos</h2>
      <div role="radiogroup" aria-label="Alergênicos" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #F3EFE8">
        <sc-for list="{{states}}" as="s" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{s.checked}}" onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
        </sc-for>
      </div>
      <sc-if value="{{contains}}" hint-placeholder-val="{{true}}">
        <span style="font-size: 13px; font-weight: 800">Contém</span>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{has}}" as="a" hint-placeholder-count="6">
            <button type="button" aria-pressed="{{a.pressed}}" onClick="{{a.toggle}}" class="tap" style="{{a.style}}">{{a.label}}</button>
          </sc-for>
        </div>
        <span style="font-size: 13px; font-weight: 700; color: #625750">Pode conter: castanhas e nozes</span>
      </sc-if>
    </section>

    <section aria-labelledby="op" style="border-radius: 12px; background: #FFFFFF; border: 1px solid #E5DDD2; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <h2 id="op" style="margin: 0; font-size: 16px; font-weight: 800">Opções</h2>
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px; font-weight: 800">Pão</span><span style="font-size: 12px; font-weight: 700; color: #625750">Obrigatório · escolha 1</span></div>
      <sc-for list="{{breads}}" as="b" hint-placeholder-count="3">
        <div style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; border-top: 1px solid #E5DDD2"><span style="font-size: 14px; font-weight: 700">{{b.name}}</span><span style="{{b.chipStyle}}">{{b.state}}</span></div>
      </sc-for>
      <p style="margin: 0; padding: 10px 12px; border-radius: 12px; background: #F4E1DB; color: #8C3A24; font-size: 13px; font-weight: 800">Só 1 de 3 pães disponível hoje.</p>
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 6px"><span style="font-size: 14px; font-weight: 800">Adicionais</span><span style="font-size: 12px; font-weight: 700; color: #625750">Até 3</span></div>
      <sc-for list="{{addons}}" as="a" hint-placeholder-count="4">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 48px; border-top: 1px solid #E5DDD2">
          <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 700">{{a.name}}</span><span style="font-size: 12px; font-weight: 700; color: #625750">{{a.price}}</span></span>
          <button type="button" aria-pressed="{{a.exPressed}}" onClick="{{a.pickEx}}" style="{{a.exStyle}}">{{a.exLabel}}</button>
        </div>
      </sc-for>
      <p style="margin: 0; font-size: 12px; font-weight: 600; color: #625750; line-height: 1.4">{{exHint}}</p>
    </section>
  </main>

  <footer style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E5DDD2; padding: 12px 16px 20px">
    <button type="button" class="tap" style="width: 100%; height: 54px; border-radius: 27px; border: 0; background: #4E3426; color: #FAF6F0; font-size: 16px; font-weight: 800">Salvar</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { visible: true, status: 'contains', has: ['gluten', 'leite', 'ovos'], exclusive: 'sem' };
  }
  renderVals() {
    const s = this.state;
    const seg = (on) => 'min-height: 42px; border-radius: 10px; border: 0; font-size: 13px; font-weight: 800; line-height: 1.15; ' + (on ? 'background: #FFFFFF; box-shadow: 0 1px 3px rgba(28,28,26,.14);' : 'background: transparent; color: #625750;');
    const states = [['unknown', 'Não informado'], ['none', 'Não tem'], ['contains', 'Contém']].map(([id, label]) => ({ label, checked: id === s.status ? 'true' : 'false', pick: () => this.setState({ status: id }), style: seg(id === s.status) }));
    const ALL = [['gluten', 'Glúten'], ['leite', 'Leite'], ['ovos', 'Ovos'], ['soja', 'Soja'], ['amendoim', 'Amendoim'], ['castanhas', 'Castanhas e nozes'], ['peixes', 'Peixes'], ['crustaceos', 'Crustáceos']];
    const has = ALL.map(([id, label]) => {
      const on = s.has.includes(id);
      return { label, pressed: on ? 'true' : 'false', toggle: () => this.setState({ has: on ? s.has.filter((x) => x !== id) : s.has.concat(id) }), style: 'min-height: 40px; padding: 0 12px; border-radius: 12px; font-size: 14px; font-weight: 800; ' + (on ? 'border: 0; background: #4E3426; color: #FAF6F0;' : 'border: 1.5px solid #E5DDD2; background: #FFFFFF; color: #2B211C;') };
    });
    const chip = (bg, fg) => 'height: 24px; padding: 0 9px; border-radius: 12px; display: inline-flex; align-items: center; font-size: 11px; font-weight: 800; white-space: nowrap; background: ' + bg + '; color: ' + (fg || '#2B211C') + ';';
    const breads = [
      { name: 'Brioche', state: 'Disponível', chipStyle: chip('#DCDFD2') },
      { name: 'Fermentação', state: 'Esgotado hoje', chipStyle: chip('#F4E1DB', '#8C3A24') },
      { name: 'Ciabatta', state: 'Esgotado hoje', chipStyle: chip('#F4E1DB', '#8C3A24') }
    ];
    const A = [['sem', 'Sem adicionais', 'R$ 0,00'], ['ovo', 'Ovo pochê', '+ R$ 6,00'], ['parma', 'Presunto de parma', '+ R$ 9,00'], ['gruyere', 'Gruyère extra', '+ R$ 7,00']];
    const addons = A.map(([id, name, price]) => {
      const on = s.exclusive === id;
      return {
        name, price, exPressed: on ? 'true' : 'false', exLabel: on ? 'Exclusiva' : 'Tornar exclusiva',
        pickEx: () => this.setState({ exclusive: on ? '' : id }),
        exStyle: 'height: 36px; flex-shrink: 0; padding: 0 12px; border-radius: 18px; font-size: 12px; font-weight: 800; ' + (on ? 'border: 0; background: #EAD9C6; color: #2B211C;' : 'border: 1px dashed #B5ADA3; background: transparent; color: #625750;')
      };
    });
    const exName = (A.find((a) => a[0] === s.exclusive) || [null, ''])[1];
    return {
      states, has, breads, addons,
      contains: s.status === 'contains',
      exHint: exName ? '“' + exName + '” é exclusiva: marcar ela desmarca as outras.' : 'Nenhuma opção exclusiva neste grupo.',
      visibleChecked: s.visible ? 'true' : 'false',
      visibleHint: s.visible ? 'Aparece no Cardápio da tarde.' : 'Escondido de todos os cardápios.',
      toggleVisible: () => this.setState({ visible: !s.visible }),
      trackStyle: 'width: 48px; height: 28px; flex-shrink: 0; border-radius: 14px; padding: 3px; box-sizing: border-box; display: flex; background: ' + (s.visible ? '#4E3426' : '#D6CCC0') + '; justify-content: ' + (s.visible ? 'flex-end' : 'flex-start') + ';'
    };
  }
}
</script>
</body>
</html>
