<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Forma de pagamento</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 720px; height: 1280px; box-sizing: border-box; background: {{ground}}; color: {{ink}}; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; padding: 28px 32px 0">
    <a href="Cart.dc.html" style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 22px 0 14px; border-radius: 28px; background: {{surface}}; font-size: 19px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Meu pedido
    </a>
  </header>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 36px; padding: 48px 44px 0">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 60px; line-height: 1.02; letter-spacing: -0.02em">Como você<br>quer pagar?</h1>
      <div style="display: flex; align-items: baseline; gap: 10px; font-size: 22px; color: {{muted}}">Total de <span style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 34px; color: {{ink}}">R$ 82,80</span></div>
    </div>

    <div style="display: flex; flex-direction: column; border-radius: 28px; background: {{surface}}; padding: 4px 32px">
      <a href="Authorizing.dc.html" style="display: flex; align-items: center; gap: 24px; height: 148px">
        <div style="width: 84px; height: 84px; flex-shrink: 0; border-radius: 42px; background: {{accent}}; color: {{accentTitle}}; display: flex; align-items: center; justify-content: center">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"></path></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 38px">Pix</span>
            <span style="padding: 5px 10px; border-radius: 10px; background: {{detailSoft}}; color: {{detailText}}; font-size: 14px; font-weight: 700">Mais rápido</span>
          </div>
          <div style="font-size: 19px; color: {{muted}}">QR Code ou aproximação na maquininha</div>
        </div>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8A8F88" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
      <a href="Authorizing.dc.html" style="display: flex; align-items: center; gap: 24px; height: 148px; border-top: 1px solid {{line}}">
        <div style="width: 84px; height: 84px; flex-shrink: 0; border-radius: 42px; background: {{chip2}}; color: {{ink}}; display: flex; align-items: center; justify-content: center">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2.5"></rect><path d="M2 10h20M6 15h4"></path></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
          <span style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 38px">Crédito</span>
          <div style="font-size: 19px; color: {{muted}}">Insira ou aproxime o cartão</div>
        </div>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8A8F88" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
      <a href="Authorizing.dc.html" style="display: flex; align-items: center; gap: 24px; height: 148px; border-top: 1px solid {{line}}">
        <div style="width: 84px; height: 84px; flex-shrink: 0; border-radius: 42px; background: {{chip3}}; color: {{ink}}; display: flex; align-items: center; justify-content: center">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2.5"></rect><path d="M2 10h20"></path><circle cx="16.5" cy="15" r="1.5"></circle></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
          <span style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 38px">Débito</span>
          <div style="font-size: 19px; color: {{muted}}">Insira ou aproxime o cartão</div>
        </div>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8A8F88" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
    </div>
  </div>

  <div style="padding: 0 44px 56px; font-size: 19px; line-height: 1.4; color: {{muted}}">Quer pagar em dinheiro? Faça seu pedido direto no caixa.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["padaria","tomate","verde","acafrao"],"default":"padaria"},"$preview":{"width":720,"height":1280}}'>
class Component extends DCLogic {
  renderVals() {
    const THEMES = {
      padaria: { ground:'#F3EFE8', surface:'#FFFFFF', ink:'#2B211C', muted:'#625750', line:'#E5DDD2', accent:'#4E3426', accentTitle:'#FAF6F0', detailText:'#8A5A2B', detailSoft:'#EFE4C9', chip2:'#EFE4C9', chip3:'#DCDFD2' },
      verde: { ground:'#EEECE6', surface:'#FFFFFF', ink:'#141A17', muted:'#5B615C', line:'#E3E1DA', accent:'#1F3D31', accentTitle:'#F4F2EC', detailText:'#7F5E14', detailSoft:'#F3E9D2', chip2:'#EEECE6', chip3:'#EEECE6' },
      tomate: { ground:'#F3F2ED', surface:'#FFFFFF', ink:'#1B1816', muted:'#5F5B57', line:'#E6E4DE', accent:'#C8341F', accentTitle:'#FFF6F1', detailText:'#A32A18', detailSoft:'#FBE3DD', chip2:'#F3F2ED', chip3:'#F3F2ED' },
      acafrao: { ground:'#EFEEE9', surface:'#FFFFFF', ink:'#17181C', muted:'#5E5D59', line:'#E4E2DC', accent:'#17181C', accentTitle:'#F2B134', detailText:'#8A5E00', detailSoft:'#FBEBC8', chip2:'#EFEEE9', chip3:'#EFEEE9' }
    };
    return THEMES[this.props.theme ?? 'padaria'] || THEMES.padaria;
  }
}
</script>
</body>
</html>
