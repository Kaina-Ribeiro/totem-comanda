<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mesa 12 · Croque monsieur</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
main{scrollbar-width:none}main::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #2B211C; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="position: relative; height: 228px; flex-shrink: 0; background: #DCDFD2; overflow: hidden">
    <img src="/_blob/a479abedd3198e4acec76278caec4352" alt="Croque monsieur" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
    <a href="Q2-Cardapio.dc.html" aria-label="Voltar ao cardápio" style="position: absolute; top: 16px; left: 16px; height: 44px; padding: 0 16px 0 10px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Cardápio
    </a>
  </div>

  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 22px 20px 16px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
        <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1.1; letter-spacing: -0.02em">Croque monsieur</h1>
        <div style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 22px; color: #6B4430; flex-shrink: 0">R$ 34,90</div>
      </div>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #625750">Pão tostado, presunto, gruyère e molho bechamel gratinado.</p>
      <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #F3EFE8">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A5A2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg>
        <span style="font-size: 14px; line-height: 1.45"><strong style="font-weight: 800">Contém glúten, leite, ovos</strong> <span style="color: #625750; font-weight: 600">· pode conter castanhas</span></span>
      </div>
    </div>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
        <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 22px">Pão</h2>
        <div style="font-size: 13px; font-weight: 700; color: #8A5A2B">Obrigatório · escolha um</div>
      </div>
      <div role="radiogroup" aria-label="Pão" style="display: flex; flex-direction: column; gap: 8px">
        <button type="button" role="radio" aria-checked="true" style="height: 56px; padding: 0 16px; border-radius: 16px; border: 2px solid #4E3426; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; text-align: left">
          <span style="display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 700"><span style="width: 22px; height: 22px; border-radius: 11px; background: #4E3426; box-shadow: inset 0 0 0 5px #FFFFFF; flex-shrink: 0"></span>Brioche</span>
          <span style="font-size: 13px; font-weight: 700; color: #4F6B45">Escolhido</span>
        </button>
        <button type="button" role="radio" aria-checked="false" disabled style="height: 56px; padding: 0 16px; border-radius: 16px; border: 1px solid #E5DDD2; background: #F3EFE8; display: flex; align-items: center; justify-content: space-between; text-align: left; color: #625750">
          <span style="display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 600"><span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #B5B3AB; flex-shrink: 0"></span>Fermentação</span>
          <span style="font-size: 13px; font-weight: 700; color: #8C3A24">Esgotado hoje</span>
        </button>
        <button type="button" role="radio" aria-checked="false" disabled style="height: 56px; padding: 0 16px; border-radius: 16px; border: 1px solid #E5DDD2; background: #F3EFE8; display: flex; align-items: center; justify-content: space-between; text-align: left; color: #625750">
          <span style="display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 600"><span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #B5B3AB; flex-shrink: 0"></span>Ciabatta</span>
          <span style="font-size: 13px; font-weight: 700; color: #8C3A24">Esgotado hoje</span>
        </button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
        <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 22px">Quer tirar algo?</h2>
        <div style="font-size: 13px; font-weight: 700; color: #625750">Grátis</div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="{{noBechPressed}}" onClick="{{toggleBech}}" style="{{noBechStyle}}">{{noBechLabel}}</button>
        <button type="button" aria-pressed="{{noPresPressed}}" onClick="{{togglePres}}" style="{{noPresStyle}}">{{noPresLabel}}</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px">
        <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 22px">Adicionais</h2>
        <div style="font-size: 14px; font-weight: 700; color: #625750">{{counter}}</div>
      </div>
      <sc-for list="{{addons}}" as="ad" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{ad.pressed}}" onClick="{{ad.toggle}}" style="{{ad.style}}">
          <span style="display: flex; align-items: center; gap: 14px">
            <span style="{{ad.boxStyle}}">
              <sc-if value="{{ad.on}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></sc-if>
            </span>
            <span style="font-size: 17px; font-weight: 600">{{ad.label}}</span>
          </span>
          <span style="font-size: 15px; font-weight: 700; color: #625750; white-space: nowrap">{{ad.price}}</span>
        </button>
      </sc-for>
    </section>
  </main>

  <footer style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 14px 20px 26px; background: #FFFFFF; border-top: 1px solid #E5DDD2">
    <div style="display: flex; align-items: center; gap: 2px; height: 56px; padding: 0 4px; border-radius: 28px; background: #F3EFE8; flex-shrink: 0">
      <button type="button" aria-label="Diminuir quantidade" onClick="{{minusQty}}" style="{{minusStyle}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
      </button>
      <div aria-live="polite" style="min-width: 28px; text-align: center; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 24px">{{qty}}</div>
      <button type="button" aria-label="Aumentar quantidade" onClick="{{plusQty}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <a href="Q5-Carrinho.dc.html" style="flex-grow: 1; height: 60px; border-radius: 30px; background: #4E3426; color: #FAF6F0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; white-space: nowrap">Adicionar · {{total}}</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { removed: [], picked: ['ovo'], qty: 1 };
  }
  renderVals() {
    const brl = (c) => 'R$ ' + (c / 100).toFixed(2).replace('.', ',');
    const BASE = 3490;
    const MAX = 3;
    const removed = this.state.removed;
    const picked = this.state.picked;
    const qty = this.state.qty;
    const ADDONS = [
      { id: 'ovo', label: 'Ovo pochê', price: 600 },
      { id: 'parma', label: 'Presunto de parma', price: 900 },
      { id: 'gruyere', label: 'Gruyère extra', price: 700 }
    ];
    const full = picked.length >= MAX;
    const addons = ADDONS.map((a, i) => {
      const on = picked.includes(a.id);
      const blocked = !on && full;
      return {
        label: a.label,
        price: '+ ' + brl(a.price),
        on,
        pressed: on ? 'true' : 'false',
        toggle: () => {
          if (on) this.setState({ picked: picked.filter((x) => x !== a.id) });
          else if (!full) this.setState({ picked: picked.concat(a.id) });
        },
        style: 'height: 60px; width: 100%; padding: 0; background: transparent; border: 0; display: flex; align-items: center; justify-content: space-between; text-align: left;' +
          (i > 0 ? ' border-top: 1px solid #E5DDD2;' : '') + (blocked ? ' opacity: 0.45;' : ''),
        boxStyle: 'width: 26px; height: 26px; box-sizing: border-box; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; ' +
          (on ? 'background: #B07A3A;' : 'background: #FFFFFF; border: 2px solid #B5B3AB;')
      };
    });
    const addonsTotal = ADDONS.filter((a) => picked.includes(a.id)).reduce((s, a) => s + a.price, 0);
    const unit = BASE + addonsTotal;
    const bech = removed.includes('bech');
    const pres = removed.includes('pres');
    const chip = (on) => 'height: 44px; padding: 0 16px; border-radius: 22px; font-size: 16px; font-weight: 700; border: 0; ' +
      (on ? 'background: #4E3426; color: #FAF6F0;' : 'background: #FFFFFF; color: #2B211C; box-shadow: inset 0 0 0 1px #B5B3AB;');
    return {
      addons,
      counter: picked.length + ' de ' + MAX,
      noBechLabel: 'Sem bechamel',
      noPresLabel: 'Sem presunto',
      noBechPressed: bech ? 'true' : 'false',
      noPresPressed: pres ? 'true' : 'false',
      noBechStyle: chip(bech),
      noPresStyle: chip(pres),
      toggleBech: () => this.setState({ removed: bech ? removed.filter((x) => x !== 'bech') : removed.concat('bech') }),
      togglePres: () => this.setState({ removed: pres ? removed.filter((x) => x !== 'pres') : removed.concat('pres') }),
      qty,
      minusStyle: 'width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; opacity: ' + (qty <= 1 ? '0.4' : '1') + ';',
      minusQty: () => this.setState({ qty: Math.max(1, qty - 1) }),
      plusQty: () => this.setState({ qty: qty + 1 }),
      total: brl(unit * qty)
    };
  }
}
</script>
</body>
</html>
