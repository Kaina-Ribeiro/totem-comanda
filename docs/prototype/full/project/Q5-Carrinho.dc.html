<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mesa 12 · Seu pedido</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
main{scrollbar-width:none}main::-webkit-scrollbar{display:none}
input,textarea{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3EFE8; color: #2B211C; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px 0">
    <a href="Q2-Cardapio.dc.html" aria-label="Voltar ao cardápio" style="height: 44px; padding: 0 16px 0 10px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Cardápio
    </a>
    <div style="font-size: 14px; font-weight: 600; color: #625750">Mesa 12</div>
  </header>

  <div style="flex-shrink: 0; padding: 14px 20px 14px">
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 34px; line-height: 1.1; letter-spacing: -0.02em">Seu pedido</h1>
    <div style="margin-top: 4px; font-size: 15px; color: #625750">Rodada 2 · nova para a mesa 12</div>
  </div>

  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <section aria-label="Itens do pedido" style="display: flex; flex-direction: column; padding: 4px 16px; border-radius: 24px; background: #FFFFFF">
      <div style="display: flex; gap: 14px; padding: 16px 0">
        <div style="width: 76px; height: 76px; flex-shrink: 0; border-radius: 16px; overflow: hidden; background: #DCDFD2">
          <img src="/_blob/a479abedd3198e4acec76278caec4352" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
        </div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; gap: 10px">
            <div style="font-size: 17px; font-weight: 700">Croque monsieur</div>
            <div style="font-size: 17px; font-weight: 700; white-space: nowrap">{{croqueLine}}</div>
          </div>
          <div style="font-size: 14px; color: #625750">Pão: Brioche · Ovo pochê</div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px">
            <a href="Q3-Item.dc.html" style="height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 700; color: #8A5A2B">Editar</a>
            <div style="display: flex; align-items: center; gap: 2px; height: 48px; padding: 0 2px; border-radius: 24px; background: #F3EFE8">
              <button type="button" aria-label="Diminuir Croque monsieur" onClick="{{minusCroque}}" style="{{minusCroqueStyle}}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
              </button>
              <div aria-live="polite" style="min-width: 28px; text-align: center; font-size: 17px; font-weight: 700">{{qCroque}}</div>
              <button type="button" aria-label="Aumentar Croque monsieur" onClick="{{plusCroque}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div style="height: 1px; background: #E5DDD2"></div>

      <div style="display: flex; gap: 14px; padding: 16px 0; align-items: center">
        <div style="width: 76px; height: 76px; flex-shrink: 0; border-radius: 16px; background: #DCDFD2; color: #978B80; display: flex; align-items: center; justify-content: center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="8.5" cy="8.5" r="1.8"></circle><path d="M21 15l-5-5L5 21"></path></svg>
        </div>
        <div style="flex-grow: 1; min-width: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <div style="font-size: 17px; font-weight: 700">Suco de laranja</div>
            <div style="font-size: 17px; font-weight: 700; white-space: nowrap">{{sucoLine}}</div>
          </div>
          <div style="display: flex; align-items: center; gap: 2px; height: 48px; padding: 0 2px; border-radius: 24px; background: #F3EFE8">
            <button type="button" aria-label="Diminuir suco de laranja" onClick="{{minusSuco}}" style="{{minusSucoStyle}}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
            </button>
            <div aria-live="polite" style="min-width: 28px; text-align: center; font-size: 17px; font-weight: 700">{{qSuco}}</div>
            <button type="button" aria-label="Aumentar suco de laranja" onClick="{{plusSuco}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <section aria-label="Sugestão" style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 24px; background: #EFE4C9">
      <div style="font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #8A5A2B">Combina com</div>
      <div style="display: flex; align-items: center; gap: 14px">
        <div style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 14px; overflow: hidden; background: #FFFFFF">
          <img src="/_blob/7d2f91e3af9882691725f05f3343cffd" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
        </div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 17px; font-weight: 700">Cookie de chocolate</div>
          <div style="font-size: 15px; font-weight: 700; color: #6B4430">R$ 9,90</div>
        </div>
        <button type="button" aria-pressed="{{cookiePressed}}" onClick="{{toggleCookie}}" style="{{cookieStyle}}">{{cookieLabel}}</button>
      </div>
    </section>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="obs" style="font-size: 15px; font-weight: 700">Observação para a cozinha <span style="font-weight: 500; color: #625750">(opcional)</span></label>
      <textarea id="obs" rows="3" placeholder="Ex.: pão bem tostado, sem cebola" style="box-sizing: border-box; width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid #D8CEC0; background: #FFFFFF; color: #2B211C; font-size: 16px; line-height: 1.4; resize: none"></textarea>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="nome" style="font-size: 15px; font-weight: 700">Seu nome <span style="font-weight: 500; color: #625750">(opcional)</span></label>
      <input id="nome" type="text" autocomplete="given-name" placeholder="Como podemos chamar você?" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; border-radius: 16px; border: 1px solid #D8CEC0; background: #FFFFFF; color: #2B211C; font-size: 16px">
    </div>
  </main>

  <footer style="flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px 20px 26px; background: #FFFFFF; border-top: 1px solid #E5DDD2">
    <div style="text-align: center; font-size: 14px; color: #625750">Não cobra agora. Entra na conta da mesa.</div>
    <a href="Q6-Acompanhar.dc.html" style="height: 60px; border-radius: 30px; background: #4E3426; color: #FAF6F0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 16px; font-size: 16px; font-weight: 700; line-height: 1.2">{{sendLabel}}</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { qCroque: 1, qSuco: 1, cookie: false };
  }
  renderVals() {
    const brl = (c) => 'R$ ' + (c / 100).toFixed(2).replace('.', ',');
    const PRICE_CROQUE = 4090;
    const PRICE_SUCO = 1290;
    const PRICE_COOKIE = 990;
    const { qCroque, qSuco, cookie } = this.state;
    const total = PRICE_CROQUE * qCroque + PRICE_SUCO * qSuco + (cookie ? PRICE_COOKIE : 0);
    const stepBtn = (q) => 'width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; opacity: ' + (q <= 1 ? '0.4' : '1') + ';';
    return {
      qCroque,
      qSuco,
      croqueLine: brl(PRICE_CROQUE * qCroque),
      sucoLine: brl(PRICE_SUCO * qSuco),
      minusCroqueStyle: stepBtn(qCroque),
      minusSucoStyle: stepBtn(qSuco),
      minusCroque: () => this.setState({ qCroque: Math.max(1, qCroque - 1) }),
      plusCroque: () => this.setState({ qCroque: qCroque + 1 }),
      minusSuco: () => this.setState({ qSuco: Math.max(1, qSuco - 1) }),
      plusSuco: () => this.setState({ qSuco: qSuco + 1 }),
      cookiePressed: cookie ? 'true' : 'false',
      cookieLabel: cookie ? 'Adicionado' : 'Adicionar',
      cookieStyle: 'height: 44px; padding: 0 16px; border-radius: 22px; border: 0; font-size: 15px; font-weight: 700; white-space: nowrap; ' +
        (cookie ? 'background: #4F6B45; color: #FFFFFF;' : 'background: #FFFFFF; color: #2B211C;'),
      toggleCookie: () => this.setState({ cookie: !cookie }),
      sendLabel: 'Enviar pedido para a mesa 12 · ' + brl(total)
    };
  }
}
</script>
</body>
</html>
