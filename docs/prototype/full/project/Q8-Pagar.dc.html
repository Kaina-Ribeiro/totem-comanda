<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mesa 12 · Pagar com Pix</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
main{scrollbar-width:none}main::-webkit-scrollbar{display:none}
input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3EFE8; color: #2B211C; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="flex-shrink: 0; padding: 14px 20px 0">
    <a href="Q7-Conta.dc.html" aria-label="Voltar para a conta" style="height: 44px; padding: 0 16px 0 10px; border-radius: 22px; background: #FFFFFF; display: inline-flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Conta
    </a>
  </header>

  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 18px">
    <section style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 15px; font-weight: 600; color: #625750">Mesa 12 · Total da conta</div>
      <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 34px; line-height: 1.1; letter-spacing: -0.02em">Pagar com Pix</h1>
      <div style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 46px; line-height: 1.1; letter-spacing: -0.02em; color: #6B4430">R$ 105,16</div>
    </section>

    <section aria-label="QR Code Pix" style="align-self: center; width: 240px; height: 240px; box-sizing: border-box; border-radius: 24px; border: 2px dashed #B5B3AB; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8A8985" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 17h3v4"></path></svg>
      <div style="font-size: 17px; font-weight: 800; color: #2B211C">QR Code Pix</div>
      <div style="font-size: 14px; line-height: 1.4; color: #625750">[QR CODE PIX DO PAGAMENTO]</div>
    </section>

    <button type="button" onClick="{{copyPix}}" aria-live="polite" style="{{copyStyle}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>
      <span>{{copyLabel}}</span>
    </button>

    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; color: #625750">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <span>Expira em 9:58</span>
    </div>

    <div style="height: 1px; background: #E5DDD2"></div>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <label for="cpf" style="font-size: 16px; font-weight: 700">CPF na nota <span style="font-weight: 500; color: #625750">(opcional)</span></label>
      <input id="cpf" type="text" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; border-radius: 16px; border: 1px solid #D8CEC0; background: #FFFFFF; color: #2B211C; font-size: 16px">
      <div style="font-size: 14px; color: #625750">Usamos o CPF só para a nota fiscal.</div>
    </section>

    <section aria-label="Cartão" style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 20px; background: #FFFFFF">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#625750" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>
      <span style="font-size: 16px; font-weight: 600; color: #625750">Cartão: peça ao garçom</span>
    </section>
  </main>

  <footer style="flex-shrink: 0; padding: 14px 20px 26px; background: #FFFFFF; border-top: 1px solid #E5DDD2">
    <a href="Q9-Pago.dc.html" style="height: 60px; border-radius: 30px; background: #4E3426; color: #FAF6F0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Já paguei</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { copied: false };
  }
  renderVals() {
    const copied = this.state.copied;
    return {
      copyLabel: copied ? 'Código copiado' : 'Copiar código Pix',
      copyStyle: 'height: 56px; border-radius: 28px; border: 0; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 700; ' +
        (copied ? 'background: #DCDFD2; color: #4F6B45;' : 'background: #EFE4C9; color: #2B211C;'),
      copyPix: () => this.setState({ copied: !copied })
    };
  }
}
</script>
</body>
</html>
