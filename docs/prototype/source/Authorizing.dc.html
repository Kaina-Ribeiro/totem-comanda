<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pague na maquininha</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 720px; height: 1280px; box-sizing: border-box; background: {{accent}}; color: {{onAccent}}; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 72px 56px 48px">
  <div style="display: flex; flex-direction: column; gap: 20px">
    <div style="font-size: 20px; font-weight: 600; color: {{onAccentMuted}}">Crédito, R$ 82,80</div>
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 68px; line-height: 1; letter-spacing: -0.03em; color: {{accentTitle}}">Agora é na<br>maquininha.</h1>
    <p style="margin: 0; font-size: 23px; line-height: 1.45; color: {{onAccentMuted}}; max-width: 540px">Insira ou aproxime seu cartão no aparelho logo abaixo da tela e siga as instruções dele.</p>
  </div>

  <a href="Success.dc.html" aria-label="Maquininha de pagamento (toque para simular pagamento aprovado)" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px">
    <div style="width: 264px; height: 400px; border-radius: 36px; background: {{device}}; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
      <div style="height: 168px; border-radius: 18px; background: {{ground}}; color: {{ink}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
        <div style="font-size: 15px; color: {{muted}}">Valor</div>
        <div style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 34px">R$ 82,80</div>
        <div style="font-size: 14px; color: {{muted}}">Aproxime ou insira</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <div style="height: 40px; border-radius: 10px; background: {{deviceKey}}"></div>
        <div style="height: 40px; border-radius: 10px; background: {{deviceKey}}"></div>
        <div style="height: 40px; border-radius: 10px; background: {{deviceKey}}"></div>
        <div style="height: 40px; border-radius: 10px; background: {{deviceKey}}"></div>
        <div style="height: 40px; border-radius: 10px; background: {{deviceKey}}"></div>
        <div style="height: 40px; border-radius: 10px; background: {{deviceKey}}"></div>
        <div style="height: 40px; border-radius: 10px; background: {{deviceKey}}"></div>
        <div style="height: 40px; border-radius: 10px; background: {{deviceKey}}"></div>
        <div style="height: 40px; border-radius: 10px; background: {{detail}}"></div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; font-size: 21px; font-weight: 600">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{detail}}" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path></svg>
      Aguardando o pagamento
    </div>
  </a>

  <a href="Payment.dc.html" style="height: 88px; border-radius: 44px; border: 2px solid {{ghostBorder}}; display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 700">Cancelar e escolher outra forma</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["padaria","tomate","verde","acafrao"],"default":"padaria"},"$preview":{"width":720,"height":1280}}'>
class Component extends DCLogic {
  renderVals() {
    const THEMES = {
      padaria: { ground:'#F3EFE8', ink:'#2B211C', muted:'#625750', accent:'#4E3426', onAccent:'#FAF6F0', onAccentMuted:'#D9C8B8', accentTitle:'#FAF6F0', detail:'#D8B98A', device:'#1F1814', deviceKey:'#3A2C24', ghostBorder:'rgba(250,246,240,0.3)' },
      verde: { ground:'#EEECE6', ink:'#141A17', muted:'#5B615C', accent:'#1F3D31', onAccent:'#F4F2EC', onAccentMuted:'#D9D5CB', accentTitle:'#F4F2EC', detail:'#B9892C', device:'#141A17', deviceKey:'#2A3330', ghostBorder:'rgba(244,242,236,0.35)' },
      tomate: { ground:'#F3F2ED', ink:'#1B1816', muted:'#5F5B57', accent:'#C8341F', onAccent:'#FFF6F1', onAccentMuted:'#FFD9CF', accentTitle:'#FFF6F1', detail:'#FFD9CF', device:'#1B1816', deviceKey:'#3A2D2A', ghostBorder:'rgba(255,246,241,0.4)' },
      acafrao: { ground:'#EFEEE9', ink:'#17181C', muted:'#5E5D59', accent:'#17181C', onAccent:'#F7F5EF', onAccentMuted:'#C9C6BD', accentTitle:'#F2B134', detail:'#F2B134', device:'#2A2B31', deviceKey:'#3B3C44', ghostBorder:'rgba(247,245,239,0.3)' }
    };
    return THEMES[this.props.theme ?? 'padaria'] || THEMES.padaria;
  }
}
</script>
</body>
</html>
