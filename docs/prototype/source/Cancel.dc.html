<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cancelar pedido</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 720px; height: 1280px; box-sizing: border-box; background: rgba(20,26,23,0.72); color: {{ink}}; font-family: Manrope, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 48px; overflow: hidden">
  <div role="alertdialog" aria-modal="true" aria-labelledby="cancel-title" aria-describedby="cancel-desc" style="width: 100%; background: {{surface}}; border-radius: 40px; padding: 52px 48px 44px; display: flex; flex-direction: column; gap: 32px">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <h1 id="cancel-title" style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 50px; letter-spacing: -0.02em; line-height: 1.05">Cancelar o pedido?</h1>
      <p id="cancel-desc" style="margin: 0; font-size: 22px; line-height: 1.45; color: {{muted}}">Os 3 itens serão removidos e o totem volta para a tela inicial.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 14px">
      <a href="Cart.dc.html" style="height: 100px; border-radius: 50px; background: {{accent}}; color: {{onAccent}}; display: flex; align-items: center; justify-content: center; font-size: 25px; font-weight: 700">Não, continuar o pedido</a>
      <a href="Main.dc.html" style="height: 100px; border-radius: 50px; background: {{ground}}; color: {{danger}}; display: flex; align-items: center; justify-content: center; font-size: 25px; font-weight: 700">Sim, cancelar</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["padaria","tomate","verde","acafrao"],"default":"padaria"},"$preview":{"width":720,"height":1280}}'>
class Component extends DCLogic {
  renderVals() {
    const THEMES = {
      padaria: { ground:'#F3EFE8', surface:'#FFFFFF', ink:'#2B211C', muted:'#625750', accent:'#2B211C', onAccent:'#FAF6F0', danger:'#A3472F' },
      verde: { ground:'#EEECE6', surface:'#FFFFFF', ink:'#141A17', muted:'#5B615C', accent:'#1F3D31', onAccent:'#F4F2EC', danger:'#9C2F2F' },
      tomate: { ground:'#F3F2ED', surface:'#FFFFFF', ink:'#1B1816', muted:'#5F5B57', accent:'#1B1816', onAccent:'#FFF6F1', danger:'#C8341F' },
      acafrao: { ground:'#EFEEE9', surface:'#FFFFFF', ink:'#17181C', muted:'#5E5D59', accent:'#17181C', onAccent:'#F7F5EF', danger:'#9C2F2F' }
    };
    return THEMES[this.props.theme ?? 'padaria'] || THEMES.padaria;
  }
}
</script>
</body>
</html>
