<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tela de espera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<a href="OrderType.dc.html" aria-label="Toque para começar seu pedido" style="width: 720px; height: 1280px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; background: #2A1C16; color: #FAF6F0; font-family: Manrope, system-ui, sans-serif">
  <img src="{{heroImg}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{heroPos}}">
  <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(42,28,22,0.95) 0%, rgba(42,28,22,0.75) 30%, rgba(42,28,22,0.12) 58%, rgba(42,28,22,0) 75%)"></div>
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 220px; background: linear-gradient(to bottom, rgba(42,28,22,0.55), rgba(42,28,22,0))"></div>

  <div style="position: absolute; top: 56px; left: 56px; right: 56px; display: flex; justify-content: space-between; align-items: baseline">
    <div style="font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 500; font-size: 34px; letter-spacing: -0.01em">{{brandName}}</div>
    <div style="font-size: 17px; font-weight: 600; color: #E6DACB">{{tagline}}</div>
  </div>

  <div style="position: relative; padding: 0 56px 56px; display: flex; flex-direction: column; gap: 36px">
    <div style="display: flex; flex-direction: column; gap: 18px">
      <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 100px; line-height: 0.94; letter-spacing: -0.03em; text-wrap: balance">{{headline1}}<br>{{headline2}}</h1>
      <p style="margin: 0; max-width: 540px; font-size: 25px; line-height: 1.4; color: #E6DACB">{{subline}}</p>
    </div>
    <div style="height: 120px; border-radius: 60px; background: {{heroPill}}; color: {{heroPillText}}; display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 44px">
      <span style="font-size: 32px; font-weight: 700; letter-spacing: -0.01em">Toque para começar</span>
      <span style="width: 88px; height: 88px; border-radius: 44px; background: {{heroDot}}; color: {{heroDotFg}}; display: flex; align-items: center; justify-content: center">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"></path><path d="M12 10.5V9a1.5 1.5 0 0 1 3 0v2"></path><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7l-1.6-2.5a1.5 1.5 0 0 1 2.4-1.8L9 15.5"></path></svg>
      </span>
    </div>
  </div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["padaria","tomate","verde","acafrao"],"default":"padaria"},"$preview":{"width":720,"height":1280}}'>
class Component extends DCLogic {
  renderVals() {
    const THEMES = {
      padaria: { heroPill:'#FAF6F0', heroPillText:'#2B211C', heroDot:'#4E3426', heroDotFg:'#FAF6F0' },
      verde: { heroPill:'#F4F2EC', heroPillText:'#141A17', heroDot:'#1F3D31', heroDotFg:'#F4F2EC' },
      tomate: { heroPill:'#FFF6F1', heroPillText:'#1B1816', heroDot:'#C8341F', heroDotFg:'#FFF6F1' },
      acafrao: { heroPill:'#F2B134', heroPillText:'#17181C', heroDot:'#17181C', heroDotFg:'#F2B134' }
    };
    const theme = this.props.theme ?? 'padaria';
    const bakery = theme === 'padaria';
    return {
      ...(THEMES[theme] || THEMES.padaria),
      heroImg: bakery ? '/_blob/46a87c2662c0f46e489ab5d8b98fb5df' : '/_blob/4071be5cef256c46e73b48a335746b09',
      heroPos: bakery ? '42% 50%' : '70% 55%',
      brandName: bakery ? '[Nome da padaria]' : '[Nome do restaurante]',
      tagline: bakery ? 'Pães, doces e café' : 'Pedidos no totem',
      headline1: bakery ? 'Fornada fresca,' : 'Peça aqui,',
      headline2: 'sem fila.',
      subline: bakery ? 'Escolha seus pães, doces e café aqui e retire no balcão.' : 'Monte seu pedido na tela e pague com Pix ou cartão na maquininha.'
    };
  }
}
</script>
</body>
</html>
