<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Comer aqui ou para viagem</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 720px; height: 1280px; box-sizing: border-box; background: {{ground}}; color: {{ink}}; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 200px; flex-shrink: 0; padding: 48px 56px 0; display: flex; flex-direction: column; gap: 20px">
    <a href="Main.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 20px 0 12px; border-radius: 26px; background: {{surface}}; font-size: 19px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Início
    </a>
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 50px; letter-spacing: -0.02em">Onde você vai comer?</h1>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 24px 32px 32px">
    <a href="Menu.dc.html" style="flex: 1; border-radius: 36px; background: {{accent}}; color: {{onAccent}}; display: flex; flex-direction: column; justify-content: space-between; padding: 44px 48px">
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="{{iconDark}}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"></path><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"></path><path d="M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3"></path></svg>
        <span style="width: 64px; height: 64px; border-radius: 32px; background: {{arrowDarkBg}}; color: {{arrowDarkFg}}; display: flex; align-items: center; justify-content: center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg>
        </span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 76px; line-height: 1; letter-spacing: -0.03em; color: {{accentTitle}}">Comer aqui</div>
        <div style="font-size: 23px; color: {{onAccentMuted}}">{{eatInLine}}</div>
      </div>
    </a>

    <a href="Menu.dc.html" style="flex: 1; border-radius: 36px; background: {{card2}}; color: {{ink}}; display: flex; flex-direction: column; justify-content: space-between; padding: 44px 48px">
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="{{iconLight}}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 13H6L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
        <span style="width: 64px; height: 64px; border-radius: 32px; background: {{arrowLightBg}}; color: {{arrowLightFg}}; display: flex; align-items: center; justify-content: center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg>
        </span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 76px; line-height: 1; letter-spacing: -0.03em">Para viagem</div>
        <div style="font-size: 23px; color: {{muted}}">Embalamos tudo para você levar</div>
      </div>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["padaria","tomate","verde","acafrao"],"default":"padaria"},"$preview":{"width":720,"height":1280}}'>
class Component extends DCLogic {
  renderVals() {
    const THEMES = {
      padaria: { ground:'#F3EFE8', surface:'#FFFFFF', card2:'#EFE4C9', ink:'#2B211C', muted:'#625750', accent:'#4E3426', onAccent:'#FAF6F0', onAccentMuted:'#D9C8B8', accentTitle:'#FAF6F0', iconDark:'#D8B98A', iconLight:'#8A5A2B', arrowDarkBg:'rgba(250,246,240,0.16)', arrowDarkFg:'#FAF6F0', arrowLightBg:'#FFFFFF', arrowLightFg:'#2B211C' },
      verde: { ground:'#EEECE6', surface:'#FFFFFF', card2:'#FFFFFF', ink:'#141A17', muted:'#5B615C', accent:'#1F3D31', onAccent:'#F4F2EC', onAccentMuted:'#D9D5CB', accentTitle:'#F4F2EC', iconDark:'#B9892C', iconLight:'#B9892C', arrowDarkBg:'rgba(244,242,236,0.14)', arrowDarkFg:'#F4F2EC', arrowLightBg:'#EEECE6', arrowLightFg:'#141A17' },
      tomate: { ground:'#F3F2ED', surface:'#FFFFFF', card2:'#FFFFFF', ink:'#1B1816', muted:'#5F5B57', accent:'#C8341F', onAccent:'#FFF6F1', onAccentMuted:'#FFD9CF', accentTitle:'#FFF6F1', iconDark:'#FFD9CF', iconLight:'#C8341F', arrowDarkBg:'rgba(255,246,241,0.16)', arrowDarkFg:'#FFF6F1', arrowLightBg:'#F3F2ED', arrowLightFg:'#1B1816' },
      acafrao: { ground:'#EFEEE9', surface:'#FFFFFF', card2:'#FFFFFF', ink:'#17181C', muted:'#5E5D59', accent:'#17181C', onAccent:'#F7F5EF', onAccentMuted:'#C9C6BD', accentTitle:'#F2B134', iconDark:'#F2B134', iconLight:'#17181C', arrowDarkBg:'#F2B134', arrowDarkFg:'#17181C', arrowLightBg:'#F2B134', arrowLightFg:'#17181C' }
    };
    const theme = this.props.theme ?? 'padaria';
    return {
      ...(THEMES[theme] || THEMES.padaria),
      eatInLine: theme === 'padaria' ? 'Fique no salão e retire no balcão' : 'Retire no balcão e aproveite o salão'
    };
  }
}
</script>
</body>
</html>
