<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pagamento recusado</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 720px; height: 1280px; box-sizing: border-box; background: {{ground}}; color: {{ink}}; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 72px 56px 48px">
  <div style="display: flex; align-items: center; gap: 14px">
    <div style="width: 44px; height: 44px; border-radius: 22px; background: {{danger}}; color: #FFF6F1; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg>
    </div>
    <div style="font-size: 22px; font-weight: 700">Pagamento não aprovado</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px">
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 72px; line-height: 1; letter-spacing: -0.03em">Nada foi<br>cobrado.</h1>
    <p style="margin: 0; font-size: 24px; line-height: 1.45; color: {{muted}}; max-width: 540px">A maquininha recusou a operação. Seu pedido de R$ 82,80 continua salvo. Tente de novo ou escolha outra forma de pagar.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <a href="Authorizing.dc.html" style="height: 108px; border-radius: 54px; background: {{accent}}; color: {{onAccent}}; display: flex; align-items: center; justify-content: center; font-size: 27px; font-weight: 700">Tentar novamente</a>
    <a href="Payment.dc.html" style="height: 92px; border-radius: 46px; background: {{surface}}; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">Escolher outra forma</a>
    <a href="Cancel.dc.html" style="height: 64px; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700; color: {{danger}}">Cancelar pedido</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["padaria","tomate","verde","acafrao"],"default":"padaria"},"$preview":{"width":720,"height":1280}}'>
class Component extends DCLogic {
  renderVals() {
    const THEMES = {
      padaria: { ground:'#F3EFE8', surface:'#FFFFFF', ink:'#2B211C', muted:'#625750', accent:'#2B211C', onAccent:'#FAF6F0', danger:'#A3472F' },
      verde: { ground:'#EEECE6', surface:'#FFFFFF', ink:'#141A17', muted:'#5B615C', accent:'#1F3D31', onAccent:'#F4F2EC', danger:'#9C2F2F' },
      tomate: { ground:'#F3F2ED', surface:'#FFFFFF', ink:'#1B1816', muted:'#5F5B57', accent:'#1B1816', onAccent:'#FFF6F1', danger:'#C8341F' },
      acafrao: { ground:'#EFEEE9', surface:'#FFFFFF', ink:'#17181C', muted:'#5E5D59', accent:'#17181C', onAccent:'#F7F5EF', danger:'#9C2F2F' }
    };
    return THEMES[this.props.theme ?? 'padaria'] || THEMES.padaria;
  }
}
</script>
</body>
</html>
